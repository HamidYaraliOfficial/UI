<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم مسابقات آنلاین | Quiz Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #6c5ce7;
      --accent-hover: #5a4bd1;
      --accent-light: #a29bfe;
      --success: #00b894;
      --warning: #fdcb6e;
      --danger: #e17055;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:3px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های مسابقه ===== */
    .quiz-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .quiz-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
      box-shadow:var(--shadow);
      transition:var(--transition);
      cursor:pointer;
    }
    .quiz-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-hover); }
    .quiz-card .category {
      display:inline-block; padding:2px 14px; border-radius:50px;
      font-size:0.7rem; font-weight:600;
      background:var(--accent); color:#fff;
    }
    .quiz-card .title { font-size:1.1rem; font-weight:700; margin:6px 0; }
    .quiz-card .meta {
      display:flex; gap:12px; font-size:0.8rem; color:var(--text-muted);
    }
    .quiz-card .meta span { display:flex; align-items:center; gap:4px; }
    .quiz-card .actions {
      margin-top:12px; display:flex; gap:8px;
    }
    .quiz-card .actions button {
      padding:6px 20px; border:none; border-radius:8px;
      font-weight:600; cursor:pointer; transition:var(--transition);
    }
    .quiz-card .actions .start-btn {
      background:var(--accent); color:#fff;
    }
    .quiz-card .actions .start-btn:hover { background:var(--accent-hover); }
    .quiz-card .actions .edit-btn { background:var(--warning); color:#fff; }
    .quiz-card .actions .delete-btn { background:var(--danger); color:#fff; }

    /* ===== مسابقه فعال ===== */
    .quiz-active {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .quiz-active .timer {
      font-size:2rem; font-weight:700; color:var(--accent);
      text-align:center; margin-bottom:16px;
    }
    .quiz-active .question-number {
      font-size:0.9rem; color:var(--text-muted);
    }
    .quiz-active .question-text {
      font-size:1.2rem; font-weight:600; margin:12px 0;
    }
    .quiz-active .options {
      display:flex; flex-direction:column; gap:8px;
    }
    .quiz-active .options label {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:8px;
      border:2px solid var(--border-color);
      cursor:pointer; transition:var(--transition);
    }
    .quiz-active .options label:hover { border-color:var(--accent); background:var(--bg-primary); }
    .quiz-active .options label.selected { border-color:var(--accent); background:rgba(108,92,231,0.1); }
    .quiz-active .options label.correct { border-color:var(--success); background:rgba(0,184,148,0.1); }
    .quiz-active .options label.wrong { border-color:var(--danger); background:rgba(225,112,85,0.1); }
    .quiz-active .options input[type="radio"] { accent-color:var(--accent); width:16px; height:16px; }
    .quiz-active .progress-bar {
      height:6px; background:var(--bg-primary); border-radius:10px;
      margin:16px 0; overflow:hidden;
    }
    .quiz-active .progress-bar .fill {
      height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius:10px; transition:width 0.5s ease;
    }
    .quiz-active .next-btn {
      width:100%; padding:10px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-weight:600; font-size:1rem;
      cursor:pointer; transition:var(--transition);
    }
    .quiz-active .next-btn:hover { background:var(--accent-hover); }

    /* ===== نتیجه ===== */
    .result-container {
      text-align:center; padding:30px;
    }
    .result-container .score {
      font-size:4rem; font-weight:700; color:var(--accent);
    }
    .result-container .label { font-size:1.1rem; color:var(--text-secondary); }
    .result-container .rank {
      margin:12px 0; font-size:1.2rem;
    }
    .result-container .certificate-btn {
      padding:10px 32px; background:var(--success); color:#fff;
      border:none; border-radius:8px; font-weight:600; cursor:pointer;
      transition:var(--transition);
    }
    .result-container .certificate-btn:hover { opacity:0.8; }

    /* ===== جدول رده‌بندی ===== */
    .leaderboard-table {
      width:100%; border-collapse:collapse;
    }
    .leaderboard-table th {
      text-align:right; padding:10px 12px; color:var(--text-muted);
      border-bottom:2px solid var(--border-color); font-weight:600;
      font-size:0.7rem; text-transform:uppercase;
    }
    .leaderboard-table td {
      padding:10px 12px; border-bottom:1px solid var(--border-color);
    }
    .leaderboard-table .rank-badge {
      display:inline-block; width:28px; height:28px; border-radius:50%;
      background:var(--accent); color:#fff; text-align:center; line-height:28px;
      font-weight:700; font-size:0.8rem;
    }
    .leaderboard-table .rank-badge.gold { background:#fdcb6e; color:#1a1a2e; }
    .leaderboard-table .rank-badge.silver { background:#b2bec3; color:#1a1a2e; }
    .leaderboard-table .rank-badge.bronze { background:#e17055; color:#fff; }

    /* ===== گواهینامه ===== */
    .certificate {
      background:var(--bg-card); border-radius:var(--radius);
      padding:32px; text-align:center; border:2px solid var(--accent);
      max-width:600px; margin:0 auto;
    }
    .certificate .icon { font-size:4rem; color:var(--success); margin-bottom:12px; }
    .certificate h2 { font-size:1.8rem; color:var(--accent); }
    .certificate .name { font-size:1.4rem; font-weight:700; margin:8px 0; }
    .certificate .quiz-name { font-size:1.1rem; color:var(--text-secondary); }
    .certificate .score-text { font-size:0.9rem; color:var(--text-muted); margin-top:8px; }
    .certificate .download-btn {
      margin-top:16px; padding:10px 32px; background:var(--accent);
      color:#fff; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .certificate .download-btn:hover { background:var(--accent-hover); }

    /* ===== فرم ایجاد مسابقه ===== */
    .form-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .form-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .form-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:60px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }

    /* ===== دکمه اضافه کردن سوال ===== */
    .add-question-btn {
      padding:6px 16px; background:var(--bg-primary); border:1px dashed var(--border-color);
      border-radius:8px; cursor:pointer; transition:var(--transition);
      color:var(--text-secondary);
    }
    .add-question-btn:hover { border-color:var(--accent); color:var(--accent); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:1; }
      .quiz-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .result-container .score { font-size:3rem; }
      .certificate { padding:16px; }
      .quiz-active .question-text { font-size:1rem; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .quiz-grid { grid-template-columns:1fr; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-brain"></i> <span id="brandName">مسابقه</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('home')" data-key="navHome">خانه</a>
      <a onclick="showTab('create')" data-key="navCreate">ایجاد مسابقه</a>
      <a onclick="showTab('leaderboard')" data-key="navLeaderboard">رده‌بندی</a>
      <a onclick="showTab('admin')" data-key="navAdmin">داشبورد مدیر</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب خانه ===== -->
    <div class="tab-content active" id="tab-home">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-trophy" style="color:var(--accent);"></i> <span data-key="homeTitle">مسابقات علمی</span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select id="categoryFilter" onchange="filterQuizzes()" style="padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
            <option value="all" data-key="allCategories">همه موضوعات</option>
            <option value="علوم">علوم</option>
            <option value="تاریخ">تاریخ</option>
            <option value="ورزش">ورزش</option>
            <option value="فناوری">فناوری</option>
            <option value="هنر">هنر</option>
          </select>
        </div>
      </div>
      <div class="quiz-grid" id="quizGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب مسابقه فعال ===== -->
    <div class="tab-content" id="tab-quiz-active">
      <div id="quizActiveContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب نتیجه ===== -->
    <div class="tab-content" id="tab-result">
      <div id="resultContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب گواهینامه ===== -->
    <div class="tab-content" id="tab-certificate">
      <div id="certificateContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب ایجاد مسابقه ===== -->
    <div class="tab-content" id="tab-create">
      <div class="form-section">
        <h2><i class="fas fa-plus-circle" style="color:var(--accent);"></i> <span data-key="createTitle">ایجاد مسابقه جدید</span></h2>
        <div class="form-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان مسابقه</label>
            <input type="text" id="quizTitle" placeholder="عنوان ...">
          </div>
          <div class="form-group">
            <label data-key="lblCategory">دسته‌بندی</label>
            <select id="quizCategory">
              <option value="علوم">علوم</option>
              <option value="تاریخ">تاریخ</option>
              <option value="ورزش">ورزش</option>
              <option value="فناوری">فناوری</option>
              <option value="هنر">هنر</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblTime">زمان (ثانیه)</label>
            <input type="number" id="quizTime" value="30" placeholder="۳۰">
          </div>
          <div class="form-group">
            <label data-key="lblDifficulty">سطح دشواری</label>
            <select id="quizDifficulty">
              <option value="آسان">آسان</option>
              <option value="متوسط">متوسط</option>
              <option value="سخت">سخت</option>
            </select>
          </div>
          <div class="form-group full">
            <label data-key="lblQuestions">سوالات (هر سوال در یک خط)</label>
            <textarea id="quizQuestions" rows="6" placeholder="سوال 1?گزینه1|گزینه2|گزینه3|گزینه4|پاسخ (شماره 0-3)&#10;سوال 2?گزینه1|گزینه2|گزینه3|گزینه4|پاسخ"></textarea>
          </div>
          <div class="form-group full">
            <span style="font-size:0.8rem;color:var(--text-muted);">مثال: پایتون چیست؟|زبان برنامه‌نویسی|مار|فیلم|کتاب|0</span>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="createQuiz()" data-key="saveBtn">ایجاد مسابقه</button>
          <button class="btn-secondary" onclick="clearCreateForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب رده‌بندی ===== -->
    <div class="tab-content" id="tab-leaderboard">
      <h2 style="margin-bottom:16px;"><i class="fas fa-list-ol" style="color:var(--accent);"></i> <span data-key="leaderboardTitle">جدول رده‌بندی</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <table class="leaderboard-table" id="leaderboardTable">
          <thead><tr><th>#</th><th data-key="thUser">کاربر</th><th data-key="thScore">امتیاز</th><th data-key="thQuiz">مسابقه</th></tr></thead>
          <tbody id="leaderboardBody">
            <!-- توسط JS ساخته می‌شود -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- ===== تب داشبورد مدیر ===== -->
    <div class="tab-content" id="tab-admin">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="adminTitle">داشبورد مدیر</span></h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:1.8rem;font-weight:700;color:var(--accent);" id="adminTotalQuizzes">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="adminTotalQuizzes">کل مسابقات</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:1.8rem;font-weight:700;color:var(--success);" id="adminTotalUsers">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="adminTotalUsers">کاربران</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:1.8rem;font-weight:700;color:var(--warning);" id="adminTotalAttempts">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="adminTotalAttempts">شرکت‌ها</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:1.8rem;font-weight:700;color:var(--danger);" id="adminAvgScore">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="adminAvgScore">میانگین امتیاز</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-list"></i> <span data-key="adminQuizzes">لیست مسابقات</span></h4>
          <div id="adminQuizzesList"></div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-users"></i> <span data-key="adminUsers">کاربران</span></h4>
          <div id="adminUsersList"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'مسابقه',
        navHome: 'خانه',
        navCreate: 'ایجاد مسابقه',
        navLeaderboard: 'رده‌بندی',
        navAdmin: 'داشبورد مدیر',
        homeTitle: 'مسابقات علمی',
        allCategories: 'همه موضوعات',
        createTitle: 'ایجاد مسابقه جدید',
        lblTitle: 'عنوان مسابقه',
        lblCategory: 'دسته‌بندی',
        lblTime: 'زمان (ثانیه)',
        lblDifficulty: 'سطح دشواری',
        lblQuestions: 'سوالات',
        saveBtn: 'ایجاد مسابقه',
        cancelBtn: 'انصراف',
        leaderboardTitle: 'جدول رده‌بندی',
        thUser: 'کاربر',
        thScore: 'امتیاز',
        thQuiz: 'مسابقه',
        adminTitle: 'داشبورد مدیر',
        adminTotalQuizzes: 'کل مسابقات',
        adminTotalUsers: 'کاربران',
        adminTotalAttempts: 'شرکت‌ها',
        adminAvgScore: 'میانگین امتیاز',
        adminQuizzes: 'لیست مسابقات',
        adminUsers: 'کاربران',
        startQuiz: 'شروع مسابقه',
        submitQuiz: 'ارسال پاسخ‌ها'
      },
      en: {
        brandName: 'Quiz',
        navHome: 'Home',
        navCreate: 'Create Quiz',
        navLeaderboard: 'Leaderboard',
        navAdmin: 'Admin Dashboard',
        homeTitle: 'Science Quizzes',
        allCategories: 'All Categories',
        createTitle: 'Create New Quiz',
        lblTitle: 'Quiz Title',
        lblCategory: 'Category',
        lblTime: 'Time (seconds)',
        lblDifficulty: 'Difficulty',
        lblQuestions: 'Questions',
        saveBtn: 'Create Quiz',
        cancelBtn: 'Cancel',
        leaderboardTitle: 'Leaderboard',
        thUser: 'User',
        thScore: 'Score',
        thQuiz: 'Quiz',
        adminTitle: 'Admin Dashboard',
        adminTotalQuizzes: 'Total Quizzes',
        adminTotalUsers: 'Users',
        adminTotalAttempts: 'Attempts',
        adminAvgScore: 'Avg Score',
        adminQuizzes: 'Quizzes List',
        adminUsers: 'Users',
        startQuiz: 'Start Quiz',
        submitQuiz: 'Submit Answers'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let quizzes = [];
    let results = [];
    let users = [];
    let nextQuizId = 1;
    let nextResultId = 1;
    let nextUserId = 2;

    // داده‌های نمونه
    function initSampleData() {
      quizzes = [
        {
          id: 1,
          title: 'دانش عمومی',
          category: 'علوم',
          time: 30,
          difficulty: 'متوسط',
          questions: [
            { question: 'چند سیاره در منظومه شمسی وجود دارد؟', options: ['۷', '۸', '۹', '۱۰'], answer: 1 },
            { question: 'کدام یک از موارد زیر یک گاز نیست؟', options: ['اکسیژن', 'نیتروژن', 'آهن', 'هیدروژن'], answer: 2 },
            { question: 'سریع‌ترین حیوان خشکی چیست؟', options: ['شیر', 'یوزپلنگ', 'ببر', 'آهو'], answer: 1 },
            { question: 'چند درصد از سطح زمین آب است؟', options: ['۵۰%', '۶۰%', '۷۰%', '۸۰%'], answer: 2 }
          ],
          attempts: 12,
          avgScore: 68
        },
        {
          id: 2,
          title: 'تاریخ ایران',
          category: 'تاریخ',
          time: 45,
          difficulty: 'سخت',
          questions: [
            { question: 'کوروش کبیر بنیان‌گذار کدام سلسله بود؟', options: ['هخامنشی', 'ساسانی', 'اشکانی', 'صفوی'], answer: 0 },
            { question: 'جنگ چالدران بین کدام دو کشور بود؟', options: ['ایران و عثمانی', 'ایران و روسیه', 'ایران و انگلیس', 'ایران و هند'], answer: 0 },
            { question: 'دوره صفویه از چه سالی آغاز شد؟', options: ['۱۳۰۰', '۱۴۰۰', '۱۵۰۰', '۱۶۰۰'], answer: 2 }
          ],
          attempts: 8,
          avgScore: 55
        },
        {
          id: 3,
          title: 'ورزشی',
          category: 'ورزش',
          time: 20,
          difficulty: 'آسان',
          questions: [
            { question: 'تیم ملی فوتبال ایران چند بار به جام جهانی صعود کرده؟', options: ['۴', '۵', '۶', '۷'], answer: 2 },
            { question: 'بازی المپیک هر چند سال یک بار برگزار می‌شود؟', options: ['۲', '۳', '۴', '۵'], answer: 2 }
          ],
          attempts: 15,
          avgScore: 80
        }
      ];

      users = [
        { id: 1, name: 'علی رضایی', email: 'ali@email.com', quizzes: 3 },
        { id: 2, name: 'سارا محمدی', email: 'sara@email.com', quizzes: 2 }
      ];

      results = [
        { id: 1, userId: 1, quizId: 1, score: 75, total: 4, date: '۱۴۰۵/۰۲/۱۰' },
        { id: 2, userId: 1, quizId: 2, score: 66, total: 3, date: '۱۴۰۵/۰۲/۱۲' },
        { id: 3, userId: 2, quizId: 1, score: 100, total: 4, date: '۱۴۰۵/۰۲/۰۸' },
        { id: 4, userId: 2, quizId: 3, score: 100, total: 2, date: '۱۴۰۵/۰۲/۰۵' }
      ];

      nextQuizId = 4;
      nextResultId = 5;
      nextUserId = 3;
    }

    let currentQuiz = null;
    let currentQuestionIndex = 0;
    let selectedAnswers = {};
    let timerInterval = null;
    let timeLeft = 0;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { home: 0, create: 1, leaderboard: 2, admin: 3 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'home') renderQuizzes();
      if (tabName === 'leaderboard') renderLeaderboard();
      if (tabName === 'admin') renderAdmin();
    }

    // ===== رندر مسابقات =====
    function renderQuizzes(filtered = null) {
      const grid = document.getElementById('quizGrid');
      const data = filtered || quizzes;
      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ مسابقه‌ای موجود نیست</p>';
        return;
      }
      grid.innerHTML = data.map(q => `
        <div class="quiz-card">
          <span class="category">${q.category}</span>
          <div class="title">${q.title}</div>
          <div class="meta">
            <span><i class="fas fa-clock"></i> ${q.time} ثانیه</span>
            <span><i class="fas fa-signal"></i> ${q.difficulty}</span>
            <span><i class="fas fa-users"></i> ${q.attempts || 0}</span>
          </div>
          <div class="actions">
            <button class="start-btn" onclick="startQuiz(${q.id})" data-key="startQuiz">شروع مسابقه</button>
          </div>
        </div>
      `).join('');
    }

    function filterQuizzes() {
      const category = document.getElementById('categoryFilter').value;
      const filtered = category === 'all' ? quizzes : quizzes.filter(q => q.category === category);
      renderQuizzes(filtered);
    }

    // ===== شروع مسابقه =====
    function startQuiz(quizId) {
      const quiz = quizzes.find(q => q.id === quizId);
      if (!quiz) return;
      currentQuiz = quiz;
      currentQuestionIndex = 0;
      selectedAnswers = {};
      timeLeft = quiz.time;

      showTab('quiz-active');
      renderQuizActive();

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
        }
      }, 1000);
    }

    function renderQuizActive() {
      const container = document.getElementById('quizActiveContainer');
      if (!currentQuiz) return;

      const q = currentQuiz.questions[currentQuestionIndex];
      const total = currentQuiz.questions.length;
      const progress = ((currentQuestionIndex + 1) / total) * 100;

      container.innerHTML = `
        <div class="quiz-active">
          <div class="timer"><i class="fas fa-hourglass-half"></i> <span id="timerDisplay">${timeLeft}</span>s</div>
          <div class="progress-bar"><div class="fill" style="width:${progress}%;"></div></div>
          <div class="question-number">سوال ${currentQuestionIndex + 1} از ${total}</div>
          <div class="question-text">${q.question}</div>
          <div class="options" id="optionsContainer">
            ${q.options.map((opt, idx) => `
              <label class="${selectedAnswers[currentQuestionIndex] === idx ? 'selected' : ''}" onclick="selectOption(${idx})">
                <input type="radio" name="question" value="${idx}" ${selectedAnswers[currentQuestionIndex] === idx ? 'checked' : ''}>
                ${opt}
              </label>
            `).join('')}
          </div>
          <button class="next-btn" onclick="nextQuestion()">
            ${currentQuestionIndex === total - 1 ? 'پایان مسابقه' : 'سوال بعدی'}
          </button>
        </div>
      `;
    }

    function selectOption(index) {
      selectedAnswers[currentQuestionIndex] = index;
      const labels = document.querySelectorAll('#optionsContainer label');
      labels.forEach((label, i) => {
        label.classList.toggle('selected', i === index);
        const radio = label.querySelector('input');
        if (radio) radio.checked = i === index;
      });
    }

    function nextQuestion() {
      if (selectedAnswers[currentQuestionIndex] === undefined) {
        showNotification('❌ لطفاً یک گزینه را انتخاب کنید!');
        return;
      }

      if (currentQuestionIndex < currentQuiz.questions.length - 1) {
        currentQuestionIndex++;
        renderQuizActive();
      } else {
        submitQuiz();
      }
    }

    function submitQuiz() {
      if (timerInterval) clearInterval(timerInterval);

      let correct = 0;
      currentQuiz.questions.forEach((q, idx) => {
        if (selectedAnswers[idx] === q.answer) correct++;
      });

      const total = currentQuiz.questions.length;
      const score = Math.round((correct / total) * 100);

      results.push({
        id: nextResultId++,
        userId: 1,
        quizId: currentQuiz.id,
        score: score,
        total: total,
        date: new Date().toLocaleDateString('fa-IR')
      });

      currentQuiz.attempts = (currentQuiz.attempts || 0) + 1;

      showTab('result');
      document.getElementById('resultContainer').innerHTML = `
        <div class="result-container">
          <div class="score">${score}%</div>
          <div class="label">امتیاز شما</div>
          <div style="margin:8px 0;">${correct} از ${total} پاسخ صحیح</div>
          <div class="rank">🏆 رتبه شما: ${getUserRank(score)}</div>
          ${score >= 50 ? `
            <button class="certificate-btn" onclick="showCertificate(${currentQuiz.id}, ${score})">🎓 دریافت گواهینامه</button>
          ` : `
            <p style="color:var(--text-muted);">برای دریافت گواهینامه نیاز به امتیاز بالای ۵۰% دارید</p>
          `}
          <br>
          <button onclick="showTab('home')" style="margin-top:12px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">بازگشت به خانه</button>
        </div>
      `;
    }

    function getUserRank(score) {
      const allScores = results.filter(r => r.quizId === currentQuiz.id).map(r => r.score);
      allScores.push(score);
      const sorted = [...allScores].sort((a, b) => b - a);
      const rank = sorted.indexOf(score) + 1;
      if (rank === 1) return '🥇 اول';
      if (rank === 2) return '🥈 دوم';
      if (rank === 3) return '🥉 سوم';
      return `#${rank}`;
    }

    // ===== گواهینامه =====
    function showCertificate(quizId, score) {
      const quiz = quizzes.find(q => q.id === quizId);
      if (!quiz) return;
      showTab('certificate');
      document.getElementById('certificateContainer').innerHTML = `
        <div class="certificate">
          <div class="icon"><i class="fas fa-award"></i></div>
          <h2>🎓 گواهینامه</h2>
          <p style="color:var(--text-muted);">این گواهینامه به</p>
          <div class="name">علی رضایی</div>
          <p style="color:var(--text-muted);">برای شرکت در مسابقه</p>
          <div class="quiz-name">"${quiz.title}"</div>
          <div class="score-text">با امتیاز ${score}%</div>
          <p style="color:var(--text-muted);margin-top:8px;">تاریخ: ${new Date().toLocaleDateString('fa-IR')}</p>
          <button class="download-btn" onclick="showNotification('📄 گواهینامه دانلود شد!')"><i class="fas fa-download"></i> دانلود گواهینامه</button>
        </div>
      `;
    }

    // ===== ایجاد مسابقه =====
    function createQuiz() {
      const title = document.getElementById('quizTitle').value.trim();
      const category = document.getElementById('quizCategory').value;
      const time = parseInt(document.getElementById('quizTime').value);
      const difficulty = document.getElementById('quizDifficulty').value;
      const questionsText = document.getElementById('quizQuestions').value.trim();

      if (!title || !questionsText) {
        showNotification('❌ لطفاً عنوان و سوالات را وارد کنید!');
        return;
      }

      const lines = questionsText.split('\n').filter(l => l.trim());
      const questions = lines.map(line => {
        const parts = line.split('?');
        const question = parts[0].trim();
        const rest = parts[1] ? parts[1].split('|') : [];
        const options = rest.slice(0, 4);
        const answer = parseInt(rest[4]) || 0;
        return { question, options, answer };
      });

      if (questions.length === 0) {
        showNotification('❌ حداقل یک سوال وارد کنید!');
        return;
      }

      quizzes.push({
        id: nextQuizId++,
        title, category, time, difficulty,
        questions,
        attempts: 0,
        avgScore: 0
      });

      clearCreateForm();
      renderQuizzes();
      renderAdmin();
      showNotification('✅ مسابقه با موفقیت ایجاد شد!');
      showTab('home');
    }

    function clearCreateForm() {
      document.getElementById('quizTitle').value = '';
      document.getElementById('quizQuestions').value = '';
      document.getElementById('quizTime').value = '30';
    }

    // ===== رده‌بندی =====
    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboardBody');
      const sorted = [...results].sort((a, b) => b.score - a.score);
      tbody.innerHTML = sorted.slice(0, 10).map((r, i) => {
        const user = users.find(u => u.id === r.userId);
        const quiz = quizzes.find(q => q.id === r.quizId);
        const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
        return `
          <tr>
            <td><span class="rank-badge ${rankClass}">${i + 1}</span></td>
            <td>${user ? user.name : 'کاربر ناشناس'}</td>
            <td style="font-weight:700;color:var(--accent);">${r.score}%</td>
            <td style="color:var(--text-muted);">${quiz ? quiz.title : 'نامشخص'}</td>
          </tr>
        `;
      }).join('');
    }

    // ===== داشبورد مدیر =====
    function renderAdmin() {
      document.getElementById('adminTotalQuizzes').textContent = quizzes.length;
      document.getElementById('adminTotalUsers').textContent = users.length;
      document.getElementById('adminTotalAttempts').textContent = results.length;
      const avg = results.length > 0 ? Math.round(results.reduce((sum, r) => sum + r.score, 0) / results.length) : 0;
      document.getElementById('adminAvgScore').textContent = avg + '%';

      const quizList = document.getElementById('adminQuizzesList');
      quizList.innerHTML = quizzes.map(q => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span><strong>${q.title}</strong> (${q.category})</span>
          <span style="color:var(--text-muted);">${q.attempts || 0} شرکت</span>
        </div>
      `).join('');

      const userList = document.getElementById('adminUsersList');
      userList.innerHTML = users.map(u => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span><strong>${u.name}</strong></span>
          <span style="color:var(--text-muted);">${u.quizzes || 0} مسابقه</span>
        </div>
      `).join('');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderQuizzes();
    renderLeaderboard();
    renderAdmin();

    console.log('✅ پلتفرم مسابقات آنلاین کامل بارگذاری شد!');
  </script>
</body>
</html>
