<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت محتوای خبری | CMS کامل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f2f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #e74c3c;
      --accent-hover: #c0392b;
      --success: #27ae60;
      --warning: #f39c12;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر سایت ===== */
    .site-header {
      background:var(--bg-secondary);
      border-bottom:2px solid var(--accent);
      padding:12px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:var(--shadow);
    }
    .site-header .logo {
      font-size:1.6rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .site-header .logo i { font-size:1.8rem; }
    .site-header .nav-links {
      display:flex; gap:20px; align-items:center;
    }
    .site-header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      transition:var(--transition); cursor:pointer; font-size:0.9rem;
    }
    .site-header .nav-links a:hover { color:var(--accent); }
    .site-header .nav-links a.active { color:var(--accent); font-weight:700; }
    .site-header .nav-links .admin-btn {
      background:var(--accent); color:#fff; padding:6px 16px;
      border-radius:50px; font-weight:600;
    }
    .site-header .nav-links .admin-btn:hover { background:var(--accent-hover); color:#fff; }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های خبری ===== */
    .news-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .news-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
    }
    .news-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .news-card .image {
      height:180px; background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2rem; position:relative;
    }
    .news-card .image .category-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.7); color:#fff; padding:4px 12px;
      border-radius:50px; font-size:0.65rem; font-weight:600;
    }
    body.ltr .news-card .image .category-badge { right:auto; left:12px; }
    .news-card .content { padding:16px; }
    .news-card .content .title {
      font-size:1.1rem; font-weight:700; margin-bottom:8px;
      cursor:pointer; transition:var(--transition);
    }
    .news-card .content .title:hover { color:var(--accent); }
    .news-card .content .summary {
      font-size:0.9rem; color:var(--text-secondary); line-height:1.5;
      margin-bottom:12px;
    }
    .news-card .content .meta {
      display:flex; justify-content:space-between; font-size:0.75rem;
      color:var(--text-muted); border-top:1px solid var(--border-color);
      padding-top:10px;
    }
    .news-card .content .meta .author { font-weight:600; color:var(--text-secondary); }
    .news-card .content .meta .actions i {
      cursor:pointer; margin-right:10px; transition:var(--transition);
    }
    .news-card .content .meta .actions i:hover { color:var(--accent); transform:scale(1.1); }

    /* ===== فرم مدیریت ===== */
    .admin-panel {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
      box-shadow:var(--shadow);
    }
    .admin-panel h2 {
      font-size:1.3rem; margin-bottom:16px;
      display:flex; align-items:center; gap:10px;
    }
    .admin-panel .form-group {
      margin-bottom:14px;
    }
    .admin-panel .form-group label {
      display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;
    }
    .admin-panel .form-group input,
    .admin-panel .form-group select,
    .admin-panel .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.9rem;
      transition:var(--transition);
    }
    .admin-panel .form-group input:focus,
    .admin-panel .form-group select:focus,
    .admin-panel .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .admin-panel .form-group textarea { resize:vertical; min-height:100px; }
    .admin-panel .form-actions {
      display:flex; gap:10px; margin-top:16px;
    }
    .admin-panel .form-actions button {
      padding:8px 24px; border:none; border-radius:8px;
      font-weight:600; cursor:pointer; transition:var(--transition);
    }
    .admin-panel .form-actions .btn-primary {
      background:var(--accent); color:#fff;
    }
    .admin-panel .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .admin-panel .form-actions .btn-secondary {
      background:var(--bg-primary); color:var(--text-secondary);
    }
    .admin-panel .form-actions .btn-secondary:hover { background:var(--border-color); }

    /* ===== جدول مدیریت ===== */
    .table-wrap {
      overflow-x:auto; margin-top:16px;
    }
    .table-wrap table {
      width:100%; border-collapse:collapse; font-size:0.85rem;
    }
    .table-wrap th {
      text-align:right; padding:10px 8px; color:var(--text-muted);
      border-bottom:2px solid var(--border-color); font-weight:600;
      font-size:0.7rem; text-transform:uppercase;
    }
    .table-wrap td {
      padding:10px 8px; border-bottom:1px solid var(--border-color);
      color:var(--text-secondary);
    }
    .table-wrap tr:hover td { background:var(--bg-primary); }
    .table-wrap .status-badge {
      padding:2px 12px; border-radius:40px; font-size:0.6rem; font-weight:600;
    }
    .table-wrap .status-badge.published { background:rgba(39,174,96,0.15); color:var(--success); }
    .table-wrap .status-badge.draft { background:rgba(243,156,18,0.15); color:var(--warning); }
    .table-wrap .status-badge.pending { background:rgba(231,76,60,0.15); color:var(--accent); }
    .table-wrap .actions i {
      cursor:pointer; margin:0 6px; transition:var(--transition);
    }
    .table-wrap .actions i:hover { color:var(--accent); transform:scale(1.1); }

    /* ===== نظرات ===== */
    .comment-item {
      background:var(--bg-card); border-radius:var(--radius);
      padding:12px 16px; margin-bottom:10px;
      border:1px solid var(--border-color);
    }
    .comment-item .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px;
    }
    .comment-item .header .name { font-weight:600; font-size:0.9rem; }
    .comment-item .header .time { font-size:0.7rem; color:var(--text-muted); }
    .comment-item .text { font-size:0.9rem; color:var(--text-secondary); }
    .comment-item .actions i {
      cursor:pointer; margin-right:10px; font-size:0.8rem;
      transition:var(--transition);
    }
    .comment-item .actions i:hover { color:var(--accent); }

    /* ===== آرشیو ===== */
    .archive-list {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
      gap:12px;
    }
    .archive-item {
      background:var(--bg-card); padding:12px 16px;
      border-radius:var(--radius); border:1px solid var(--border-color);
      cursor:pointer; transition:var(--transition);
    }
    .archive-item:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
    .archive-item .date { font-weight:600; color:var(--accent); }
    .archive-item .count { font-size:0.8rem; color:var(--text-muted); }

    /* ===== جستجو ===== */
    .search-box {
      display:flex; gap:10px; margin-bottom:20px;
    }
    .search-box input {
      flex:1; padding:10px 16px; border:1px solid var(--border-color);
      border-radius:var(--radius); background:var(--bg-card);
      color:var(--text-primary); font-size:0.95rem;
      transition:var(--transition);
    }
    .search-box input:focus { border-color:var(--accent); outline:none; }
    .search-box button {
      padding:10px 24px; background:var(--accent); color:#fff;
      border:none; border-radius:var(--radius); font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .search-box button:hover { background:var(--accent-hover); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .site-header { flex-wrap:wrap; gap:10px; padding:10px 16px; }
      .site-header .nav-links { flex-wrap:wrap; gap:10px; }
      .news-grid { grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); }
    }
    @media (max-width:768px) {
      .site-header .logo { font-size:1.2rem; }
      .site-header .nav-links a { font-size:0.8rem; }
      .main-content { padding:12px; }
      .news-grid { grid-template-columns:1fr; }
      .admin-panel { padding:16px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .search-box { flex-direction:column; }
    }
    @media (max-width:480px) {
      .site-header .logo span { display:none; }
      .news-card .image { height:140px; }
      .table-wrap table { font-size:0.75rem; }
    }

    body.ltr { direction:ltr; text-align:left; }
    body.ltr .news-card .image .category-badge { right:auto; left:12px; }
    body.ltr .comment-item .actions i { margin-right:0; margin-left:10px; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر سایت ===== -->
  <header class="site-header">
    <div class="logo"><i class="fas fa-newspaper"></i> <span id="brandName">خبرنگار</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('home')" data-key="navHome">خانه</a>
      <a onclick="showTab('archive')" data-key="navArchive">آرشیو</a>
      <a onclick="showTab('search')" data-key="navSearch">جستجو</a>
      <a onclick="showTab('admin')" class="admin-btn" data-key="navAdmin">پنل مدیریت</a>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب خانه ===== -->
    <div class="tab-content active" id="tab-home">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <h2 data-key="latestNews">آخرین اخبار</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <select id="categoryFilter" onchange="filterByCategory(this.value)" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);">
            <option value="all" data-key="allCategories">همه دسته‌ها</option>
            <option value="سیاست">سیاست</option>
            <option value="اقتصاد">اقتصاد</option>
            <option value="فناوری">فناوری</option>
            <option value="ورزش">ورزش</option>
            <option value="فرهنگ">فرهنگ</option>
          </select>
        </div>
      </div>
      <div class="news-grid" id="newsGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب آرشیو ===== -->
    <div class="tab-content" id="tab-archive">
      <h2 style="margin-bottom:16px;" data-key="archiveTitle">آرشیو اخبار</h2>
      <div class="archive-list" id="archiveList">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب جستجو ===== -->
    <div class="tab-content" id="tab-search">
      <h2 style="margin-bottom:16px;" data-key="searchTitle">جستجوی پیشرفته</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجو در اخبار ..." onkeyup="searchNews()">
        <button onclick="searchNews()" data-key="searchBtn">جستجو</button>
      </div>
      <div id="searchResults" class="news-grid">
        <!-- نتایج جستجو -->
      </div>
    </div>

    <!-- ===== تب پنل مدیریت ===== -->
    <div class="tab-content" id="tab-admin">
      <h2 style="margin-bottom:16px;" data-key="adminPanel">پنل مدیریت</h2>

      <!-- فرم افزودن/ویرایش -->
      <div class="admin-panel">
        <h2 id="formTitle" data-key="addArticle">افزودن مقاله جدید</h2>
        <div class="form-group">
          <label data-key="lblTitle">عنوان</label>
          <input type="text" id="articleTitle" placeholder="عنوان خبر ...">
        </div>
        <div class="form-group">
          <label data-key="lblCategory">دسته‌بندی</label>
          <select id="articleCategory">
            <option value="سیاست">سیاست</option>
            <option value="اقتصاد">اقتصاد</option>
            <option value="فناوری">فناوری</option>
            <option value="ورزش">ورزش</option>
            <option value="فرهنگ">فرهنگ</option>
          </select>
        </div>
        <div class="form-group">
          <label data-key="lblSummary">خلاصه</label>
          <textarea id="articleSummary" placeholder="خلاصه خبر ..."></textarea>
        </div>
        <div class="form-group">
          <label data-key="lblContent">متن کامل</label>
          <textarea id="articleContent" placeholder="متن کامل خبر ..." rows="4"></textarea>
        </div>
        <div class="form-group">
          <label data-key="lblAuthor">نویسنده</label>
          <input type="text" id="articleAuthor" placeholder="نام نویسنده ...">
        </div>
        <div class="form-group">
          <label data-key="lblStatus">وضعیت</label>
          <select id="articleStatus">
            <option value="published" data-key="statusPublished">منتشر شده</option>
            <option value="draft" data-key="statusDraft">پیش‌نویس</option>
            <option value="pending" data-key="statusPending">در انتظار بررسی</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="saveArticle()" id="saveBtn" data-key="saveBtn">ذخیره</button>
          <button class="btn-secondary" onclick="clearForm()" data-key="cancelBtn">انصراف</button>
          <input type="hidden" id="editId" value="">
        </div>
      </div>

      <!-- لیست مقالات -->
      <div class="admin-panel" style="margin-top:20px;">
        <h2 data-key="manageArticles">مدیریت مقالات</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-key="thTitle">عنوان</th>
                <th data-key="thCategory">دسته</th>
                <th data-key="thAuthor">نویسنده</th>
                <th data-key="thStatus">وضعیت</th>
                <th data-key="thDate">تاریخ</th>
                <th data-key="thActions">عملیات</th>
              </tr>
            </thead>
            <tbody id="articlesTable">
              <!-- توسط JS ساخته می‌شود -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== صفحه مقاله (نمایش کامل) ===== -->
    <div class="tab-content" id="tab-article">
      <div id="articleDetail">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'خبرنگار',
        navHome: 'خانه',
        navArchive: 'آرشیو',
        navSearch: 'جستجو',
        navAdmin: 'پنل مدیریت',
        latestNews: 'آخرین اخبار',
        allCategories: 'همه دسته‌ها',
        archiveTitle: 'آرشیو اخبار',
        searchTitle: 'جستجوی پیشرفته',
        searchBtn: 'جستجو',
        adminPanel: 'پنل مدیریت',
        addArticle: 'افزودن مقاله جدید',
        editArticle: 'ویرایش مقاله',
        lblTitle: 'عنوان',
        lblCategory: 'دسته‌بندی',
        lblSummary: 'خلاصه',
        lblContent: 'متن کامل',
        lblAuthor: 'نویسنده',
        lblStatus: 'وضعیت',
        statusPublished: 'منتشر شده',
        statusDraft: 'پیش‌نویس',
        statusPending: 'در انتظار بررسی',
        saveBtn: 'ذخیره',
        cancelBtn: 'انصراف',
        manageArticles: 'مدیریت مقالات',
        thTitle: 'عنوان',
        thCategory: 'دسته',
        thAuthor: 'نویسنده',
        thStatus: 'وضعیت',
        thDate: 'تاریخ',
        thActions: 'عملیات',
        noResults: 'نتیجه‌ای یافت نشد',
        readMore: 'مطالعه بیشتر',
        comments: 'نظرات',
        addComment: 'افزودن نظر',
        commentPlaceholder: 'نظر خود را بنویسید ...',
        sendComment: 'ارسال'
      },
      en: {
        brandName: 'NewsPress',
        navHome: 'Home',
        navArchive: 'Archive',
        navSearch: 'Search',
        navAdmin: 'Admin Panel',
        latestNews: 'Latest News',
        allCategories: 'All Categories',
        archiveTitle: 'News Archive',
        searchTitle: 'Advanced Search',
        searchBtn: 'Search',
        adminPanel: 'Admin Panel',
        addArticle: 'Add New Article',
        editArticle: 'Edit Article',
        lblTitle: 'Title',
        lblCategory: 'Category',
        lblSummary: 'Summary',
        lblContent: 'Full Content',
        lblAuthor: 'Author',
        lblStatus: 'Status',
        statusPublished: 'Published',
        statusDraft: 'Draft',
        statusPending: 'Pending Review',
        saveBtn: 'Save',
        cancelBtn: 'Cancel',
        manageArticles: 'Manage Articles',
        thTitle: 'Title',
        thCategory: 'Category',
        thAuthor: 'Author',
        thStatus: 'Status',
        thDate: 'Date',
        thActions: 'Actions',
        noResults: 'No results found',
        readMore: 'Read More',
        comments: 'Comments',
        addComment: 'Add Comment',
        commentPlaceholder: 'Write your comment...',
        sendComment: 'Send'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌های نمونه =====
    let articles = [
      {
        id: 1,
        title: 'افتتاح بزرگترین پروژه فناوری کشور',
        category: 'فناوری',
        summary: 'با حضور مقامات ارشد، بزرگترین پروژه فناوری کشور افتتاح شد.',

        author: 'علی رضایی',

          { id: 2, name: 'مهدی کریمی', text: 'این پروژه واقعاً تحول‌آفرین است.', time: '۵ ساعت پیش' }
        ]
      },
      {
        id: 2,

        content: 'بر اساس گزارش‌های رسمی، قیمت هر گرم طلای ۱۸ عیار امروز با کاهش ۲ درصدی به ۱,۲۰۰,۰۰۰ تومان رسید. تحلیلگران اقتصادی دلیل این کاهش را افزایش عرضه و کاهش تقاضا اعلام کرده‌اند.',
        author: 'زهرا حسینی',
        status: 'published',
        date: '۱۴۰۵/۰۲/۰۸',
        comments: []
      },
      {
        id: 3,
        title: 'تیم ملی فوتبال به مرحله نهایی صعود کرد',
        category: 'ورزش',
        summary: 'تیم ملی فوتبال کشورمان با پیروزی برابر حریف خود به مرحله نهایی مسابقات راه یافت.',
        content: 'این پیروزی ارزشمند در ورزشگاه آزادی و با حضور ۸۰ هزار تماشاگر به دست آمد. گل‌های تیم ملی توسط کریمی و طارمی در دقایق ۴۵ و ۷۸ به ثمر رسید.',
        author: 'رضا نوروزی',
        status: 'published',
        date: '۱۴۰۵/۰۲/۰۵',
        comments: []
      },
      {
        id: 4,
        title: 'جشنواره فیلم فجر آغاز شد',
        category: 'فرهنگ',
        summary: 'چهلمین دوره جشنواره فیلم فجر با حضور هنرمندان برجسته آغاز به کار کرد.',
        content: 'در این دوره از جشنواره، ۲۴ فیلم در بخش مسابقه و ۱۲ فیلم در بخش خارج از مسابقه به نمایش درمی‌آیند. مراسم افتتاحیه با حضور وزیر فرهنگ و هنرمندان سرشناس برگزار شد.',
        author: 'مریم جعفری',
        status: 'published',
        date: '۱۴۰۵/۰۲/۰۱',
        comments: []
      },
      {
        id: 5,
        title: 'جزئیات بودجه سال آینده اعلام شد',

        author: 'علی رضایی',
        status: 'draft',
        date: '۱۴۰۵/۰۱/۲۸',
        comments: []
      },
      {
        id: 6,
        title: 'رونمایی از جدیدترین گوشی هوشمند',
        category: 'فناوری',
        summary: 'شرکت فناوران، جدیدترین گوشی هوشمند خود را با قابلیت‌های منحصر‌به‌فرد رونمایی کرد.',
        content: 'این گوشی با دوربین ۲۰۰ مگاپیکسلی، پردازنده نسل جدید و باتری ۶۰۰۰ میلی‌آمپر ساعتی، تحولی در صنعت موبایل ایجاد خواهد کرد. قیمت این گوشی ۱,۲۰۰ دلار اعلام شده است.',
        author: 'سارا محمدی',
        status: 'pending',
        date: '۱۴۰۵/۰۱/۲۵',
        comments: []
      }
    ];

    let nextId = 7;
    let currentView = 'home';

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { home: 0, archive: 1, search: 2, admin: 3 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      currentView = tabName;
      if (tabName === 'home') renderNews();
      if (tabName === 'archive') renderArchive();
      if (tabName === 'admin') renderAdminTable();
      if (tabName === 'search') document.getElementById('searchResults').innerHTML = '';
    }

    // ===== رندر اخبار =====
    function renderNews(category = 'all') {
      const grid = document.getElementById('newsGrid');
      let filtered = articles.filter(a => a.status === 'published');
      if (category !== 'all') filtered = filtered.filter(a => a.category === category);
      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;" data-key="noResults">نتیجه‌ای یافت نشد</p>`;
        return;
      }
      grid.innerHTML = filtered.map(a => `
        <div class="news-card">
          <div class="image">
            <i class="fas fa-image"></i>
            <span class="category-badge">${a.category}</span>
          </div>
          <div class="content">
            <div class="title" onclick="viewArticle(${a.id})">${a.title}</div>
            <div class="summary">${a.summary}</div>
            <div class="meta">
              <span><span class="author">${a.author}</span> · ${a.date}</span>
              <span class="actions">
                <i class="fas fa-comment" onclick="event.stopPropagation();viewArticle(${a.id})" title="نظرات (${a.comments.length})"></i>
                <i class="fas fa-eye" onclick="event.stopPropagation();viewArticle(${a.id})" title="مشاهده"></i>
              </span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== فیلتر دسته‌بندی =====
    function filterByCategory(category) {
      renderNews(category);
    }

    // ===== نمایش مقاله کامل =====
    function viewArticle(id) {
      const article = articles.find(a => a.id === id);
      if (!article) return;
      showTab('article');
      const container = document.getElementById('articleDetail');
      container.innerHTML = `
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:24px;border:1px solid var(--border-color);">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
            <span style="background:var(--accent);color:#fff;padding:4px 14px;border-radius:50px;font-size:0.75rem;font-weight:600;">${article.category}</span>
            <span style="color:var(--text-muted);font-size:0.8rem;">${article.date}</span>
          </div>
          <h1 style="font-size:1.8rem;margin-bottom:8px;">${article.title}</h1>
          <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:12px;">نویسنده: ${article.author}</p>
          <p style="font-size:1rem;line-height:1.8;margin-bottom:16px;">${article.content}</p>
          <button onclick="showTab('home')" style="background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-weight:600;">بازگشت</button>
          <div style="margin-top:20px;border-top:1px solid var(--border-color);padding-top:16px;">
            <h4 data-key="comments">نظرات (${article.comments.length})</h4>
            ${article.comments.map(c => `
              <div class="comment-item">
                <div class="header"><span class="name">${c.name}</span><span class="time">${c.time}</span></div>
                <div class="text">${c.text}</div>
              </div>
            `).join('')}
            <div style="display:flex;gap:10px;margin-top:12px;">
              <input type="text" id="commentInput" placeholder="نظر خود را بنویسید ..." style="flex:1;padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
              <button onclick="addComment(${article.id})" style="background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-weight:600;" data-key="sendComment">ارسال</button>
            </div>
          </div>
        </div>
      `;
    }

    // ===== افزودن کامنت =====
    function addComment(articleId) {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) { showNotification('لطفاً متن نظر را وارد کنید!'); return; }
      const article = articles.find(a => a.id === articleId);
      if (!article) return;
      article.comments.push({
        id: Date.now(),
        name: 'کاربر مهمان',
        text: text,
        time: 'همین الان'
      });
      input.value = '';
      viewArticle(articleId);
      showNotification('نظر شما با موفقیت ثبت شد ✅');
    }

    // ===== رندر آرشیو =====
    function renderArchive() {
      const container = document.getElementById('archiveList');
      const grouped = {};
      articles.filter(a => a.status === 'published').forEach(a => {
        const month = a.date.substring(0, 7);
        if (!grouped[month]) grouped[month] = [];
        grouped[month].push(a);
      });
      const months = Object.keys(grouped).sort().reverse();
      container.innerHTML = months.map(month => `
        <div class="archive-item" onclick="filterByMonth('${month}')">
          <div class="date">${month.replace('1405/', '')}</div>
          <div class="count">${grouped[month].length} خبر</div>
        </div>
      `).join('');
    }

    function filterByMonth(month) {
      const filtered = articles.filter(a => a.status === 'published' && a.date.startsWith(month));
      showTab('home');
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = filtered.map(a => `
        <div class="news-card">
          <div class="image"><i class="fas fa-image"></i><span class="category-badge">${a.category}</span></div>
          <div class="content">
            <div class="title" onclick="viewArticle(${a.id})">${a.title}</div>
            <div class="summary">${a.summary}</div>
            <div class="meta"><span><span class="author">${a.author}</span> · ${a.date}</span></div>
          </div>
        </div>
      `).join('');
      showNotification('نمایش اخبار ماه ' + month);
    }

    // ===== جستجو =====
    function searchNews() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const results = document.getElementById('searchResults');
      if (!query) { results.innerHTML = ''; return; }
      const filtered = articles.filter(a =>
        a.title.toLowerCase().includes(query) ||
        a.summary.toLowerCase().includes(query) ||
        a.content.toLowerCase().includes(query) ||
        a.category.includes(query) ||
        a.author.includes(query)
      );
      if (filtered.length === 0) {
        results.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;" data-key="noResults">نتیجه‌ای یافت نشد</p>`;
      } else {
        results.innerHTML = filtered.map(a => `
          <div class="news-card">
            <div class="image"><i class="fas fa-image"></i><span class="category-badge">${a.category}</span></div>
            <div class="content">
              <div class="title" onclick="viewArticle(${a.id})">${a.title}</div>
              <div class="summary">${a.summary}</div>
              <div class="meta"><span><span class="author">${a.author}</span> · ${a.date}</span></div>
            </div>
          </div>
        `).join('');
      }
    }

    // ===== مدیریت مقالات (پنل مدیریت) =====
    function renderAdminTable() {
      const tbody = document.getElementById('articlesTable');
      tbody.innerHTML = articles.map(a => `
        <tr>
          <td>${a.title}</td>
          <td>${a.category}</td>
          <td>${a.author}</td>
          <td><span class="status-badge ${a.status}">${a.status === 'published' ? 'منتشر شده' : a.status === 'draft' ? 'پیش‌نویس' : 'در انتظار بررسی'}</span></td>
          <td>${a.date}</td>
          <td class="actions">
            <i class="fas fa-edit" onclick="editArticle(${a.id})" title="ویرایش"></i>
            <i class="fas fa-trash" onclick="deleteArticle(${a.id})" title="حذف" style="color:var(--accent);"></i>
            <i class="fas fa-eye" onclick="viewArticle(${a.id})" title="مشاهده"></i>
          </td>
        </tr>
      `).join('');
    }

    // ===== ذخیره مقاله =====
    function saveArticle() {
      const title = document.getElementById('articleTitle').value.trim();
      const category = document.getElementById('articleCategory').value;
      const summary = document.getElementById('articleSummary').value.trim();
      const content = document.getElementById('articleContent').value.trim();
      const author = document.getElementById('articleAuthor').value.trim();
      const status = document.getElementById('articleStatus').value;
      const editId = document.getElementById('editId').value;

      if (!title || !summary || !content || !author) {
        showNotification('لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      const now = new Date();
      const date = now.getFullYear() + '/' +
                   String(now.getMonth()+1).padStart(2,'0') + '/' +
                   String(now.getDate()).padStart(2,'0');

      if (editId) {
        const article = articles.find(a => a.id === parseInt(editId));
        if (article) {
          article.title = title;
          article.category = category;
          article.summary = summary;
          article.content = content;
          article.author = author;
          article.status = status;
          article.date = date;
          showNotification('مقاله با موفقیت ویرایش شد ✏️');
        }
      } else {
        articles.push({
          id: nextId++,
          title, category, summary, content, author, status, date,
          comments: []
        });
        showNotification('مقاله با موفقیت اضافه شد ✅');
      }

      clearForm();
      renderAdminTable();
      renderNews();
    }

    // ===== ویرایش مقاله =====
    function editArticle(id) {
      const article = articles.find(a => a.id === id);
      if (!article) return;
      document.getElementById('articleTitle').value = article.title;
      document.getElementById('articleCategory').value = article.category;
      document.getElementById('articleSummary').value = article.summary;
      document.getElementById('articleContent').value = article.content;
      document.getElementById('articleAuthor').value = article.author;
      document.getElementById('articleStatus').value = article.status;
      document.getElementById('editId').value = article.id;
      document.getElementById('formTitle').textContent = currentLang === 'fa' ? 'ویرایش مقاله' : 'Edit Article';
      document.getElementById('saveBtn').textContent = currentLang === 'fa' ? 'به‌روزرسانی' : 'Update';
      showTab('admin');
      document.querySelector('.admin-panel').scrollIntoView({ behavior: 'smooth' });
    }

    // ===== حذف مقاله =====
    function deleteArticle(id) {
      if (confirm('آیا از حذف این مقاله اطمینان دارید؟')) {
        articles = articles.filter(a => a.id !== id);
        renderAdminTable();
        renderNews();
        showNotification('مقاله حذف شد 🗑️');
      }
    }

    // ===== پاک کردن فرم =====
    function clearForm() {
      document.getElementById('articleTitle').value = '';
      document.getElementById('articleSummary').value = '';
      document.getElementById('articleContent').value = '';
      document.getElementById('articleAuthor').value = '';
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').textContent = currentLang === 'fa' ? 'افزودن مقاله جدید' : 'Add New Article';
      document.getElementById('saveBtn').textContent = currentLang === 'fa' ? 'ذخیره' : 'Save';
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    setLanguage('fa');
    renderNews();
    renderArchive();
    renderAdminTable();

    console.log('✅ سیستم مدیریت محتوای خبری کامل بارگذاری شد!');
  </script>
</body>
