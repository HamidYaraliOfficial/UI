<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت انبار | Inventory Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #2980b9;
      --accent-hover: #1a6d9e;
      --accent-light: #3498db;
      --success: #27ae60;
      --warning: #f39c12;
      --danger: #e74c3c;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:3px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; color:var(--accent-light); }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های کالا ===== */
    .product-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .product-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
      box-shadow:var(--shadow);
      transition:var(--transition);
      text-align:center;
    }
    .product-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .product-card .icon {
      font-size:3rem; margin-bottom:4px;
    }
    .product-card .name { font-weight:700; font-size:0.95rem; }
    .product-card .sku { font-size:0.7rem; color:var(--text-muted); }
    .product-card .stock {
      font-size:1.2rem; font-weight:700; margin:4px 0;
    }
    .product-card .stock.low { color:var(--danger); }
    .product-card .stock.medium { color:var(--warning); }
    .product-card .stock.high { color:var(--success); }
    .product-card .category {
      display:inline-block; padding:2px 14px; border-radius:50px;
      font-size:0.65rem; background:var(--bg-primary);
      color:var(--text-muted);
    }
    .product-card .barcode {
      font-family: 'Courier New', monospace;
      font-size:0.85rem; letter-spacing:2px;
      padding:4px; background:var(--bg-primary); border-radius:4px;
      margin:6px 0; color:var(--text-secondary);
    }
    .product-card .actions {
      display:flex; gap:4px; justify-content:center; margin-top:6px;
    }
    .product-card .actions button {
      padding:4px 12px; border:none; border-radius:6px;
      cursor:pointer; font-size:0.7rem; font-weight:600;
      transition:var(--transition);
    }
    .product-card .actions .edit-btn { background:var(--warning); color:#fff; }
    .product-card .actions .edit-btn:hover { opacity:0.8; }
    .product-card .actions .delete-btn { background:var(--danger); color:#fff; }
    .product-card .actions .delete-btn:hover { opacity:0.8; }

    /* ===== فرم ===== */
    .form-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .form-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .form-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:60px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }

    /* ===== جدول ===== */
    .table-wrap { overflow-x:auto; }
    .table-wrap table {
      width:100%; border-collapse:collapse; font-size:0.85rem;
    }
    .table-wrap th {
      text-align:right; padding:10px 8px; color:var(--text-muted);
      border-bottom:2px solid var(--border-color); font-weight:600;
      font-size:0.7rem; text-transform:uppercase;
    }
    .table-wrap td {
      padding:10px 8px; border-bottom:1px solid var(--border-color);
      color:var(--text-secondary);
    }
    .table-wrap tr:hover td { background:var(--bg-primary); }
    .table-wrap .actions i {
      cursor:pointer; margin:0 4px; transition:var(--transition);
    }
    .table-wrap .actions i:hover { color:var(--accent); transform:scale(1.1); }

    /* ===== تراکنش‌ها ===== */
    .transaction-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 12px; border-bottom:1px solid var(--border-color);
    }
    .transaction-item:last-child { border-bottom:none; }
    .transaction-item .type {
      padding:2px 12px; border-radius:50px; font-size:0.65rem; font-weight:600;
    }
    .transaction-item .type.in { background:rgba(39,174,96,0.15); color:var(--success); }
    .transaction-item .type.out { background:rgba(231,76,60,0.15); color:var(--danger); }

    /* ===== هشدار ===== */
    .alert-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:8px;
      margin-bottom:6px; border:1px solid var(--border-color);
      background:rgba(231,76,60,0.05);
    }
    .alert-item .icon { color:var(--danger); font-size:1.2rem; }
    .alert-item .info { flex:1; font-size:0.85rem; }
    .alert-item .info .name { font-weight:600; }

    /* ===== بارکد ===== */
    .barcode-display {
      font-family: 'Courier New', monospace;
      font-size:2rem; letter-spacing:4px;
      padding:12px; background:var(--bg-primary); border-radius:8px;
      text-align:center; border:1px dashed var(--border-color);
    }

    /* ===== آمار ===== */
    .stats-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .stat-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .stat-card .number { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .stat-card .label { font-size:0.85rem; color:var(--text-muted); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:1; }
      .stats-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .stats-grid { grid-template-columns:1fr; }
      .product-grid { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .product-grid { grid-template-columns:1fr; }
      .transaction-item { flex-direction:column; align-items:stretch; gap:4px; text-align:center; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-warehouse"></i> <span id="brandName">انبار</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('dashboard')" data-key="navDashboard">داشبورد</a>
      <a onclick="showTab('products')" data-key="navProducts">کالاها</a>
      <a onclick="showTab('transactions')" data-key="navTransactions">ورود/خروج</a>
      <a onclick="showTab('alerts')" data-key="navAlerts">هشدارها</a>
      <a onclick="showTab('reports')" data-key="navReports">گزارش‌ها</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب داشبورد ===== -->
    <div class="tab-content active" id="tab-dashboard">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="dashboardTitle">داشبورد انبار</span></h2>
      <div class="stats-grid" id="statsGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-clock"></i> <span data-key="recentTransactions">تراکنش‌های اخیر</span></h4>
          <div id="recentTransactions"></div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i> <span data-key="lowStockAlerts">هشدارهای موجودی کم</span></h4>
          <div id="lowStockAlerts"></div>
        </div>
      </div>
    </div>

    <!-- ===== تب کالاها ===== -->
    <div class="tab-content" id="tab-products">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-box" style="color:var(--accent);"></i> <span data-key="productsTitle">مدیریت کالاها</span></h2>
        <button onclick="showTab('addProduct')" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="addProductBtn">+ افزودن کالا</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <select id="categoryFilter" onchange="filterProducts()" style="padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
          <option value="all">همه دسته‌ها</option>
          <option value="الکترونیک">الکترونیک</option>
          <option value="پوشاک">پوشاک</option>
          <option value="غذایی">غذایی</option>
          <option value="ابزار">ابزار</option>
          <option value="لوازم خانگی">لوازم خانگی</option>
        </select>
        <input type="text" id="searchProduct" placeholder="جستجوی کالا ..." onkeyup="filterProducts()" style="flex:1;min-width:150px;padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
      </div>
      <div class="product-grid" id="productGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب افزودن کالا ===== -->
    <div class="tab-content" id="tab-addProduct">
      <div class="form-section">
        <h2><i class="fas fa-plus-circle" style="color:var(--accent);"></i> <span data-key="addProductTitle">افزودن کالا جدید</span></h2>
        <div class="form-grid">
          <div class="form-group">
            <label data-key="lblName">نام کالا</label>
            <input type="text" id="productName" placeholder="نام ...">
          </div>
          <div class="form-group">
            <label data-key="lblCategory">دسته‌بندی</label>
            <select id="productCategory">
              <option value="الکترونیک">الکترونیک</option>
              <option value="پوشاک">پوشاک</option>
              <option value="غذایی">غذایی</option>
              <option value="ابزار">ابزار</option>
              <option value="لوازم خانگی">لوازم خانگی</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblQuantity">تعداد</label>
            <input type="number" id="productQuantity" value="10">
          </div>
          <div class="form-group">
            <label data-key="lblMinStock">حداقل موجودی (هشدار)</label>
            <input type="number" id="productMinStock" value="5">
          </div>
          <div class="form-group">
            <label data-key="lblPrice">قیمت (تومان)</label>
            <input type="number" id="productPrice" placeholder="۰">
          </div>
          <div class="form-group">
            <label data-key="lblIcon">آیکون (Emoji)</label>
            <input type="text" id="productIcon" value="📦" placeholder="📦">
          </div>
          <div class="form-group full">
            <label data-key="lblDescription">توضیحات</label>
            <textarea id="productDescription" placeholder="توضیحات کالا ..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="addProduct()" data-key="saveBtn">ذخیره کالا</button>
          <button class="btn-secondary" onclick="clearProductForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب ورود/خروج ===== -->
    <div class="tab-content" id="tab-transactions">
      <h2 style="margin-bottom:16px;"><i class="fas fa-exchange-alt" style="color:var(--accent);"></i> <span data-key="transactionsTitle">ثبت ورود/خروج کالا</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);margin-bottom:16px;">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;">
          <select id="transactionProduct" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
            <option value="">انتخاب کالا ...</option>
          </select>
          <select id="transactionType" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
            <option value="in">ورود</option>
            <option value="out">خروج</option>
          </select>
          <input type="number" id="transactionQuantity" placeholder="تعداد ..." style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
          <button onclick="addTransaction()" style="padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">ثبت</button>
        </div>
      </div>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <div class="table-wrap">
          <table>
            <thead><tr><th data-key="thProduct">کالا</th><th data-key="thType">نوع</th><th data-key="thQuantity">تعداد</th><th data-key="thDate">تاریخ</th></tr></thead>
            <tbody id="transactionTable">
              <!-- توسط JS ساخته می‌شود -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== تب هشدارها ===== -->
    <div class="tab-content" id="tab-alerts">
      <h2 style="margin-bottom:16px;"><i class="fas fa-bell" style="color:var(--danger);"></i> <span data-key="alertsTitle">هشدارهای موجودی</span></h2>
      <div id="alertsContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب گزارش‌ها ===== -->
    <div class="tab-content" id="tab-reports">
      <h2 style="margin-bottom:16px;"><i class="fas fa-file-alt" style="color:var(--accent);"></i> <span data-key="reportsTitle">گزارش‌ها</span></h2>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
        <button onclick="generateReport('stock')" style="padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">📊 گزارش موجودی</button>
        <button onclick="generateReport('in')" style="padding:10px;background:var(--success);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">📥 گزارش ورود</button>
        <button onclick="generateReport('out')" style="padding:10px;background:var(--danger);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">📤 گزارش خروج</button>
      </div>
      <div id="reportResult" style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'انبار',
        navDashboard: 'داشبورد',
        navProducts: 'کالاها',
        navTransactions: 'ورود/خروج',
        navAlerts: 'هشدارها',
        navReports: 'گزارش‌ها',
        dashboardTitle: 'داشبورد انبار',
        productsTitle: 'مدیریت کالاها',
        addProductBtn: '+ افزودن کالا',
        addProductTitle: 'افزودن کالا جدید',
        lblName: 'نام کالا',
        lblCategory: 'دسته‌بندی',
        lblQuantity: 'تعداد',
        lblMinStock: 'حداقل موجودی (هشدار)',
        lblPrice: 'قیمت (تومان)',
        lblIcon: 'آیکون (Emoji)',
        lblDescription: 'توضیحات',
        saveBtn: 'ذخیره کالا',
        cancelBtn: 'انصراف',
        transactionsTitle: 'ثبت ورود/خروج کالا',
        alertsTitle: 'هشدارهای موجودی',
        reportsTitle: 'گزارش‌ها',
        recentTransactions: 'تراکنش‌های اخیر',
        lowStockAlerts: 'هشدارهای موجودی کم',
        thProduct: 'کالا',
        thType: 'نوع',
        thQuantity: 'تعداد',
        thDate: 'تاریخ'
      },
      en: {
        brandName: 'Inventory',
        navDashboard: 'Dashboard',
        navProducts: 'Products',
        navTransactions: 'In/Out',
        navAlerts: 'Alerts',
        navReports: 'Reports',
        dashboardTitle: 'Inventory Dashboard',
        productsTitle: 'Product Management',
        addProductBtn: '+ Add Product',
        addProductTitle: 'Add New Product',
        lblName: 'Product Name',
        lblCategory: 'Category',
        lblQuantity: 'Quantity',
        lblMinStock: 'Min Stock (Alert)',
        lblPrice: 'Price (USD)',
        lblIcon: 'Icon (Emoji)',
        lblDescription: 'Description',
        saveBtn: 'Save Product',
        cancelBtn: 'Cancel',
        transactionsTitle: 'In/Out Transactions',
        alertsTitle: 'Stock Alerts',
        reportsTitle: 'Reports',
        recentTransactions: 'Recent Transactions',
        lowStockAlerts: 'Low Stock Alerts',
        thProduct: 'Product',
        thType: 'Type',
        thQuantity: 'Quantity',
        thDate: 'Date'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let products = [];
    let transactions = [];
    let nextProductId = 1;
    let nextTransactionId = 1;

    // داده‌های نمونه
    function initSampleData() {
      products = [
        { id: 1, name: 'لپ‌تاپ ایسوس', category: 'الکترونیک', quantity: 12, minStock: 5, price: 25000000, icon: '💻', description: 'لپ‌تاپ قدرتمند برای برنامه‌نویسی' },
        { id: 2, name: 'هدفون بی‌سیم', category: 'الکترونیک', quantity: 8, minStock: 3, price: 4200000, icon: '🎧', description: 'هدفون با کیفیت بالا' },
        { id: 3, name: 'کیف چرمی', category: 'پوشاک', quantity: 3, minStock: 5, price: 1800000, icon: '👝', description: 'کیف چرم اصل' },
        { id: 4, name: 'برنج ۱۰ کیلویی', category: 'غذایی', quantity: 25, minStock: 10, price: 350000, icon: '🍚', description: 'برنج با کیفیت درجه یک' }
      ];

      const today = new Date();
      transactions = [
        { id: 1, productId: 1, type: 'in', quantity: 5, date: today.toLocaleDateString('fa-IR') },
        { id: 2, productId: 2, type: 'out', quantity: 2, date: today.toLocaleDateString('fa-IR') },
        { id: 3, productId: 3, type: 'in', quantity: 10, date: today.toLocaleDateString('fa-IR') }
      ];

      nextProductId = 5;
      nextTransactionId = 4;
    }

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { dashboard: 0, products: 1, addProduct: 1, transactions: 2, alerts: 3, reports: 4 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'dashboard') renderDashboard();
      if (tabName === 'products') renderProducts();
      if (tabName === 'transactions') { renderTransactions(); populateTransactionSelect(); }
      if (tabName === 'alerts') renderAlerts();
    }

    // ===== داشبورد =====
    function renderDashboard() {
      const totalProducts = products.length;
      const totalStock = products.reduce((sum, p) => sum + p.quantity, 0);
      const totalValue = products.reduce((sum, p) => sum + p.quantity * p.price, 0);
      const lowStock = products.filter(p => p.quantity <= p.minStock).length;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="number">${totalProducts}</div><div class="label">کل کالاها</div></div>
        <div class="stat-card"><div class="number">${totalStock}</div><div class="label">کل موجودی</div></div>
        <div class="stat-card"><div class="number">${totalValue.toLocaleString()}</div><div class="label">ارزش کل (تومان)</div></div>
        <div class="stat-card"><div class="number" style="color:${lowStock > 0 ? 'var(--danger)' : 'var(--success)'};">${lowStock}</div><div class="label">کالاهای کم موجودی</div></div>
      `;

      // تراکنش‌های اخیر
      const recent = document.getElementById('recentTransactions');
      if (transactions.length === 0) {
        recent.innerHTML = '<p style="color:var(--text-muted);">هیچ تراکنشی ثبت نشده است</p>';
      } else {
        recent.innerHTML = transactions.slice(-5).reverse().map(t => {
          const product = products.find(p => p.id === t.productId);
          return `
            <div class="transaction-item">
              <span class="product">${product ? product.name : 'نامشخص'}</span>
              <span class="type ${t.type === 'in' ? 'in' : 'out'}">${t.type === 'in' ? '➕ ورود' : '➖ خروج'}</span>
              <span>${t.quantity} عدد</span>
              <span style="font-size:0.7rem;color:var(--text-muted);">${t.date}</span>
            </div>
          `;
        }).join('');
      }

      // هشدارها
      const alerts = document.getElementById('lowStockAlerts');
      const lowProducts = products.filter(p => p.quantity <= p.minStock);
      if (lowProducts.length === 0) {
        alerts.innerHTML = '<p style="color:var(--success);">✅ همه کالاها در وضعیت مطلوب هستند</p>';
      } else {
        alerts.innerHTML = lowProducts.map(p => `
          <div class="alert-item">
            <span class="icon"><i class="fas fa-exclamation-circle"></i></span>
            <div class="info">
              <span class="name">${p.name}</span>
              <span>موجودی: ${p.quantity} (حداقل: ${p.minStock})</span>
            </div>
          </div>
        `).join('');
      }
    }

    // ===== رندر کالاها =====
    function renderProducts(filtered = null) {
      const grid = document.getElementById('productGrid');
      const data = filtered || products;
      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ کالایی موجود نیست</p>';
        return;
      }
      grid.innerHTML = data.map(p => {
        const stockClass = p.quantity <= p.minStock ? 'low' : p.quantity <= p.minStock * 2 ? 'medium' : 'high';
        const barcode = 'INV' + String(p.id).padStart(6, '0');
        return `
          <div class="product-card">
            <div class="icon">${p.icon || '📦'}</div>
            <div class="name">${p.name}</div>
            <div class="sku">SKU: ${barcode}</div>
            <div class="stock ${stockClass}">${p.quantity} عدد</div>
            <div class="category">${p.category}</div>
            <div class="barcode">${barcode}</div>
            <div style="font-size:0.75rem;color:var(--text-muted);">${p.price.toLocaleString()} تومان</div>
            <div class="actions">
              <button class="edit-btn" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
              <button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterProducts() {
      const category = document.getElementById('categoryFilter').value;
      const search = document.getElementById('searchProduct').value.trim().toLowerCase();
      let filtered = products;
      if (category !== 'all') filtered = filtered.filter(p => p.category === category);
      if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
      renderProducts(filtered);
    }

    // ===== افزودن کالا =====
    function addProduct() {
      const name = document.getElementById('productName').value.trim();
      const category = document.getElementById('productCategory').value;
      const quantity = parseInt(document.getElementById('productQuantity').value) || 0;
      const minStock = parseInt(document.getElementById('productMinStock').value) || 5;
      const price = parseInt(document.getElementById('productPrice').value) || 0;
      const icon = document.getElementById('productIcon').value.trim() || '📦';
      const description = document.getElementById('productDescription').value.trim();

      if (!name) { showNotification('❌ لطفاً نام کالا را وارد کنید!'); return; }

      products.push({
        id: nextProductId++,
        name, category, quantity, minStock, price, icon, description
      });

      clearProductForm();
      renderProducts();
      renderDashboard();
      populateTransactionSelect();
      showNotification('✅ کالا با موفقیت اضافه شد!');
      showTab('products');
    }

    function clearProductForm() {
      document.getElementById('productName').value = '';
      document.getElementById('productQuantity').value = '10';
      document.getElementById('productMinStock').value = '5';
      document.getElementById('productPrice').value = '';
      document.getElementById('productIcon').value = '📦';
      document.getElementById('productDescription').value = '';
    }

    // ===== ویرایش کالا =====
    function editProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      const newName = prompt('نام جدید:', product.name);
      if (newName && newName.trim()) product.name = newName.trim();
      const newPrice = prompt('قیمت جدید:', product.price);
      if (newPrice && !isNaN(newPrice)) product.price = parseInt(newPrice);
      renderProducts();
      renderDashboard();
      showNotification('✅ کالا به‌روزرسانی شد!');
    }

    // ===== حذف کالا =====
    function deleteProduct(productId) {
      if (confirm('آیا از حذف این کالا اطمینان دارید؟')) {
        const product = products.find(p => p.id === productId);
        products = products.filter(p => p.id !== productId);
        renderProducts();
        renderDashboard();
        populateTransactionSelect();
        showNotification(`🗑️ کالا "${product ? product.name : ''}" حذف شد`);
      }
    }

    // ===== تراکنش‌ها =====
    function populateTransactionSelect() {
      const select = document.getElementById('transactionProduct');
      select.innerHTML = '<option value="">انتخاب کالا ...</option>' +
        products.map(p => `<option value="${p.id}">${p.name} (${p.quantity} عدد)</option>`).join('');
    }

    function addTransaction() {
      const productId = parseInt(document.getElementById('transactionProduct').value);
      const type = document.getElementById('transactionType').value;
      const quantity = parseInt(document.getElementById('transactionQuantity').value);

      if (!productId || !quantity || quantity <= 0) {
        showNotification('❌ لطفاً کالا و تعداد معتبر وارد کنید!');
        return;
      }

      const product = products.find(p => p.id === productId);
      if (!product) return;

      if (type === 'out' && product.quantity < quantity) {
        showNotification('❌ موجودی کافی نیست!');
        return;
      }

      product.quantity += type === 'in' ? quantity : -quantity;

      transactions.push({
        id: nextTransactionId++,
        productId,
        type,
        quantity,
        date: new Date().toLocaleDateString('fa-IR')
      });

      document.getElementById('transactionQuantity').value = '';
      renderTransactions();
      renderDashboard();
      populateTransactionSelect();
      showNotification(`✅ ${type === 'in' ? 'ورود' : 'خروج'} کالا با موفقیت ثبت شد!`);
    }

    function renderTransactions() {
      const tbody = document.getElementById('transactionTable');
      if (transactions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">هیچ تراکنشی ثبت نشده است</td></tr>';
        return;
      }
      tbody.innerHTML = transactions.slice().reverse().map(t => {
        const product = products.find(p => p.id === t.productId);
        return `
          <tr>
            <td>${product ? product.name : 'نامشخص'}</td>
            <td><span class="type ${t.type === 'in' ? 'in' : 'out'}">${t.type === 'in' ? 'ورود' : 'خروج'}</span></td>
            <td>${t.quantity}</td>
            <td>${t.date}</td>
          </tr>
        `;
      }).join('');
    }

    // ===== هشدارها =====
    function renderAlerts() {
      const container = document.getElementById('alertsContainer');
      const lowProducts = products.filter(p => p.quantity <= p.minStock);
      if (lowProducts.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--success);"><i class="fas fa-check-circle" style="font-size:3rem;"></i><p style="margin-top:8px;">✅ همه کالاها در وضعیت مطلوب هستند</p></div>';
        return;
      }
      container.innerHTML = lowProducts.map(p => `
        <div class="alert-item">
          <span class="icon"><i class="fas fa-exclamation-triangle"></i></span>
          <div class="info">
            <span class="name">${p.icon || '📦'} ${p.name}</span>
            <span>موجودی فعلی: ${p.quantity} عدد (حداقل مجاز: ${p.minStock})</span>
            <span style="display:block;font-size:0.75rem;color:var(--text-muted);">${p.category} · ${p.price.toLocaleString()} تومان</span>
          </div>
          <button onclick="showTab('transactions')" style="padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.7rem;">+ ثبت ورود</button>
        </div>
      `).join('');
    }

    // ===== گزارش‌ها =====
    function generateReport(type) {
      const container = document.getElementById('reportResult');
      let html = '';

      if (type === 'stock') {
        html = `
          <h4 style="margin-bottom:12px;">📊 گزارش موجودی انبار</h4>
          <div class="table-wrap">
            <table>
              <thead><tr><th>کالا</th><th>دسته</th><th>موجودی</th><th>حداقل</th><th>وضعیت</th></tr></thead>
              <tbody>
                ${products.map(p => `
                  <tr>
                    <td>${p.icon || '📦'} ${p.name}</td>
                    <td>${p.category}</td>
                    <td>${p.quantity}</td>
                    <td>${p.minStock}</td>
                    <td><span style="color:${p.quantity <= p.minStock ? 'var(--danger)' : 'var(--success)'};">${p.quantity <= p.minStock ? '⚠️ کم' : '✅ مطلوب'}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);">تاریخ: ${new Date().toLocaleDateString('fa-IR')}</div>
        `;
      } else {
        const filtered = transactions.filter(t => t.type === type);
        const label = type === 'in' ? 'ورود' : 'خروج';
        html = `
          <h4 style="margin-bottom:12px;">📥 گزارش ${label} کالا</h4>
          ${filtered.length === 0 ? '<p style="color:var(--text-muted);">هیچ تراکنشی یافت نشد</p>' : `
            <div class="table-wrap">
              <table>
                <thead><tr><th>کالا</th><th>تعداد</th><th>تاریخ</th></tr></thead>
                <tbody>
                  ${filtered.map(t => {
                    const product = products.find(p => p.id === t.productId);
                    return `
                      <tr>
                        <td>${product ? product.name : 'نامشخص'}</td>
                        <td>${t.quantity}</td>
                        <td>${t.date}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
            <div style="margin-top:12px;font-size:0.85rem;color:var(--text-muted);">
              کل ${label}: ${filtered.reduce((sum, t) => sum + t.quantity, 0)} عدد
            </div>
          `}
        `;
      }

      container.innerHTML = html;
      showNotification('📄 گزارش با موفقیت تولید شد!');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderDashboard();
    renderProducts();
    renderTransactions();
    populateTransactionSelect();
    renderAlerts();

    console.log('✅ سیستم مدیریت انبار کامل بارگذاری شد!');
  </script>
</body>
</html>
