<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت کتابخانه | Library Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f2f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #2c3e50;
      --accent-hover: #1a2a3a;
      --accent-light: #3498db;
      --success: #27ae60;
      --warning: #f39c12;
      --danger: #e74c3c;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:3px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; color:var(--accent-light); }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent-light); }
    .header .nav-links a.active { color:var(--accent-light); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent-light); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های کتاب ===== */
    .book-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .book-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
      box-shadow:var(--shadow);
      transition:var(--transition);
      text-align:center;
    }
    .book-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .book-card .cover {
      width:100%; aspect-ratio:2/3; border-radius:8px;
      background:linear-gradient(135deg, var(--accent), var(--accent-light));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:3rem; margin-bottom:8px;
    }
    .book-card .title { font-weight:700; font-size:0.95rem; }
    .book-card .author { font-size:0.85rem; color:var(--text-muted); }
    .book-card .genre {
      font-size:0.7rem; padding:2px 12px; border-radius:50px;
      background:var(--bg-primary); display:inline-block; margin:4px 0;
    }
    .book-card .status {
      font-size:0.7rem; padding:2px 12px; border-radius:50px; display:inline-block;
      margin-top:4px;
    }
    .book-card .status.available { background:rgba(39,174,96,0.15); color:var(--success); }
    .book-card .status.borrowed { background:rgba(231,76,60,0.15); color:var(--danger); }

    /* ===== فرم ===== */
    .form-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .form-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .form-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent-light); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:60px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }
    .form-actions .btn-secondary:hover { background:var(--border-color); }

    /* ===== جستجو ===== */
    .search-section {
      display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px;
    }
    .search-section input, .search-section select {
      padding:8px 14px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-card);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .search-section input:focus, .search-section select:focus {
      border-color:var(--accent-light); outline:none;
    }
    .search-section input { flex:2; min-width:150px; }
    .search-section select { flex:1; min-width:120px; }
    .search-section button {
      padding:8px 24px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; cursor:pointer; font-weight:600;
      transition:var(--transition);
    }
    .search-section button:hover { background:var(--accent-hover); }

    /* ===== جدول ===== */
    .table-wrap {
      overflow-x:auto;
    }
    .table-wrap table {
      width:100%; border-collapse:collapse; font-size:0.85rem;
    }
    .table-wrap th {
      text-align:right; padding:10px 8px; color:var(--text-muted);
      border-bottom:2px solid var(--border-color); font-weight:600;
      font-size:0.7rem; text-transform:uppercase;
    }
    .table-wrap td {
      padding:10px 8px; border-bottom:1px solid var(--border-color);
      color:var(--text-secondary);
    }
    .table-wrap tr:hover td { background:var(--bg-primary); }
    .table-wrap .actions i {
      cursor:pointer; margin:0 4px; transition:var(--transition);
    }
    .table-wrap .actions i:hover { color:var(--accent-light); transform:scale(1.1); }

    /* ===== آمار ===== */
    .stats-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .stat-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .stat-card .number { font-size:1.8rem; font-weight:700; color:var(--accent-light); }
    .stat-card .label { font-size:0.85rem; color:var(--text-muted); }

    /* ===== امانت ===== */
    .borrow-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 12px; border-bottom:1px solid var(--border-color);
    }
    .borrow-item:last-child { border-bottom:none; }
    .borrow-item .book { font-weight:600; }
    .borrow-item .user { color:var(--text-muted); font-size:0.85rem; }
    .borrow-item .date { font-size:0.8rem; color:var(--text-muted); }
    .borrow-item .status.overdue { color:var(--danger); font-weight:600; }
    .borrow-item .actions button {
      padding:2px 12px; border:none; border-radius:6px; cursor:pointer;
      font-size:0.7rem; transition:var(--transition);
    }
    .borrow-item .actions .return-btn { background:var(--success); color:#fff; }
    .borrow-item .actions .return-btn:hover { opacity:0.8; }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:1; }
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .book-grid { grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .stats-grid { grid-template-columns:1fr; }
      .book-grid { grid-template-columns:1fr 1fr; }
      .search-section { flex-direction:column; }
      .borrow-item { flex-direction:column; align-items:stretch; gap:4px; text-align:center; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .book-grid { grid-template-columns:1fr; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-book"></i> <span id="brandName">کتابخانه</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('dashboard')" data-key="navDashboard">داشبورد</a>
      <a onclick="showTab('books')" data-key="navBooks">کتاب‌ها</a>
      <a onclick="showTab('users')" data-key="navUsers">کاربران</a>
      <a onclick="showTab('borrow')" data-key="navBorrow">امانت</a>
      <a onclick="showTab('reports')" data-key="navReports">گزارش‌ها</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب داشبورد ===== -->
    <div class="tab-content active" id="tab-dashboard">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent-light);"></i> <span data-key="dashboardTitle">داشبورد کتابخانه</span></h2>
      <div class="stats-grid" id="statsGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-clock"></i> <span data-key="recentBorrows">امانت‌های اخیر</span></h4>
          <div id="recentBorrows"></div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-exclamation-triangle" style="color:var(--danger);"></i> <span data-key="overdueBooks">کتاب‌های دیرکرد</span></h4>
          <div id="overdueBooks"></div>
        </div>
      </div>
    </div>

    <!-- ===== تب کتاب‌ها ===== -->
    <div class="tab-content" id="tab-books">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-book" style="color:var(--accent-light);"></i> <span data-key="booksTitle">مدیریت کتاب‌ها</span></h2>
        <button onclick="showTab('addBook')" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="addBookBtn">+ افزودن کتاب</button>
      </div>
      <div class="search-section">
        <input type="text" id="searchBooks" placeholder="جستجوی کتاب ..." onkeyup="searchBooks()">
        <select id="genreFilter" onchange="searchBooks()">
          <option value="all">همه ژانرها</option>
          <option value="رمان">رمان</option>
          <option value="علمی">علمی</option>
          <option value="تاریخی">تاریخی</option>
          <option value="فنی">فنی</option>
          <option value="هنری">هنری</option>
          <option value="کودک">کودک</option>
        </select>
        <button onclick="searchBooks()"><i class="fas fa-search"></i> جستجو</button>
      </div>
      <div class="book-grid" id="bookGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب افزودن کتاب ===== -->
    <div class="tab-content" id="tab-addBook">
      <div class="form-section">
        <h2><i class="fas fa-plus-circle" style="color:var(--accent-light);"></i> <span data-key="addBookTitle">افزودن کتاب جدید</span></h2>
        <div class="form-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان کتاب</label>
            <input type="text" id="bookTitle" placeholder="عنوان ...">
          </div>
          <div class="form-group">
            <label data-key="lblAuthor">نویسنده</label>
            <input type="text" id="bookAuthor" placeholder="نویسنده ...">
          </div>
          <div class="form-group">
            <label data-key="lblGenre">ژانر</label>
            <select id="bookGenre">
              <option value="رمان">رمان</option>
              <option value="علمی">علمی</option>
              <option value="تاریخی">تاریخی</option>
              <option value="فنی">فنی</option>
              <option value="هنری">هنری</option>
              <option value="کودک">کودک</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblYear">سال انتشار</label>
            <input type="number" id="bookYear" placeholder="۱۴۰۰">
          </div>
          <div class="form-group full">
            <label data-key="lblDescription">توضیحات</label>
            <textarea id="bookDescription" placeholder="توضیحات کتاب ..."></textarea>
          </div>
          <div class="form-group">
            <label data-key="lblCopies">تعداد نسخه</label>
            <input type="number" id="bookCopies" value="1">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="addBook()" data-key="saveBtn">ذخیره کتاب</button>
          <button class="btn-secondary" onclick="clearBookForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب کاربران ===== -->
    <div class="tab-content" id="tab-users">
      <h2 style="margin-bottom:16px;"><i class="fas fa-users" style="color:var(--accent-light);"></i> <span data-key="usersTitle">مدیریت کاربران</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <div class="table-wrap">
          <table>
            <thead><tr><th data-key="thUser">کاربر</th><th data-key="thEmail">ایمیل</th><th data-key="thBooks">تعداد کتاب</th><th data-key="thStatus">وضعیت</th><th data-key="thActions">عملیات</th></tr></thead>
            <tbody id="usersTable">
              <!-- توسط JS ساخته می‌شود -->
            </tbody>
          </table>
        </div>
        <button onclick="addUser()" style="margin-top:12px;padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">+ افزودن کاربر</button>
      </div>
    </div>

    <!-- ===== تب امانت ===== -->
    <div class="tab-content" id="tab-borrow">
      <h2 style="margin-bottom:16px;"><i class="fas fa-hand-holding" style="color:var(--accent-light);"></i> <span data-key="borrowTitle">امانت کتاب</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
          <select id="borrowBookSelect" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
            <option value="">انتخاب کتاب ...</option>
          </select>
          <select id="borrowUserSelect" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
            <option value="">انتخاب کاربر ...</option>
          </select>
          <button onclick="borrowBook()" style="padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">ثبت امانت</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th data-key="thBook">کتاب</th><th data-key="thUser">کاربر</th><th data-key="thDate">تاریخ امانت</th><th data-key="thReturn">تاریخ بازگشت</th><th data-key="thStatus">وضعیت</th><th data-key="thActions">عملیات</th></tr></thead>
            <tbody id="borrowTable">
              <!-- توسط JS ساخته می‌شود -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ===== تب گزارش‌ها ===== -->
    <div class="tab-content" id="tab-reports">
      <h2 style="margin-bottom:16px;"><i class="fas fa-file-alt" style="color:var(--accent-light);"></i> <span data-key="reportsTitle">گزارش‌ها</span></h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-book"></i> <span data-key="booksReport">گزارش کتاب‌ها</span></h4>
          <div id="booksReport"></div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-hand-holding"></i> <span data-key="borrowReport">گزارش امانت‌ها</span></h4>
          <div id="borrowReport"></div>
        </div>
      </div>
      <div style="margin-top:16px;background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-download"></i> <span data-key="exportReport">خروجی گزارش</span></h4>
        <button onclick="exportReport('excel')" style="padding:8px 20px;background:var(--success);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">خروجی اکسل</button>
        <button onclick="exportReport('pdf')" style="padding:8px 20px;background:var(--danger);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-right:8px;">خروجی PDF</button>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'کتابخانه',
        navDashboard: 'داشبورد',
        navBooks: 'کتاب‌ها',
        navUsers: 'کاربران',
        navBorrow: 'امانت',
        navReports: 'گزارش‌ها',
        dashboardTitle: 'داشبورد کتابخانه',
        booksTitle: 'مدیریت کتاب‌ها',
        addBookBtn: '+ افزودن کتاب',
        addBookTitle: 'افزودن کتاب جدید',
        lblTitle: 'عنوان کتاب',
        lblAuthor: 'نویسنده',
        lblGenre: 'ژانر',
        lblYear: 'سال انتشار',
        lblDescription: 'توضیحات',
        lblCopies: 'تعداد نسخه',
        saveBtn: 'ذخیره کتاب',
        cancelBtn: 'انصراف',
        usersTitle: 'مدیریت کاربران',
        borrowTitle: 'امانت کتاب',
        reportsTitle: 'گزارش‌ها',
        booksReport: 'گزارش کتاب‌ها',
        borrowReport: 'گزارش امانت‌ها',
        exportReport: 'خروجی گزارش',
        recentBorrows: 'امانت‌های اخیر',
        overdueBooks: 'کتاب‌های دیرکرد',
        thUser: 'کاربر',
        thEmail: 'ایمیل',
        thBooks: 'تعداد کتاب',
        thStatus: 'وضعیت',
        thActions: 'عملیات',
        thBook: 'کتاب',
        thDate: 'تاریخ امانت',
        thReturn: 'تاریخ بازگشت'
      },
      en: {
        brandName: 'Library',
        navDashboard: 'Dashboard',
        navBooks: 'Books',
        navUsers: 'Users',
        navBorrow: 'Borrow',
        navReports: 'Reports',
        dashboardTitle: 'Library Dashboard',
        booksTitle: 'Book Management',
        addBookBtn: '+ Add Book',
        addBookTitle: 'Add New Book',
        lblTitle: 'Book Title',
        lblAuthor: 'Author',
        lblGenre: 'Genre',
        lblYear: 'Year',
        lblDescription: 'Description',
        lblCopies: 'Copies',
        saveBtn: 'Save Book',
        cancelBtn: 'Cancel',
        usersTitle: 'User Management',
        borrowTitle: 'Borrow Books',
        reportsTitle: 'Reports',
        booksReport: 'Books Report',
        borrowReport: 'Borrow Report',
        exportReport: 'Export Report',
        recentBorrows: 'Recent Borrows',
        overdueBooks: 'Overdue Books',
        thUser: 'User',
        thEmail: 'Email',
        thBooks: 'Books',
        thStatus: 'Status',
        thActions: 'Actions',
        thBook: 'Book',
        thDate: 'Borrow Date',
        thReturn: 'Return Date'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let books = [];
    let users = [];
    let borrows = [];
    let nextBookId = 1;
    let nextUserId = 1;
    let nextBorrowId = 1;

    // داده‌های نمونه
    function initSampleData() {
      books = [
        { id: 1, title: 'صد سال تنهایی', author: 'گابریل گارسیا مارکز', genre: 'رمان', year: '۱۳۴۶', description: 'داستانی جاودانه از مکوندو', copies: 3, available: 2 },
        { id: 2, title: 'هری پاتر و سنگ جادو', author: 'جی.کی. رولینگ', genre: 'رمان', year: '۱۳۷۶', description: 'ماجراجویی هری پاتر در هاگوارتز', copies: 5, available: 3 },
        { id: 3, title: 'تاریخ ایران باستان', author: 'دکتر زرین‌کوب', genre: 'تاریخی', year: '۱۳۵۰', description: 'تاریخ کامل ایران باستان', copies: 2, available: 1 },
        { id: 4, title: 'برنامه‌نویسی پایتون', author: 'مارک لوتز', genre: 'فنی', year: '۱۴۰۰', description: 'آموزش کامل پایتون', copies: 4, available: 4 },
        { id: 5, title: 'نقاشی با مداد رنگی', author: 'سارا صادقی', genre: 'هنری', year: '۱۳۹۸', description: 'آموزش نقاشی با مداد رنگی', copies: 2, available: 2 }
      ];

      users = [
        { id: 1, name: 'علی رضایی', email: 'ali@library.com', books: 2 },
        { id: 2, name: 'سارا محمدی', email: 'sara@library.com', books: 1 },
        { id: 3, name: 'مهدی کریمی', email: 'mehdi@library.com', books: 0 }
      ];

      const today = new Date();
      const borrowDate = new Date(today);
      borrowDate.setDate(borrowDate.getDate() - 5);
      const returnDate = new Date(today);
      returnDate.setDate(returnDate.getDate() + 7);

      borrows = [
        { id: 1, bookId: 1, userId: 1, borrowDate: borrowDate.toISOString().split('T')[0], returnDate: returnDate.toISOString().split('T')[0], returned: false },
        { id: 2, bookId: 2, userId: 2, borrowDate: new Date(today.setDate(today.getDate() - 2)).toISOString().split('T')[0], returnDate: new Date(today.setDate(today.getDate() + 10)).toISOString().split('T')[0], returned: false }
      ];

      nextBookId = 6;
      nextUserId = 4;
      nextBorrowId = 3;
    }

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { dashboard: 0, books: 1, addBook: 1, users: 2, borrow: 3, reports: 4 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'dashboard') renderDashboard();
      if (tabName === 'books') renderBooks();
      if (tabName === 'users') renderUsers();
      if (tabName === 'borrow') { renderBorrow(); populateBorrowSelects(); }
      if (tabName === 'reports') renderReports();
      if (tabName === 'addBook') { /* فرم خالی */ }
    }

    // ===== داشبورد =====
    function renderDashboard() {
      const totalBooks = books.reduce((sum, b) => sum + b.copies, 0);
      const totalAvailable = books.reduce((sum, b) => sum + b.available, 0);
      const totalUsers = users.length;
      const activeBorrows = borrows.filter(b => !b.returned).length;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="number">${totalBooks}</div><div class="label">کل کتاب‌ها</div></div>
        <div class="stat-card"><div class="number">${totalAvailable}</div><div class="label">موجود</div></div>
        <div class="stat-card"><div class="number">${totalUsers}</div><div class="label">کاربران</div></div>
        <div class="stat-card"><div class="number">${activeBorrows}</div><div class="label">امانت فعال</div></div>
      `;

      // امانت‌های اخیر
      const recent = document.getElementById('recentBorrows');
      if (borrows.length === 0) {
        recent.innerHTML = '<p style="color:var(--text-muted);">هیچ امانتی ثبت نشده است</p>';
      } else {
        recent.innerHTML = borrows.slice(-3).reverse().map(b => {
          const book = books.find(bk => bk.id === b.bookId);
          const user = users.find(u => u.id === b.userId);
          return `
            <div class="borrow-item">
              <span class="book">${book ? book.title : 'نامشخص'}</span>
              <span class="user">${user ? user.name : 'نامشخص'}</span>
              <span class="date">${b.borrowDate}</span>
            </div>
          `;
        }).join('');
      }

      // کتاب‌های دیرکرد
      const overdue = document.getElementById('overdueBooks');
      const today = new Date().toISOString().split('T')[0];
      const overdueList = borrows.filter(b => !b.returned && b.returnDate < today);
      if (overdueList.length === 0) {
        overdue.innerHTML = '<p style="color:var(--text-muted);">هیچ کتاب دیرکردی وجود ندارد ✅</p>';
      } else {
        overdue.innerHTML = overdueList.map(b => {
          const book = books.find(bk => bk.id === b.bookId);
          const user = users.find(u => u.id === b.userId);
          return `
            <div class="borrow-item" style="border-color:var(--danger);">
              <span class="book" style="color:var(--danger);">${book ? book.title : 'نامشخص'}</span>
              <span class="user">${user ? user.name : 'نامشخص'}</span>
              <span class="status overdue">تاریخ سررسید: ${b.returnDate}</span>
            </div>
          `;
        }).join('');
      }
    }

    // ===== کتاب‌ها =====
    function renderBooks() {
      const grid = document.getElementById('bookGrid');
      if (books.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ کتابی در کتابخانه موجود نیست</p>';
        return;
      }
      grid.innerHTML = books.map(b => `
        <div class="book-card">
          <div class="cover"><i class="fas fa-book"></i></div>
          <div class="title">${b.title}</div>
          <div class="author">${b.author}</div>
          <div class="genre">${b.genre}</div>
          <div class="status ${b.available > 0 ? 'available' : 'borrowed'}">
            ${b.available > 0 ? `موجود (${b.available})` : 'امانت رفته'}
          </div>
          <div style="margin-top:6px;font-size:0.7rem;color:var(--text-muted);">${b.year} · ${b.copies} نسخه</div>
          <div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">
            <button onclick="editBook(${b.id})" style="padding:2px 12px;background:var(--accent-light);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;">ویرایش</button>
            <button onclick="deleteBook(${b.id})" style="padding:2px 12px;background:var(--danger);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function searchBooks() {
      const query = document.getElementById('searchBooks').value.trim().toLowerCase();
      const genre = document.getElementById('genreFilter').value;
      const grid = document.getElementById('bookGrid');
      let filtered = books;
      if (query) filtered = filtered.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
      if (genre !== 'all') filtered = filtered.filter(b => b.genre === genre);
      if (filtered.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">نتیجه‌ای یافت نشد</p>';
      } else {
        grid.innerHTML = filtered.map(b => `
          <div class="book-card">
            <div class="cover"><i class="fas fa-book"></i></div>
            <div class="title">${b.title}</div>
            <div class="author">${b.author}</div>
            <div class="genre">${b.genre}</div>
            <div class="status ${b.available > 0 ? 'available' : 'borrowed'}">
              ${b.available > 0 ? `موجود (${b.available})` : 'امانت رفته'}
            </div>
            <div style="margin-top:6px;font-size:0.7rem;color:var(--text-muted);">${b.year} · ${b.copies} نسخه</div>
            <div style="display:flex;gap:4px;justify-content:center;margin-top:6px;">
              <button onclick="editBook(${b.id})" style="padding:2px 12px;background:var(--accent-light);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;">ویرایش</button>
              <button onclick="deleteBook(${b.id})" style="padding:2px 12px;background:var(--danger);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;">حذف</button>
            </div>
          </div>
        `).join('');
      }
    }

    // ===== افزودن کتاب =====
    function addBook() {
      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      const genre = document.getElementById('bookGenre').value;
      const year = document.getElementById('bookYear').value;
      const description = document.getElementById('bookDescription').value.trim();
      const copies = parseInt(document.getElementById('bookCopies').value) || 1;

      if (!title || !author) {
        showNotification('❌ لطفاً عنوان و نویسنده را وارد کنید!');
        return;
      }

      books.push({
        id: nextBookId++,
        title, author, genre, year, description, copies,
        available: copies
      });

      clearBookForm();
      renderBooks();
      renderDashboard();
      showNotification('✅ کتاب با موفقیت اضافه شد!');
      showTab('books');
    }

    function clearBookForm() {
      document.getElementById('bookTitle').value = '';
      document.getElementById('bookAuthor').value = '';
      document.getElementById('bookYear').value = '';
      document.getElementById('bookDescription').value = '';
      document.getElementById('bookCopies').value = '1';
    }

    // ===== ویرایش کتاب =====
    function editBook(bookId) {
      const book = books.find(b => b.id === bookId);
      if (!book) return;
      const newTitle = prompt('عنوان جدید:', book.title);
      if (newTitle && newTitle.trim()) book.title = newTitle.trim();
      const newAuthor = prompt('نویسنده جدید:', book.author);
      if (newAuthor && newAuthor.trim()) book.author = newAuthor.trim();
      renderBooks();
      showNotification('✅ کتاب به‌روزرسانی شد!');
    }

    // ===== حذف کتاب =====
    function deleteBook(bookId) {
      if (confirm('آیا از حذف این کتاب اطمینان دارید؟')) {
        const book = books.find(b => b.id === bookId);
        books = books.filter(b => b.id !== bookId);
        renderBooks();
        renderDashboard();
        showNotification(`🗑️ کتاب "${book ? book.title : ''}" حذف شد`);
      }
    }

    // ===== کاربران =====
    function renderUsers() {
      const tbody = document.getElementById('usersTable');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.books}</td>
          <td><span class="status-badge" style="padding:2px 12px;border-radius:50px;font-size:0.7rem;background:rgba(39,174,96,0.15);color:var(--success);">فعال</span></td>
          <td class="actions">
            <i class="fas fa-edit" onclick="editUser(${u.id})" title="ویرایش"></i>
            <i class="fas fa-trash" onclick="deleteUser(${u.id})" title="حذف" style="color:var(--danger);"></i>
          </td>
        </tr>
      `).join('');
    }

    function addUser() {
      const name = prompt('نام کاربر:');
      if (!name || !name.trim()) return;
      const email = prompt('ایمیل:');
      if (!email || !email.trim()) return;
      users.push({ id: nextUserId++, name: name.trim(), email: email.trim(), books: 0 });
      renderUsers();
      renderDashboard();
      showNotification('✅ کاربر اضافه شد!');
    }

    function editUser(userId) {
      const user = users.find(u => u.id === userId);
      if (!user) return;
      const newName = prompt('نام جدید:', user.name);
      if (newName && newName.trim()) user.name = newName.trim();
      const newEmail = prompt('ایمیل جدید:', user.email);
      if (newEmail && newEmail.trim()) user.email = newEmail.trim();
      renderUsers();
      showNotification('✅ کاربر به‌روزرسانی شد!');
    }

    function deleteUser(userId) {
      if (confirm('آیا از حذف این کاربر اطمینان دارید؟')) {
        users = users.filter(u => u.id !== userId);
        renderUsers();
        renderDashboard();
        showNotification('🗑️ کاربر حذف شد');
      }
    }

    // ===== امانت =====
    function populateBorrowSelects() {
      const bookSelect = document.getElementById('borrowBookSelect');
      bookSelect.innerHTML = '<option value="">انتخاب کتاب ...</option>' +
        books.filter(b => b.available > 0).map(b =>
          `<option value="${b.id}">${b.title} (${b.available} موجود)</option>`
        ).join('');

      const userSelect = document.getElementById('borrowUserSelect');
      userSelect.innerHTML = '<option value="">انتخاب کاربر ...</option>' +
        users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    }

    function borrowBook() {
      const bookId = parseInt(document.getElementById('borrowBookSelect').value);
      const userId = parseInt(document.getElementById('borrowUserSelect').value);
      if (!bookId || !userId) {
        showNotification('❌ لطفاً کتاب و کاربر را انتخاب کنید!');
        return;
      }
      const book = books.find(b => b.id === bookId);
      if (!book || book.available <= 0) {
        showNotification('❌ کتاب موجود نیست!');
        return;
      }

      const today = new Date();
      const returnDate = new Date(today);
      returnDate.setDate(returnDate.getDate() + 14);

      borrows.push({
        id: nextBorrowId++,
        bookId: bookId,
        userId: userId,
        borrowDate: today.toISOString().split('T')[0],
        returnDate: returnDate.toISOString().split('T')[0],
        returned: false
      });

      book.available--;
      const user = users.find(u => u.id === userId);
      if (user) user.books = (user.books || 0) + 1;

      renderBorrow();
      populateBorrowSelects();
      renderDashboard();
      showNotification('✅ امانت با موفقیت ثبت شد!');
    }

    function renderBorrow() {
      const tbody = document.getElementById('borrowTable');
      if (borrows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">هیچ امانتی ثبت نشده است</td></tr>';
        return;
      }
      tbody.innerHTML = borrows.map(b => {
        const book = books.find(bk => bk.id === b.bookId);
        const user = users.find(u => u.id === b.userId);
        const today = new Date().toISOString().split('T')[0];
        const isOverdue = !b.returned && b.returnDate < today;
        return `
          <tr>
            <td>${book ? book.title : 'نامشخص'}</td>
            <td>${user ? user.name : 'نامشخص'}</td>
            <td>${b.borrowDate}</td>
            <td>${b.returnDate}</td>
            <td>
              <span style="padding:2px 12px;border-radius:50px;font-size:0.7rem;background:${b.returned ? 'rgba(39,174,96,0.15)' : isOverdue ? 'rgba(231,76,60,0.15)' : 'rgba(243,156,18,0.15)'};color:${b.returned ? 'var(--success)' : isOverdue ? 'var(--danger)' : 'var(--warning)'};">
                ${b.returned ? 'بازگشت' : isOverdue ? 'دیرکرد' : 'در امانت'}
              </span>
            </td>
            <td class="actions">
              ${!b.returned ? `<button onclick="returnBook(${b.id})" style="padding:2px 12px;background:var(--success);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.7rem;">بازگشت</button>` : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    function returnBook(borrowId) {
      const borrow = borrows.find(b => b.id === borrowId);
      if (!borrow) return;
      borrow.returned = true;
      const book = books.find(b => b.id === borrow.bookId);
      if (book) book.available++;
      const user = users.find(u => u.id === borrow.userId);
      if (user && user.books > 0) user.books--;
      renderBorrow();
      renderDashboard();
      showNotification('✅ کتاب بازگشت داده شد!');
    }

    // ===== گزارش‌ها =====
    function renderReports() {
      const booksReport = document.getElementById('booksReport');
      booksReport.innerHTML = `
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>کل کتاب‌ها</span>
          <span style="font-weight:600;">${books.length}</span>
        </div>
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>کل نسخه‌ها</span>
          <span style="font-weight:600;">${books.reduce((sum, b) => sum + b.copies, 0)}</span>
        </div>
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>کتاب‌های موجود</span>
          <span style="font-weight:600;color:var(--success);">${books.reduce((sum, b) => sum + b.available, 0)}</span>
        </div>
        <div style="padding:4px 0;display:flex;justify-content:space-between;">
          <span>کتاب‌های امانت رفته</span>
          <span style="font-weight:600;color:var(--danger);">${books.reduce((sum, b) => sum + (b.copies - b.available), 0)}</span>
        </div>
      `;

      const borrowReport = document.getElementById('borrowReport');
      const activeBorrows = borrows.filter(b => !b.returned).length;
      const returnedBorrows = borrows.filter(b => b.returned).length;
      const today = new Date().toISOString().split('T')[0];
      const overdueBorrows = borrows.filter(b => !b.returned && b.returnDate < today).length;

      borrowReport.innerHTML = `
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>کل امانت‌ها</span>
          <span style="font-weight:600;">${borrows.length}</span>
        </div>
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>امانت‌های فعال</span>
          <span style="font-weight:600;color:var(--warning);">${activeBorrows}</span>
        </div>
        <div style="padding:4px 0;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;">
          <span>بازگشت داده شده</span>
          <span style="font-weight:600;color:var(--success);">${returnedBorrows}</span>
        </div>
        <div style="padding:4px 0;display:flex;justify-content:space-between;">
          <span>کتاب‌های دیرکرد</span>
          <span style="font-weight:600;color:var(--danger);">${overdueBorrows}</span>
        </div>
      `;
    }

    // ===== خروجی گزارش =====
    function exportReport(type) {
      let text = '📚 گزارش کتابخانه\n';
      text += '='.repeat(40) + '\n\n';
      text += '📖 کتاب‌ها:\n';
      books.forEach(b => {
        text += `- ${b.title} (${b.author}) - ${b.genre} - ${b.year} - ${b.available}/${b.copies} موجود\n`;
      });
      text += '\n👥 کاربران:\n';
      users.forEach(u => {
        text += `- ${u.name} (${u.email}) - ${u.books} کتاب\n`;
      });
      text += '\n📋 امانت‌ها:\n';
      borrows.forEach(b => {
        const book = books.find(bk => bk.id === b.bookId);
        const user = users.find(u => u.id === b.userId);
        text += `- ${book ? book.title : 'نامشخص'} - ${user ? user.name : 'نامشخص'} - ${b.borrowDate} تا ${b.returnDate} ${b.returned ? '(بازگشت)' : '(در امانت)'}\n`;
      });

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `گزارش_کتابخانه_${type}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      showNotification(`📥 گزارش ${type} دانلود شد!`);
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderDashboard();
    renderBooks();
    renderUsers();
    renderBorrow();
    populateBorrowSelects();
    renderReports();

    console.log('✅ سیستم مدیریت کتابخانه کامل بارگذاری شد!');
  </script>
</body>
</html>
