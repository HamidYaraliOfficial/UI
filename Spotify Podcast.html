<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم پادکست | PodCast Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1a1a1a;
      --bg-card: #282828;
      --bg-hover: #3a3a3a;
      --text-primary: #ffffff;
      --text-secondary: #b3b3b3;
      --text-muted: #6a6a6a;
      --border-color: #2a2a2a;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --accent-purple: #9147ff;
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.7);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.light-mode {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f0f0f0;
      --text-primary: #121212;
      --text-secondary: #606060;
      --text-muted: #909090;
      --border-color: #e0e0e0;
      --shadow: 0 8px 30px rgba(0,0,0,0.06);
      --shadow-hover: 0 12px 40px rgba(0,0,0,0.10);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary);
      border-bottom:1px solid var(--border-color);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
      padding-bottom:100px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های پادکست ===== */
    .podcast-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .podcast-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
      transition:var(--transition); cursor:pointer;
      text-align:center;
    }
    .podcast-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-hover); background:var(--bg-hover); }
    .podcast-card .cover {
      width:100%; aspect-ratio:1; border-radius:8px;
      background:linear-gradient(135deg, var(--accent), var(--accent-purple));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:3rem; margin-bottom:8px;
    }
    .podcast-card .title { font-weight:600; font-size:0.95rem; }
    .podcast-card .host { font-size:0.8rem; color:var(--text-secondary); }
    .podcast-card .episodes { font-size:0.7rem; color:var(--text-muted); }
    .podcast-card .follow-btn {
      margin-top:6px; padding:4px 16px; border:none; border-radius:50px;
      font-weight:600; cursor:pointer; transition:var(--transition);
    }
    .podcast-card .follow-btn.follow { background:var(--accent); color:#fff; }
    .podcast-card .follow-btn.follow:hover { background:var(--accent-hover); }
    .podcast-card .follow-btn.following { background:var(--text-muted); color:var(--text-primary); }

    /* ===== اپیزودها ===== */
    .episode-item {
      display:flex; align-items:center; gap:12px;
      padding:10px 12px; border-bottom:1px solid var(--border-color);
      transition:var(--transition); cursor:pointer;
    }
    .episode-item:hover { background:var(--bg-hover); border-radius:8px; }
    .episode-item .number { font-size:0.8rem; color:var(--text-muted); min-width:30px; }
    .episode-item .info { flex:1; }
    .episode-item .info .title { font-weight:600; font-size:0.9rem; }
    .episode-item .info .duration { font-size:0.75rem; color:var(--text-muted); }
    .episode-item .play-btn {
      width:36px; height:36px; border-radius:50%;
      background:var(--accent); color:#fff; border:none;
      cursor:pointer; transition:var(--transition);
      display:flex; align-items:center; justify-content:center;
    }
    .episode-item .play-btn:hover { transform:scale(1.1); background:var(--accent-hover); }

    /* ===== پخش‌کننده ===== */
    .player {
      position:fixed; bottom:0; left:0; right:0;
      background:var(--bg-secondary); border-top:1px solid var(--border-color);
      padding:12px 24px; display:flex; align-items:center; gap:20px;
      z-index:999; height:72px;
      box-shadow:0 -4px 20px rgba(0,0,0,0.3);
    }
    .player .track-info {
      display:flex; align-items:center; gap:12px; min-width:180px;
    }
    .player .track-info .cover {
      width:48px; height:48px; border-radius:8px;
      background:linear-gradient(135deg, var(--accent), var(--accent-purple));
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }
    .player .track-info .details .name { font-weight:600; font-size:0.9rem; }
    .player .track-info .details .host { font-size:0.75rem; color:var(--text-secondary); }
    .player .controls {
      display:flex; align-items:center; gap:16px; flex:1; justify-content:center;
    }
    .player .controls i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .player .controls i:hover { color:var(--text-primary); transform:scale(1.1); }
    .player .controls .play-btn {
      font-size:2rem; color:var(--text-primary);
    }
    .player .controls .play-btn:hover { color:var(--accent); }
    .player .progress {
      display:flex; align-items:center; gap:10px; flex:1; min-width:100px;
    }
    .player .progress .bar {
      flex:1; height:4px; background:var(--text-muted); border-radius:4px;
      position:relative; cursor:pointer;
    }
    .player .progress .bar .fill {
      width:35%; height:100%; background:var(--accent); border-radius:4px;
      position:relative;
    }
    .player .progress .bar .fill::after {
      content:''; position:absolute; right:-4px; top:-4px;
      width:12px; height:12px; border-radius:50%; background:var(--text-primary);
      opacity:0; transition:var(--transition);
    }
    .player .progress .bar:hover .fill::after { opacity:1; }
    .player .progress .time { font-size:0.7rem; color:var(--text-secondary); min-width:40px; }
    .player .volume {
      display:flex; align-items:center; gap:8px; min-width:100px;
    }
    .player .volume i { cursor:pointer; color:var(--text-secondary); }
    .player .volume .bar {
      width:80px; height:4px; background:var(--text-muted); border-radius:4px;
      cursor:pointer;
    }
    .player .volume .bar .fill { width:70%; height:100%; background:var(--accent); border-radius:4px; }

    /* ===== فرم آپلود ===== */
    .upload-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .upload-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .upload-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .upload-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }

    /* ===== لیست پخش ===== */
    .playlist-item {
      display:flex; align-items:center; gap:12px;
      padding:8px 12px; border-radius:8px; transition:var(--transition);
      cursor:pointer;
    }
    .playlist-item:hover { background:var(--bg-hover); }
    .playlist-item .cover {
      width:40px; height:40px; border-radius:6px;
      background:linear-gradient(135deg, var(--accent), var(--accent-purple));
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }
    .playlist-item .info { flex:1; }
    .playlist-item .info .name { font-weight:600; font-size:0.85rem; }
    .playlist-item .info .count { font-size:0.7rem; color:var(--text-muted); }

    /* ===== نظرات ===== */
    .comment-item {
      padding:10px 0; border-bottom:1px solid var(--border-color);
    }
    .comment-item:last-child { border-bottom:none; }
    .comment-item .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px;
    }
    .comment-item .header .user { font-weight:600; font-size:0.9rem; }
    .comment-item .header .time { font-size:0.7rem; color:var(--text-muted); }
    .comment-item .text { font-size:0.9rem; color:var(--text-secondary); }

    /* ===== آمار ===== */
    .stats-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .stat-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .stat-card .number { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .stat-card .label { font-size:0.85rem; color:var(--text-muted); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--bg-card); color:var(--text-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:var(--shadow);
      border:1px solid var(--border-color);
    }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .upload-grid { grid-template-columns:1fr; }
      .upload-grid .full { grid-column:1; }
      .stats-grid { grid-template-columns:repeat(2,1fr); }
      .player { flex-wrap:wrap; height:auto; padding:8px 12px; gap:8px; }
      .player .track-info { min-width:120px; }
      .player .controls { order:3; flex-basis:100%; justify-content:center; }
      .player .volume { display:none; }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; padding-bottom:120px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .podcast-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
      .stats-grid { grid-template-columns:1fr; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .podcast-grid { grid-template-columns:1fr 1fr; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-sun"></i> <span id="themeLabel">روشن</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-podcast"></i> <span id="brandName">PodCast Hub</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('home')" data-key="navHome">خانه</a>
      <a onclick="showTab('explore')" data-key="navExplore">اکسپلور</a>
      <a onclick="showTab('upload')" data-key="navUpload">آپلود</a>
      <a onclick="showTab('playlists')" data-key="navPlaylists">لیست پخش</a>
      <a onclick="showTab('stats')" data-key="navStats">آمار</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-search" onclick="showNotification('جستجو 🔍')"></i>
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب خانه ===== -->
    <div class="tab-content active" id="tab-home">
      <h2 style="margin-bottom:16px;"><i class="fas fa-fire" style="color:var(--accent);"></i> <span data-key="featuredTitle">پادکست‌های محبوب</span></h2>
      <div class="podcast-grid" id="featuredGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <h2 style="margin:20px 0 16px;"><i class="fas fa-clock" style="color:var(--accent);"></i> <span data-key="recentTitle">اپیزودهای جدید</span></h2>
      <div id="recentEpisodes">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب اکسپلور ===== -->
    <div class="tab-content" id="tab-explore">
      <h2 style="margin-bottom:16px;"><i class="fas fa-compass" style="color:var(--accent);"></i> <span data-key="exploreTitle">اکسپلور پادکست‌ها</span></h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <button class="genre-btn active" onclick="filterGenre('all')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">همه</button>
        <button class="genre-btn" onclick="filterGenre('تکنولوژی')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">تکنولوژی</button>
        <button class="genre-btn" onclick="filterGenre('علمی')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">علمی</button>
        <button class="genre-btn" onclick="filterGenre('فرهنگی')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">فرهنگی</button>
        <button class="genre-btn" onclick="filterGenre('ورزشی')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">ورزشی</button>
        <button class="genre-btn" onclick="filterGenre('کسب و کار')" style="padding:6px 16px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">کسب و کار</button>
      </div>
      <div class="podcast-grid" id="exploreGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب آپلود ===== -->
    <div class="tab-content" id="tab-upload">
      <div class="upload-section">
        <h2><i class="fas fa-upload" style="color:var(--accent);"></i> <span data-key="uploadTitle">آپلود پادکست جدید</span></h2>
        <div class="upload-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان پادکست</label>
            <input type="text" id="podcastTitle" placeholder="عنوان ...">
          </div>
          <div class="form-group">
            <label data-key="lblHost">میزبان</label>
            <input type="text" id="podcastHost" placeholder="نام میزبان ...">
          </div>
          <div class="form-group">
            <label data-key="lblGenre">ژانر</label>
            <select id="podcastGenre">
              <option value="تکنولوژی">تکنولوژی</option>
              <option value="علمی">علمی</option>
              <option value="فرهنگی">فرهنگی</option>
              <option value="ورزشی">ورزشی</option>
              <option value="کسب و کار">کسب و کار</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblDuration">مدت زمان</label>
            <input type="text" id="podcastDuration" placeholder="مثلاً ۳۰:۰۰">
          </div>
          <div class="form-group full">
            <label data-key="lblDescription">توضیحات</label>
            <textarea id="podcastDescription" placeholder="توضیحات پادکست ..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="uploadPodcast()" data-key="uploadBtn">آپلود پادکست</button>
          <button class="btn-secondary" onclick="clearUploadForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب لیست پخش ===== -->
    <div class="tab-content" id="tab-playlists">
      <h2 style="margin-bottom:16px;"><i class="fas fa-list" style="color:var(--accent);"></i> <span data-key="playlistsTitle">لیست‌های پخش من</span></h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <button onclick="createPlaylist()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">+ ایجاد لیست جدید</button>
      </div>
      <div id="playlistsContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب آمار ===== -->
    <div class="tab-content" id="tab-stats">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="statsTitle">آمار پادکست‌ها</span></h2>
      <div class="stats-grid" id="statsGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-trophy" style="color:var(--accent);"></i> <span data-key="popularTitle">محبوب‌ترین اپیزودها</span></h4>
        <div id="popularEpisodes">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
    </div>

  </div>

  <!-- ===== پخش‌کننده ===== -->
  <div class="player">
    <div class="track-info">
      <div class="cover"><i class="fas fa-podcast"></i></div>
      <div class="details">
        <div class="name" id="currentTrack">پادکست شماره ۱</div>
        <div class="host" id="currentHost">میزبان</div>
      </div>
    </div>
    <div class="controls">
      <i class="fas fa-step-backward" onclick="prevTrack()"></i>
      <i class="fas fa-play-circle play-btn" id="playBtn" onclick="togglePlay()"></i>
      <i class="fas fa-step-forward" onclick="nextTrack()"></i>
    </div>
    <div class="progress">
      <span class="time" id="currentTime">0:00</span>
      <div class="bar" onclick="seekProgress(event)">
        <div class="fill" id="progressFill"></div>
      </div>
      <span class="time" id="totalTime">30:00</span>
    </div>
    <div class="volume">
      <i class="fas fa-volume-up" onclick="toggleMute()"></i>
      <div class="bar" onclick="seekVolume(event)">
        <div class="fill" id="volumeFill" style="width:70%;"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'PodCast Hub',
        navHome: 'خانه',
        navExplore: 'اکسپلور',
        navUpload: 'آپلود',
        navPlaylists: 'لیست پخش',
        navStats: 'آمار',
        featuredTitle: 'پادکست‌های محبوب',
        recentTitle: 'اپیزودهای جدید',
        exploreTitle: 'اکسپلور پادکست‌ها',
        uploadTitle: 'آپلود پادکست جدید',
        lblTitle: 'عنوان پادکست',
        lblHost: 'میزبان',
        lblGenre: 'ژانر',
        lblDuration: 'مدت زمان',
        lblDescription: 'توضیحات',
        uploadBtn: 'آپلود پادکست',
        cancelBtn: 'انصراف',
        playlistsTitle: 'لیست‌های پخش من',
        statsTitle: 'آمار پادکست‌ها',
        popularTitle: 'محبوب‌ترین اپیزودها',
        listeners: 'شنوندگان'
      },
      en: {
        brandName: 'PodCast Hub',
        navHome: 'Home',
        navExplore: 'Explore',
        navUpload: 'Upload',
        navPlaylists: 'Playlists',
        navStats: 'Stats',
        featuredTitle: 'Featured Podcasts',
        recentTitle: 'Recent Episodes',
        exploreTitle: 'Explore Podcasts',
        uploadTitle: 'Upload New Podcast',
        lblTitle: 'Podcast Title',
        lblHost: 'Host',
        lblGenre: 'Genre',
        lblDuration: 'Duration',
        lblDescription: 'Description',
        uploadBtn: 'Upload Podcast',
        cancelBtn: 'Cancel',
        playlistsTitle: 'My Playlists',
        statsTitle: 'Podcast Stats',
        popularTitle: 'Most Popular Episodes',
        listeners: 'Listeners'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک/روشن =====
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleTheme() {
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      themeLabel.textContent = isLight ? 'دارک' : 'روشن';
      themeToggleBtn.innerHTML = `<i class="fas ${isLight ? 'fa-moon' : 'fa-sun'}"></i> ${isLight ? 'دارک' : 'روشن'}`;
    }
    themeToggleBtn.addEventListener('click', toggleTheme);

    // ===== داده‌ها =====
    let podcasts = [];
    let episodes = [];
    let playlists = [];
    let comments = [];
    let followers = [];
    let nextPodcastId = 1;
    let nextEpisodeId = 1;
    let nextPlaylistId = 1;
    let nextCommentId = 1;

    // داده‌های نمونه
    function initSampleData() {
      podcasts = [
        { id: 1, title: 'تکنولوژی روز', host: 'علی رضایی', genre: 'تکنولوژی', cover: '💻', followers: 1240, episodes: 12 },
        { id: 2, title: 'علم و زندگی', host: 'سارا محمدی', genre: 'علمی', cover: '🔬', followers: 856, episodes: 8 },
        { id: 3, title: 'فرهنگ و هنر', host: 'زهرا حسینی', genre: 'فرهنگی', cover: '🎨', followers: 623, episodes: 10 },
        { id: 4, title: 'ورزش و تناسب', host: 'مهدی کریمی', genre: 'ورزشی', cover: '🏋️', followers: 2100, episodes: 15 }
      ];

      episodes = [
        { id: 1, podcastId: 1, title: 'آینده هوش مصنوعی', duration: '۳۲:۱۵', listeners: 4500, date: '۲ روز پیش' },
        { id: 2, podcastId: 1, title: 'بلاکچین و ارزهای دیجیتال', duration: '۴۵:۲۰', listeners: 3200, date: '۵ روز پیش' },
        { id: 3, podcastId: 2, title: 'رازهای کوانتوم', duration: '۲۸:۴۰', listeners: 2800, date: '۳ روز پیش' },
        { id: 4, podcastId: 3, title: 'هنر مدرن ایران', duration: '۳۵:۱۰', listeners: 1900, date: '۱ هفته پیش' },
        { id: 5, podcastId: 4, title: 'تمرینات فانکشنال', duration: '۴۰:۰۰', listeners: 5100, date: '۴ روز پیش' }
      ];

      playlists = [
        { id: 1, name: 'پادکست‌های محبوب', episodes: [1, 3, 5] },
        { id: 2, name: 'تکنولوژی', episodes: [1, 2] }
      ];

      comments = [
        { id: 1, episodeId: 1, user: 'علی محمدی', text: 'واقعاً عالی بود! منتظر قسمت‌های بعدی هستم 🙏', time: '۲ ساعت پیش' },
        { id: 2, episodeId: 1, user: 'سارا کریمی', text: 'بسیار آموزنده و مفید', time: '۵ ساعت پیش' }
      ];

      followers = [1, 2, 4];
      nextPodcastId = 5;
      nextEpisodeId = 6;
      nextPlaylistId = 3;
      nextCommentId = 3;
    }

    let currentPodcast = null;
    let currentEpisodeIndex = 0;
    let isPlaying = false;
    let currentProgress = 35;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { home: 0, explore: 1, upload: 2, playlists: 3, stats: 4 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'home') renderHome();
      if (tabName === 'explore') renderExplore();
      if (tabName === 'playlists') renderPlaylists();
      if (tabName === 'stats') renderStats();
    }

    // ===== رندر خانه =====
    function renderHome() {
      const grid = document.getElementById('featuredGrid');
      grid.innerHTML = podcasts.map(p => `
        <div class="podcast-card" onclick="viewPodcast(${p.id})">
          <div class="cover">${p.cover}</div>
          <div class="title">${p.title}</div>
          <div class="host">${p.host}</div>
          <div class="episodes">${p.episodes} اپیزود · ${p.followers} دنبال‌کننده</div>
          <button class="follow-btn ${followers.includes(p.id) ? 'following' : 'follow'}" onclick="event.stopPropagation();toggleFollow(${p.id})">
            ${followers.includes(p.id) ? 'دنبال می‌کنید' : 'دنبال کردن'}
          </button>
        </div>
      `).join('');

      const recent = document.getElementById('recentEpisodes');
      recent.innerHTML = episodes.slice(0, 5).map(e => {
        const podcast = podcasts.find(p => p.id === e.podcastId);
        return `
          <div class="episode-item" onclick="playEpisode(${e.id})">
            <span class="number">#${e.id}</span>
            <div class="info">
              <div class="title">${e.title}</div>
              <div class="duration">${podcast ? podcast.title : ''} · ${e.duration} · ${e.date}</div>
            </div>
            <button class="play-btn" onclick="event.stopPropagation();playEpisode(${e.id})"><i class="fas fa-play"></i></button>
          </div>
        `;
      }).join('');
    }

    // ===== رندر اکسپلور =====
    function renderExplore(filter = 'all') {
      const grid = document.getElementById('exploreGrid');
      let filtered = filter === 'all' ? podcasts : podcasts.filter(p => p.genre === filter);
      grid.innerHTML = filtered.map(p => `
        <div class="podcast-card" onclick="viewPodcast(${p.id})">
          <div class="cover">${p.cover}</div>
          <div class="title">${p.title}</div>
          <div class="host">${p.host}</div>
          <div class="episodes">${p.genre} · ${p.episodes} اپیزود</div>
          <button class="follow-btn ${followers.includes(p.id) ? 'following' : 'follow'}" onclick="event.stopPropagation();toggleFollow(${p.id})">
            ${followers.includes(p.id) ? 'دنبال می‌کنید' : 'دنبال کردن'}
          </button>
        </div>
      `).join('');
    }

    function filterGenre(genre) {
      document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.genre-btn').forEach(btn => {
        if (btn.textContent === (genre === 'all' ? 'همه' : genre)) btn.classList.add('active');
      });
      renderExplore(genre);
    }

    // ===== دنبال کردن =====
    function toggleFollow(podcastId) {
      const index = followers.indexOf(podcastId);
      if (index > -1) {
        followers.splice(index, 1);
        showNotification('❌ دنبال کردن لغو شد');
      } else {
        followers.push(podcastId);
        showNotification('✅ دنبال کردن با موفقیت انجام شد!');
      }
      renderHome();
      renderExplore();
    }

    // ===== مشاهده پادکست =====
    function viewPodcast(podcastId) {
      const podcast = podcasts.find(p => p.id === podcastId);
      if (!podcast) return;
      const podEpisodes = episodes.filter(e => e.podcastId === podcastId);
      showNotification(`📻 ${podcast.title} - ${podEpisodes.length} اپیزود`);
    }

    // ===== پخش اپیزود =====
    function playEpisode(episodeId) {
      const episode = episodes.find(e => e.id === episodeId);
      if (!episode) return;
      const podcast = podcasts.find(p => p.id === episode.podcastId);
      currentPodcast = episode;
      document.getElementById('currentTrack').textContent = episode.title;
      document.getElementById('currentHost').textContent = podcast ? podcast.host : 'میزبان';
      document.getElementById('totalTime').textContent = episode.duration;
      isPlaying = true;
      document.getElementById('playBtn').className = 'fas fa-pause-circle play-btn';
      showNotification(`▶️ در حال پخش: ${episode.title}`);
    }

    // ===== کنترل‌های پلیر =====
    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').className = isPlaying ? 'fas fa-pause-circle play-btn' : 'fas fa-play-circle play-btn';
      showNotification(isPlaying ? '▶️ پخش' : '⏸️ مکث');
    }

    function nextTrack() {
      const podEpisodes = episodes.filter(e => e.podcastId === currentPodcast?.podcastId);
      if (podEpisodes.length > 0) {
        const currentIndex = podEpisodes.findIndex(e => e.id === currentPodcast?.id);
        const nextIndex = (currentIndex + 1) % podEpisodes.length;
        playEpisode(podEpisodes[nextIndex].id);
      } else {
        playEpisode(episodes[0].id);
      }
    }

    function prevTrack() {
      const podEpisodes = episodes.filter(e => e.podcastId === currentPodcast?.podcastId);
      if (podEpisodes.length > 0) {
        const currentIndex = podEpisodes.findIndex(e => e.id === currentPodcast?.id);
        const prevIndex = (currentIndex - 1 + podEpisodes.length) % podEpisodes.length;
        playEpisode(podEpisodes[prevIndex].id);
      }
    }

    function seekProgress(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const progress = Math.max(0, Math.min(1, x));
      document.getElementById('progressFill').style.width = (progress * 100) + '%';
      const total = document.getElementById('totalTime').textContent;
      const parts = total.split(':');
      const totalSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      const current = Math.floor(progress * totalSec);
      const mins = Math.floor(current / 60);
      const secs = current % 60;
      document.getElementById('currentTime').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function seekVolume(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const volume = Math.max(0, Math.min(1, x));
      document.getElementById('volumeFill').style.width = (volume * 100) + '%';
    }

    function toggleMute() {
      const fill = document.getElementById('volumeFill');
      const current = fill.style.width;
      fill.style.width = current === '0%' ? '70%' : '0%';
      showNotification(current === '0%' ? '🔊 صدا روشن' : '🔇 بی‌صدا');
    }

    // ===== آپلود پادکست =====
    function uploadPodcast() {
      const title = document.getElementById('podcastTitle').value.trim();
      const host = document.getElementById('podcastHost').value.trim();
      const genre = document.getElementById('podcastGenre').value;
      const duration = document.getElementById('podcastDuration').value.trim();
      const description = document.getElementById('podcastDescription').value.trim();

      if (!title || !host || !duration || !description) {
        showNotification('❌ لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      const newPodcast = {
        id: nextPodcastId++,
        title,
        host,
        genre,
        cover: '🎙️',
        followers: 0,
        episodes: 1
      };
      podcasts.push(newPodcast);

      episodes.push({
        id: nextEpisodeId++,
        podcastId: newPodcast.id,
        title: title + ' - اپیزود ۱',
        duration,
        listeners: 0,
        date: 'همین الان'
      });

      clearUploadForm();
      renderHome();
      renderExplore();
      renderStats();
      showNotification('✅ پادکست با موفقیت آپلود شد!');
      showTab('home');
    }

    function clearUploadForm() {
      document.getElementById('podcastTitle').value = '';
      document.getElementById('podcastHost').value = '';
      document.getElementById('podcastDuration').value = '';
      document.getElementById('podcastDescription').value = '';
    }

    // ===== لیست پخش =====
    function renderPlaylists() {
      const container = document.getElementById('playlistsContainer');
      if (playlists.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">هیچ لیست پخشی ایجاد نشده است</p>';
        return;
      }
      container.innerHTML = playlists.map(p => `
        <div class="playlist-item" onclick="showNotification('باز کردن ${p.name}')">
          <div class="cover"><i class="fas fa-list"></i></div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="count">${p.episodes.length} اپیزود</div>
          </div>
          <i class="fas fa-play" onclick="event.stopPropagation();showNotification('▶️ پخش ${p.name}')"></i>
        </div>
      `).join('');
    }

    function createPlaylist() {
      const name = prompt('نام لیست پخش جدید:');
      if (!name || !name.trim()) return;
      playlists.push({
        id: nextPlaylistId++,
        name: name.trim(),
        episodes: []
      });
      renderPlaylists();
      showNotification('✅ لیست پخش "' + name + '" ایجاد شد!');
    }

    // ===== آمار =====
    function renderStats() {
      const totalPodcasts = podcasts.length;
      const totalEpisodes = episodes.length;
      const totalListeners = episodes.reduce((sum, e) => sum + e.listeners, 0);
      const totalFollowers = followers.length;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card"><div class="number">${totalPodcasts}</div><div class="label">کل پادکست‌ها</div></div>
        <div class="stat-card"><div class="number">${totalEpisodes}</div><div class="label">کل اپیزودها</div></div>
        <div class="stat-card"><div class="number">${totalListeners.toLocaleString()}</div><div class="label">کل شنوندگان</div></div>
        <div class="stat-card"><div class="number">${totalFollowers}</div><div class="label">دنبال‌کنندگان</div></div>
      `;

      const popular = document.getElementById('popularEpisodes');
      const sorted = [...episodes].sort((a, b) => b.listeners - a.listeners).slice(0, 5);
      popular.innerHTML = sorted.map((e, i) => {
        const podcast = podcasts.find(p => p.id === e.podcastId);
        return `
          <div class="episode-item" onclick="playEpisode(${e.id})">
            <span class="number">${i + 1}.</span>
            <div class="info">
              <div class="title">${e.title}</div>
              <div class="duration">${podcast ? podcast.title : ''} · ${e.listeners.toLocaleString()} شنونده</div>
            </div>
            <button class="play-btn" onclick="event.stopPropagation();playEpisode(${e.id})"><i class="fas fa-play"></i></button>
          </div>
        `;
      }).join('');
    }

    // ===== نظرات =====
    function addComment(episodeId) {
      const text = prompt('نظر خود را وارد کنید:');
      if (!text || !text.trim()) return;
      comments.push({
        id: nextCommentId++,
        episodeId,
        user: 'شما',
        text: text.trim(),
        time: 'همین الان'
      });
      showNotification('✅ نظر شما با موفقیت ثبت شد!');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderHome();
    renderExplore();
    renderPlaylists();
    renderStats();

    // پخش اولین اپیزود به‌عنوان پیش‌فرض
    if (episodes.length > 0) playEpisode(episodes[0].id);

    console.log('✅ پلتفرم پادکست کامل بارگذاری شد!');
  </script>
</body>
</html>
