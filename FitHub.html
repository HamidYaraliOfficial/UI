<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم دوره‌های ورزشی | FitHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --accent: #ff6b35;
      --accent-hover: #e55a2b;
      --accent-glow: rgba(255,107,53,0.3);
      --success: #00d4aa;
      --warning: #ffc107;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-hover: 0 16px 48px rgba(0,0,0,0.6);
      --radius: 16px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.light-mode {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --shadow: 0 8px 32px rgba(0,0,0,0.06);
      --shadow-hover: 0 16px 48px rgba(0,0,0,0.10);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary);
      border-bottom:2px solid var(--accent);
      padding:10px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700;
      display:flex; align-items:center; gap:10px;
    }
    .header .logo span { color:var(--accent); }
    .header .logo i { color:var(--accent); font-size:1.8rem; }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.4s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(15px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های دوره ===== */
    .course-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .course-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; border:1px solid var(--border-color);
      transition:var(--transition);
      cursor:pointer;
      box-shadow:var(--shadow);
    }
    .course-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-hover); }
    .course-card .image {
      height:180px;
      background:linear-gradient(135deg, var(--accent), #ff8a5c);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:3rem; position:relative;
    }
    .course-card .image .level-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.7); padding:4px 14px;
      border-radius:50px; font-size:0.65rem; font-weight:600;
    }
    body.ltr .course-card .image .level-badge { right:auto; left:12px; }
    .course-card .image .price-badge {
      position:absolute; bottom:12px; right:12px;
      background:rgba(0,0,0,0.7); padding:4px 14px;
      border-radius:50px; font-size:0.85rem; font-weight:700;
    }
    body.ltr .course-card .image .price-badge { right:auto; left:12px; }
    .course-card .content { padding:14px; }
    .course-card .content .title { font-size:1rem; font-weight:700; }
    .course-card .content .instructor {
      font-size:0.85rem; color:var(--text-muted);
      display:flex; align-items:center; gap:6px;
    }
    .course-card .content .meta {
      display:flex; justify-content:space-between;
      border-top:1px solid var(--border-color); padding-top:10px;
      font-size:0.8rem; color:var(--text-muted);
    }

    /* ===== برنامه تمرینی ===== */
    .workout-plan {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
      box-shadow:var(--shadow);
    }
    .workout-day {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px; border-bottom:1px solid var(--border-color);
    }
    .workout-day:last-child { border-bottom:none; }
    .workout-day .day { font-weight:600; font-size:0.95rem; }
    .workout-day .exercises { font-size:0.85rem; color:var(--text-secondary); }
    .workout-day .status {
      padding:2px 12px; border-radius:50px; font-size:0.7rem; font-weight:600;
    }
    .workout-day .status.done { background:rgba(0,212,170,0.15); color:var(--success); }
    .workout-day .status.pending { background:rgba(255,193,7,0.15); color:var(--warning); }

    /* ===== ویدیوها ===== */
    .video-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
      gap:16px;
    }
    .video-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; border:1px solid var(--border-color);
      transition:var(--transition); cursor:pointer;
    }
    .video-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .video-card .thumb {
      height:150px; background:linear-gradient(135deg, #2d2d5e, #1a1a3a);
      display:flex; align-items:center; justify-content:center;
      font-size:3rem; color:var(--accent); position:relative;
    }
    .video-card .thumb .play-btn {
      position:absolute; font-size:4rem; color:#fff; opacity:0.6;
      transition:var(--transition);
    }
    .video-card .thumb:hover .play-btn { opacity:1; transform:scale(1.1); }
    .video-card .thumb .duration {
      position:absolute; bottom:8px; right:8px;
      background:rgba(0,0,0,0.7); padding:2px 10px;
      border-radius:4px; font-size:0.7rem; color:#fff;
    }
    body.ltr .video-card .thumb .duration { right:auto; left:8px; }
    .video-card .content { padding:12px; }
    .video-card .content .title { font-weight:600; font-size:0.9rem; }
    .video-card .content .views { font-size:0.75rem; color:var(--text-muted); }

    /* ===== پیشرفت ===== */
    .progress-container {
      display:grid; grid-template-columns:1fr 1fr; gap:20px;
    }
    .progress-card {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
      text-align:center;
    }
    .progress-card .value {
      font-size:2rem; font-weight:700; color:var(--accent);
    }
    .progress-card .label { font-size:0.85rem; color:var(--text-muted); }
    .progress-bar-track {
      height:8px; background:var(--bg-primary); border-radius:10px;
      overflow:hidden; margin-top:8px;
    }
    .progress-bar-track .fill {
      height:100%; border-radius:10px;
      background:linear-gradient(90deg, var(--accent), #ff8a5c);
      transition:width 1s ease;
    }

    /* ===== چالش‌ها ===== */
    .challenge-item {
      background:var(--bg-card); border-radius:var(--radius);
      padding:14px 16px; border:1px solid var(--border-color);
      margin-bottom:10px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .challenge-item .info .title { font-weight:600; }
    .challenge-item .info .desc { font-size:0.85rem; color:var(--text-secondary); }
    .challenge-item .join-btn {
      padding:4px 16px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; cursor:pointer; font-weight:600;
      transition:var(--transition);
    }
    .challenge-item .join-btn:hover { background:var(--accent-hover); }
    .challenge-item .join-btn.joined { background:var(--success); }

    /* ===== انجمن ===== */
    .forum-post {
      background:var(--bg-card); border-radius:var(--radius);
      padding:12px 16px; border:1px solid var(--border-color);
      margin-bottom:10px;
    }
    .forum-post .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px; border-bottom:none; padding:0;
    }
    .forum-post .header .user { font-weight:600; font-size:0.9rem; display:flex; align-items:center; gap:8px; }
    .forum-post .header .user .avatar {
      width:28px; height:28px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.6rem;
    }
    .forum-post .header .time { font-size:0.7rem; color:var(--text-muted); }
    .forum-post .text { font-size:0.9rem; color:var(--text-secondary); margin:4px 0 8px; }
    .forum-post .actions i {
      cursor:pointer; margin-left:10px; color:var(--text-muted);
      transition:var(--transition);
    }
    body.ltr .forum-post .actions i { margin-left:0; margin-right:10px; }
    .forum-post .actions i:hover { color:var(--accent); }

    /* ===== پنل مربی ===== */
    .instructor-stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .instructor-stat {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .instructor-stat .number { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .instructor-stat .label { font-size:0.85rem; color:var(--text-muted); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--bg-card); color:var(--text-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:var(--shadow);
      border:1px solid var(--border-color);
    }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .progress-container { grid-template-columns:1fr; }
      .instructor-stats { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .course-grid { grid-template-columns:1fr; }
      .video-grid { grid-template-columns:1fr; }
      .challenge-item { flex-direction:column; text-align:center; gap:8px; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-dumbbell"></i> <span id="brandName">Fit<span>Hub</span></span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('courses')" data-key="navCourses">دوره‌ها</a>
      <a onclick="showTab('workout')" data-key="navWorkout">برنامه تمرینی</a>
      <a onclick="showTab('videos')" data-key="navVideos">ویدیوها</a>
      <a onclick="showTab('progress')" data-key="navProgress">پیشرفت</a>
      <a onclick="showTab('challenges')" data-key="navChallenges">چالش‌ها</a>
      <a onclick="showTab('forum')" data-key="navForum">انجمن</a>
      <a onclick="showTab('instructor')" data-key="navInstructor">پنل مربی</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب دوره‌ها ===== -->
    <div class="tab-content active" id="tab-courses">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-fire" style="color:var(--accent);"></i> <span data-key="coursesTitle">دوره‌های ورزشی</span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button onclick="filterCourses('all')" class="filter-btn" style="padding:4px 14px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">همه</button>
          <button onclick="filterCourses('مبتدی')" class="filter-btn" style="padding:4px 14px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">مبتدی</button>
          <button onclick="filterCourses('متوسط')" class="filter-btn" style="padding:4px 14px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">متوسط</button>
          <button onclick="filterCourses('پیشرفته')" class="filter-btn" style="padding:4px 14px;border:1px solid var(--border-color);border-radius:50px;background:var(--bg-card);color:var(--text-primary);cursor:pointer;">پیشرفته</button>
        </div>
      </div>
      <div class="course-grid" id="courseGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب برنامه تمرینی ===== -->
    <div class="tab-content" id="tab-workout">
      <h2 style="margin-bottom:16px;"><i class="fas fa-calendar-alt" style="color:var(--accent);"></i> <span data-key="workoutTitle">برنامه تمرینی هفتگی</span></h2>
      <div class="workout-plan" id="workoutPlan">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب ویدیوها ===== -->
    <div class="tab-content" id="tab-videos">
      <h2 style="margin-bottom:16px;"><i class="fas fa-video" style="color:var(--accent);"></i> <span data-key="videosTitle">ویدیوهای آموزشی</span></h2>
      <div class="video-grid" id="videoGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب پیشرفت ===== -->
    <div class="tab-content" id="tab-progress">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-line" style="color:var(--accent);"></i> <span data-key="progressTitle">پیشرفت من</span></h2>
      <div class="progress-container" id="progressContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="margin-top:20px;background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:8px;">📊 نمودار پیشرفت</h4>
        <div style="display:flex;gap:8px;align-items:flex-end;height:120px;padding:8px 0;">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;height:${Math.random() * 80 + 20}%;background:var(--accent);border-radius:4px 4px 0 0;min-height:20px;"></div>
            <span style="font-size:0.6rem;color:var(--text-muted);">هفته ۱</span>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;height:${Math.random() * 80 + 20}%;background:var(--accent);border-radius:4px 4px 0 0;min-height:20px;"></div>
            <span style="font-size:0.6rem;color:var(--text-muted);">هفته ۲</span>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;height:${Math.random() * 80 + 20}%;background:var(--accent);border-radius:4px 4px 0 0;min-height:20px;"></div>
            <span style="font-size:0.6rem;color:var(--text-muted);">هفته ۳</span>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;height:${Math.random() * 80 + 20}%;background:var(--accent);border-radius:4px 4px 0 0;min-height:20px;"></div>
            <span style="font-size:0.6rem;color:var(--text-muted);">هفته ۴</span>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
            <div style="width:100%;height:${Math.random() * 80 + 20}%;background:var(--accent);border-radius:4px 4px 0 0;min-height:20px;"></div>
            <span style="font-size:0.6rem;color:var(--text-muted);">هفته ۵</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== تب چالش‌ها ===== -->
    <div class="tab-content" id="tab-challenges">
      <h2 style="margin-bottom:16px;"><i class="fas fa-trophy" style="color:var(--accent);"></i> <span data-key="challengesTitle">چالش‌های روزانه و هفتگی</span></h2>
      <div id="challengesContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب انجمن ===== -->
    <div class="tab-content" id="tab-forum">
      <h2 style="margin-bottom:16px;"><i class="fas fa-comments" style="color:var(--accent);"></i> <span data-key="forumTitle">انجمن تبادل نظر</span></h2>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <input type="text" id="forumInput" placeholder="متن پست ..." style="flex:1;padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
        <button onclick="addForumPost()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;" data-key="postBtn">ارسال</button>
      </div>
      <div id="forumContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب پنل مربی ===== -->
    <div class="tab-content" id="tab-instructor">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chalkboard-teacher" style="color:var(--accent);"></i> <span data-key="instructorTitle">پنل مربی</span></h2>
      <div class="instructor-stats" id="instructorStats">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-users"></i> <span data-key="myCourses">دوره‌های من</span></h4>
          <div id="myCourses"></div>
          <button onclick="addInstructorCourse()" style="margin-top:12px;padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;">+ افزودن دوره</button>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
          <h4 style="margin-bottom:12px;"><i class="fas fa-user-check"></i> <span data-key="students">کاربران فعال</span></h4>
          <div id="studentsList"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'FitHub',
        navCourses: 'دوره‌ها',
        navWorkout: 'برنامه تمرینی',
        navVideos: 'ویدیوها',
        navProgress: 'پیشرفت',
        navChallenges: 'چالش‌ها',
        navForum: 'انجمن',
        navInstructor: 'پنل مربی',
        coursesTitle: 'دوره‌های ورزشی',
        workoutTitle: 'برنامه تمرینی هفتگی',
        videosTitle: 'ویدیوهای آموزشی',
        progressTitle: 'پیشرفت من',
        challengesTitle: 'چالش‌های روزانه و هفتگی',
        forumTitle: 'انجمن تبادل نظر',
        instructorTitle: 'پنل مربی',
        postBtn: 'ارسال',
        myCourses: 'دوره‌های من',
        students: 'کاربران فعال'
      },
      en: {
        brandName: 'FitHub',
        navCourses: 'Courses',
        navWorkout: 'Workout Plan',
        navVideos: 'Videos',
        navProgress: 'Progress',
        navChallenges: 'Challenges',
        navForum: 'Forum',
        navInstructor: 'Instructor Panel',
        coursesTitle: 'Fitness Courses',
        workoutTitle: 'Weekly Workout Plan',
        videosTitle: 'Training Videos',
        progressTitle: 'My Progress',
        challengesTitle: 'Daily & Weekly Challenges',
        forumTitle: 'Discussion Forum',
        instructorTitle: 'Instructor Panel',
        postBtn: 'Post',
        myCourses: 'My Courses',
        students: 'Active Users'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک/روشن =====
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleTheme() {
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      themeLabel.textContent = isLight ? 'دارک' : 'روشن';
      themeToggleBtn.innerHTML = `<i class="fas ${isLight ? 'fa-moon' : 'fa-sun'}"></i> ${isLight ? 'دارک' : 'روشن'}`;
    }
    themeToggleBtn.addEventListener('click', toggleTheme);

    // ===== داده‌ها =====
    let courses = [
      { id: 1, title: 'تمرینات هوازی پیشرفته', instructor: 'علی رضایی', level: 'پیشرفته', price: '۲۵۰,۰۰۰', image: '🏃', students: 124, duration: '۴ هفته' },
      { id: 2, title: 'بدنسازی فشرده', instructor: 'سارا محمدی', level: 'متوسط', price: '۱۸۰,۰۰۰', image: '💪', students: 89, duration: '۶ هفته' },
      { id: 3, title: 'یوگا و آرامش', instructor: 'زهرا حسینی', level: 'مبتدی', price: '۱۲۰,۰۰۰', image: '🧘', students: 56, duration: '۳ هفته' },
      { id: 4, title: 'تمرینات فانکشنال', instructor: 'مهدی کریمی', level: 'متوسط', price: '۲۰۰,۰۰۰', image: '🏋️', students: 72, duration: '۵ هفته' }
    ];

    let workoutPlan = [
      { day: 'شنبه', exercises: 'اسکوات ۳×۱۲ · پرس سینه ۳×۱۰ · کراس فیت', status: 'done' },
      { day: 'یکشنبه', exercises: 'دوچرخه ثابت ۲۰دقیقه · بارفیکس ۳×۸', status: 'done' },
      { day: 'دوشنبه', exercises: 'تمرینات قدرتی · اسکوات · ددلیفت', status: 'pending' },
      { day: 'سه‌شنبه', exercises: 'یوگا و حرکات کششی', status: 'pending' },
      { day: 'چهارشنبه', exercises: 'تمرینات هوازی · طناب زدن · بورپی', status: 'pending' },
      { day: 'پنجشنبه', exercises: 'استراحت فعال · پیاده‌روی سریع', status: 'pending' },
      { day: 'جمعه', exercises: 'استراحت کامل', status: 'pending' }
    ];

    let videos = [
      { id: 1, title: 'تمرینات هوازی ۳۰ دقیقه', duration: '۳۰:۰۰', views: '۱۲۴K', thumb: '🏃' },
      { id: 2, title: 'آموزش کامل اسکوات', duration: '۱۵:۲۰', views: '۸۹K', thumb: '🏋️' },
      { id: 3, title: 'تمرینات کششی پیشرفته', duration: '۲۰:۴۵', views: '۵۶K', thumb: '🧘' },
      { id: 4, title: 'تمرینات اینتروال HIIT', duration: '۲۵:۱۰', views: '۲۱۰K', thumb: '🔥' }
    ];

    let challenges = [
      { id: 1, title: 'چالش ۱۰۰۰ حرکت در روز', desc: 'انجام ۱۰۰۰ حرکت ورزشی در یک روز', type: 'روزانه', joined: false },
      { id: 2, title: 'چالش ۷ روزه پلانک', desc: 'هر روز ۳۰ ثانیه پلانک اضافه کنید', type: 'هفتگی', joined: false },
      { id: 3, title: 'چالش ۵۰ کیلومتر دویدن', desc: '۵۰ کیلومتر دویدن در طول هفته', type: 'هفتگی', joined: false }
    ];

    let forumPosts = [
      { id: 1, user: 'علی رضایی', text: 'سلام! چه تمرینی برای کاهش وزن سریع پیشنهاد می‌دهید؟', time: '۲ ساعت پیش', likes: 5 },
      { id: 2, user: 'سارا محمدی', text: 'برنامه تمرینی امروز عالی بود! واقعاً لذت بردم 💪', time: '۵ ساعت پیش', likes: 3 }
    ];

    let users = [
      { id: 1, name: 'علی رضایی', progress: 75, weight: '۷۲ کیلوگرم', goal: 'کاهش وزن' },
      { id: 2, name: 'سارا محمدی', progress: 60, weight: '۶۵ کیلوگرم', goal: 'افزایش عضله' },
      { id: 3, name: 'مهدی کریمی', progress: 90, weight: '۸۰ کیلوگرم', goal: 'تناسب اندام' }
    ];

    let nextCourseId = 5;
    let nextPostId = 3;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { courses: 0, workout: 1, videos: 2, progress: 3, challenges: 4, forum: 5, instructor: 6 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'courses') renderCourses();
      if (tabName === 'workout') renderWorkout();
      if (tabName === 'videos') renderVideos();
      if (tabName === 'progress') renderProgress();
      if (tabName === 'challenges') renderChallenges();
      if (tabName === 'forum') renderForum();
      if (tabName === 'instructor') renderInstructor();
    }

    // ===== دوره‌ها =====
    function renderCourses(filter = 'all') {
      const grid = document.getElementById('courseGrid');
      let filtered = filter === 'all' ? courses : courses.filter(c => c.level === filter);
      grid.innerHTML = filtered.map(c => `
        <div class="course-card" onclick="showNotification('ثبت‌نام در ${c.title}')">
          <div class="image">
            ${c.image}
            <span class="level-badge">${c.level}</span>
            <span class="price-badge">${c.price} تومان</span>
          </div>
          <div class="content">
            <div class="title">${c.title}</div>
            <div class="instructor"><i class="fas fa-user"></i> ${c.instructor}</div>
            <div class="meta">
              <span><i class="fas fa-users"></i> ${c.students} دانشجو</span>
              <span><i class="fas fa-clock"></i> ${c.duration}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCourses(level) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.style.borderColor = 'var(--border-color)');
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.textContent === (level === 'all' ? 'همه' : level)) {
          btn.style.borderColor = 'var(--accent)';
        }
      });
      renderCourses(level);
    }

    // ===== برنامه تمرینی =====
    function renderWorkout() {
      const container = document.getElementById('workoutPlan');
      container.innerHTML = workoutPlan.map(w => `
        <div class="workout-day">
          <div class="day">${w.day}</div>
          <div class="exercises">${w.exercises}</div>
          <span class="status ${w.status}">${w.status === 'done' ? '✓ انجام شده' : 'در انتظار'}</span>
        </div>
      `).join('');
    }

    // ===== ویدیوها =====
    function renderVideos() {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = videos.map(v => `
        <div class="video-card" onclick="showNotification('پخش ویدیو: ${v.title} ▶️')">
          <div class="thumb">
            ${v.thumb}
            <div class="play-btn"><i class="fas fa-play-circle"></i></div>
            <span class="duration">${v.duration}</span>
          </div>
          <div class="content">
            <div class="title">${v.title}</div>
            <div class="views"><i class="fas fa-eye"></i> ${v.views} بازدید</div>
          </div>
        </div>
      `).join('');
    }

    // ===== پیشرفت =====
    function renderProgress() {
      const container = document.getElementById('progressContainer');
      container.innerHTML = `
        <div class="progress-card">
          <div class="value">۷۲</div>
          <div class="label">وزن (کیلوگرم)</div>
          <div class="progress-bar-track"><div class="fill" style="width:72%;"></div></div>
        </div>
        <div class="progress-card">
          <div class="value">۸۵%</div>
          <div class="label">پیشرفت کلی</div>
          <div class="progress-bar-track"><div class="fill" style="width:85%;"></div></div>
        </div>
        <div class="progress-card">
          <div class="value">۱۲</div>
          <div class="label">جلسات تمرینی</div>
          <div class="progress-bar-track"><div class="fill" style="width:60%;"></div></div>
        </div>
        <div class="progress-card">
          <div class="value">۴.۲</div>
          <div class="label">میانگین تمرین (ساعت)</div>
          <div class="progress-bar-track"><div class="fill" style="width:70%;"></div></div>
        </div>
      `;
    }

    // ===== چالش‌ها =====
    function renderChallenges() {
      const container = document.getElementById('challengesContainer');
      container.innerHTML = challenges.map(c => `
        <div class="challenge-item">
          <div class="info">
            <div class="title">${c.title} <span style="font-size:0.7rem;color:var(--text-muted);">(${c.type})</span></div>
            <div class="desc">${c.desc}</div>
          </div>
          <button class="join-btn ${c.joined ? 'joined' : ''}" onclick="joinChallenge(${c.id})">
            ${c.joined ? '✓ عضو شده' : 'شرکت در چالش'}
          </button>
        </div>
      `).join('');
    }

    function joinChallenge(id) {
      const challenge = challenges.find(c => c.id === id);
      if (!challenge) return;
      challenge.joined = !challenge.joined;
      renderChallenges();
      showNotification(challenge.joined ? '✅ به چالش پیوستید!' : '❌ از چالش خارج شدید');
    }

    // ===== انجمن =====
    function renderForum() {
      const container = document.getElementById('forumContainer');
      container.innerHTML = forumPosts.map(p => `
        <div class="forum-post">
          <div class="header">
            <span class="user"><span class="avatar">${p.user[0]}</span> ${p.user}</span>
            <span class="time">${p.time}</span>
          </div>
          <div class="text">${p.text}</div>
          <div class="actions">
            <i class="fas fa-heart" onclick="likePost(${p.id})"> <span>${p.likes}</span></i>
            <i class="fas fa-reply" onclick="showNotification('پاسخ 💬')"></i>
          </div>
        </div>
      `).join('');
    }

    function addForumPost() {
      const input = document.getElementById('forumInput');
      const text = input.value.trim();
      if (!text) { showNotification('لطفاً متن پست را وارد کنید!'); return; }
      forumPosts.unshift({
        id: nextPostId++,
        user: 'شما',
        text: text,
        time: 'همین الان',
        likes: 0
      });
      input.value = '';
      renderForum();
      showNotification('✅ پست شما با موفقیت ارسال شد!');
    }

    function likePost(id) {
      const post = forumPosts.find(p => p.id === id);
      if (post) post.likes++;
      renderForum();
    }

    // ===== پنل مربی =====
    function renderInstructor() {
      document.querySelector('.instructor-stats').innerHTML = `
        <div class="instructor-stat"><div class="number">${courses.length}</div><div class="label">دوره‌ها</div></div>
        <div class="instructor-stat"><div class="number">${courses.reduce((sum, c) => sum + c.students, 0)}</div><div class="label">دانشجویان</div></div>
        <div class="instructor-stat"><div class="number">${videos.length}</div><div class="label">ویدیوها</div></div>
        <div class="instructor-stat"><div class="number">${forumPosts.length}</div><div class="label">پست‌های انجمن</div></div>
      `;

      const myCourses = document.getElementById('myCourses');
      myCourses.innerHTML = courses.map(c => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span>${c.title}</span>
          <span style="color:var(--text-muted);">${c.students} دانشجو</span>
        </div>
      `).join('');

      const studentsList = document.getElementById('studentsList');
      studentsList.innerHTML = users.map(u => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span><strong>${u.name}</strong> - ${u.goal}</span>
          <span style="color:var(--accent);">${u.progress}%</span>
        </div>
      `).join('');
    }

    function addInstructorCourse() {
      const title = prompt('عنوان دوره:');
      if (!title || !title.trim()) return;
      const level = prompt('سطح (مبتدی/متوسط/پیشرفته):') || 'مبتدی';
      const price = prompt('قیمت (تومان):') || '۰';
      courses.push({
        id: nextCourseId++,
        title: title.trim(),
        instructor: 'مدرس',
        level: level,
        price: price,
        image: '🏋️',
        students: 0,
        duration: '۴ هفته'
      });
      renderCourses();
      renderInstructor();
      showNotification('✅ دوره جدید اضافه شد!');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    setLanguage('fa');
    renderCourses();
    renderWorkout();
    renderVideos();
    renderProgress();
    renderChallenges();
    renderForum();
    renderInstructor();

    console.log('✅ پلتفرم دوره‌های ورزشی FitHub کامل بارگذاری شد!');
  </script>
</body>
</html>
