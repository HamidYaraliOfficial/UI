<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوپرمارکت آنلاین | SuperMart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    :root{--bg-primary:#f0f2f5;--bg-secondary:#ffffff;--bg-card:#ffffff;--text-primary:#1a1a2e;--text-secondary:#4a4a6a;--text-muted:#8a8aa8;--border-color:#e8ecf1;--accent:#e74c3c;--accent-hover:#c0392b;--accent-glow:rgba(231,76,60,0.2);--success:#27ae60;--warning:#f39c12;--shadow:0 4px 20px rgba(0,0,0,0.04);--shadow-hover:0 8px 40px rgba(0,0,0,0.08);--radius:16px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}
    body.dark-mode{--bg-primary:#0a0a1a;--bg-secondary:#12122a;--bg-card:#1a1a3a;--text-primary:#e8edf5;--text-secondary:#b0b8d0;--text-muted:#6a7a9a;--border-color:#2a2a4a;--shadow:0 4px 20px rgba(0,0,0,0.3);--shadow-hover:0 8px 40px rgba(0,0,0,0.5)}
    body{background:var(--bg-primary);min-height:100vh;transition:var(--transition);color:var(--text-primary)}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:10px}
    .control-buttons{position:fixed;top:12px;right:12px;display:flex;gap:6px;z-index:9999}
    .theme-toggle,.lang-toggle{background:var(--bg-card);border:1px solid var(--border-color);padding:6px 12px;border-radius:50px;cursor:pointer;font-size:0.65rem;display:flex;align-items:center;gap:4px;transition:var(--transition);box-shadow:var(--shadow);color:var(--text-primary)}
    .theme-toggle:hover,.lang-toggle:hover{transform:scale(1.05);box-shadow:var(--shadow-hover)}
    body.ltr .control-buttons{right:auto;left:12px}
    .header{background:var(--bg-secondary);border-bottom:2px solid var(--accent);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
    .header .logo{font-size:1.4rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:10px}
    .header .logo i{font-size:1.6rem}
    .header-search{display:flex;align-items:center;background:var(--bg-primary);border-radius:50px;padding:6px 16px;gap:8px;border:1px solid var(--border-color);transition:var(--transition);flex:1;max-width:400px;margin:0 16px}
    .header-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}
    .header-search input{border:none;background:transparent;outline:none;flex:1;color:var(--text-primary);font-size:0.9rem}
    .header-search input::placeholder{color:var(--text-muted)}
    .header-search button{background:var(--accent);color:#fff;border:none;border-radius:50px;padding:4px 14px;cursor:pointer;transition:var(--transition);font-weight:600}
    .header-search button:hover{background:var(--accent-hover)}
    .header-actions{display:flex;gap:16px;align-items:center}
    .header-actions i{font-size:1.2rem;cursor:pointer;color:var(--text-secondary);transition:var(--transition)}
    .header-actions i:hover{color:var(--accent);transform:scale(1.1)}
    .header-actions .cart-badge{position:relative}
    .header-actions .cart-badge::after{content:attr(data-count);position:absolute;top:-6px;right:-8px;background:var(--accent);color:#fff;font-size:0.5rem;padding:1px 5px;border-radius:50%;font-weight:700}
    body.ltr .header-actions .cart-badge::after{right:auto;left:-8px}
    .header-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:0.8rem;cursor:pointer}
    .header .nav-links{display:flex;gap:16px;align-items:center}
    .header .nav-links a{color:var(--text-secondary);text-decoration:none;font-weight:500;cursor:pointer;transition:var(--transition);font-size:0.85rem}
    .header .nav-links a:hover{color:var(--accent)}
    .header .nav-links a.active{color:var(--accent);font-weight:700}
    .main-content{max-width:1200px;margin:0 auto;padding:20px 24px}
    .tab-content{display:none;animation:fadeIn 0.3s ease}
    .tab-content.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .hero-banner{background:linear-gradient(135deg,var(--accent),var(--accent-hover));border-radius:var(--radius);padding:40px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;color:#fff}
    .hero-banner h2{font-size:2rem;font-weight:700}
    .hero-banner p{font-size:1.1rem;opacity:0.9;margin-top:4px}
    .hero-banner .off-badge{background:rgba(255,255,255,0.2);padding:8px 24px;border-radius:50px;font-size:1.2rem;font-weight:700}
    .category-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:12px;background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border-color)}
    .category-btn{padding:6px 18px;border:1px solid var(--border-color);border-radius:50px;background:transparent;color:var(--text-secondary);cursor:pointer;transition:var(--transition);font-size:0.8rem;font-weight:500}
    .category-btn:hover{border-color:var(--accent);color:var(--accent)}
    .category-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-bottom:24px}
    .product-card{background:var(--bg-card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-color);transition:var(--transition);box-shadow:var(--shadow)}
    .product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
    .product-card .image{height:180px;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;position:relative;padding:12px}
    .product-card .image img{max-width:100%;max-height:100%;object-fit:contain}
    .product-card .image .discount-badge{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;padding:2px 12px;border-radius:50px;font-size:0.65rem;font-weight:600}
    body.ltr .product-card .image .discount-badge{right:auto;left:8px}
    .product-card .content{padding:14px}
    .product-card .content .name{font-weight:600;font-size:0.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .product-card .content .weight{font-size:0.75rem;color:var(--text-muted)}
    .product-card .content .price{font-size:1.2rem;font-weight:700;color:var(--accent);margin:4px 0}
    .product-card .content .price .old{font-size:0.8rem;color:var(--text-muted);text-decoration:line-through;margin-right:8px;font-weight:400}
    .product-card .content .rating{color:var(--warning);font-size:0.8rem}
    .product-card .content .actions{display:flex;gap:8px;margin-top:8px}
    .product-card .content .actions button{padding:6px 12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);flex:1;font-size:0.8rem}
    .product-card .content .actions .add-btn{background:var(--accent);color:#fff}
    .product-card .content .actions .add-btn:hover{background:var(--accent-hover)}
    .product-card .content .actions .add-btn.in-cart{background:var(--success)}
    .product-card .content .actions .fav-btn{background:var(--bg-primary);color:var(--text-secondary);flex:0.3}
    .product-card .content .actions .fav-btn:hover{color:var(--accent)}
    .cart-sidebar{position:fixed;top:0;left:-400px;width:380px;height:100%;background:var(--bg-secondary);box-shadow:-4px 0 30px rgba(0,0,0,0.1);z-index:9998;transition:var(--transition);padding:20px;overflow-y:auto}
    body.ltr .cart-sidebar{left:auto;right:-400px}
    .cart-sidebar.open{left:0}
    body.ltr .cart-sidebar.open{left:auto;right:0}
    .cart-sidebar .header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:12px}
    .cart-sidebar .header h3{font-size:1.2rem}
    .cart-sidebar .close-btn{cursor:pointer;font-size:1.4rem;color:var(--text-muted)}
    .cart-sidebar .close-btn:hover{color:var(--accent)}
    .cart-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-color)}
    .cart-item .image{width:50px;height:50px;background:var(--bg-primary);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px}
    .cart-item .image img{max-width:100%;max-height:100%;object-fit:contain}
    .cart-item .info{flex:1}
    .cart-item .info .name{font-weight:600;font-size:0.85rem}
    .cart-item .info .price{color:var(--accent);font-weight:700}
    .cart-item .qty{display:flex;align-items:center;gap:6px}
    .cart-item .qty button{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-color);background:transparent;cursor:pointer;font-weight:700;transition:var(--transition)}
    .cart-item .qty button:hover{border-color:var(--accent);color:var(--accent)}
    .cart-item .remove-btn{color:var(--text-muted);cursor:pointer;transition:var(--transition)}
    .cart-item .remove-btn:hover{color:var(--accent)}
    .cart-total{padding:16px 0;border-top:2px solid var(--border-color);margin-top:12px}
    .cart-total .row{display:flex;justify-content:space-between;padding:4px 0;font-size:0.9rem}
    .cart-total .row.total{font-weight:700;font-size:1.1rem;color:var(--accent)}
    .cart-total .checkout-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:var(--transition);margin-top:8px}
    .cart-total .checkout-btn:hover{background:var(--accent-hover)}
    .cart-empty{text-align:center;padding:40px;color:var(--text-muted)}
    .cart-empty i{font-size:4rem;opacity:0.3}
    .notification{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);color:var(--bg-primary);padding:8px 18px;border-radius:10px;font-size:0.8rem;z-index:9999;opacity:0;transition:0.5s;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
    body.dark-mode .notification{background:#2a2a2a;color:#e8e8e8}
    .notification.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:9997;display:none}
    .overlay.show{display:block}
    @media(max-width:992px){.header{flex-wrap:wrap;gap:8px;padding:8px 12px}.header .nav-links{flex-wrap:wrap;gap:8px}.header-search{max-width:100%;margin:0;order:3;flex-basis:100%}.cart-sidebar{width:320px}}
    @media(max-width:768px){.main-content{padding:12px}.product-grid{grid-template-columns:1fr 1fr}.hero-banner{padding:24px;text-align:center;justify-content:center}.hero-banner h2{font-size:1.4rem}.control-buttons{top:6px;right:6px;gap:4px}.theme-toggle,.lang-toggle{padding:4px 8px;font-size:0.55rem}.cart-sidebar{width:280px}}
    @media(max-width:480px){.header .logo span{display:none}.header .logo{font-size:1.1rem}.header-actions i{font-size:0.9rem}.product-grid{grid-template-columns:1fr 1fr}.category-btn{font-size:0.7rem;padding:4px 12px}}
    body.ltr{direction:ltr;text-align:left}
  </style>
</head>
<body>
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>
  <div class="notification" id="notification"></div>
  <div class="overlay" id="overlay" onclick="closeCart()"></div>
  <header class="header">
    <div class="logo"><i class="fas fa-shopping-basket"></i> <span id="brandName">سوپرمارکت</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('home')" data-key="navHome">خانه</a>
      <a onclick="showTab('products')" data-key="navProducts">محصولات</a>
      <a onclick="showTab('offers')" data-key="navOffers">تخفیف‌ها</a>
    </div>
    <div class="header-search">
      <input type="text" id="searchInput" placeholder="جستجوی محصول ...">
      <button onclick="searchProducts()"><i class="fas fa-search"></i></button>
    </div>
    <div class="header-actions">
      <div class="cart-badge" data-count="0" onclick="toggleCart()"><i class="fas fa-shopping-cart"></i></div>

      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <div class="main-content">
    <div class="tab-content active" id="tab-home">
      <div class="hero-banner">
        <div><h2 data-key="heroTitle">🎉 تخفیف ویژه</h2><p data-key="heroDesc">تا ۵۰٪ تخفیف برای محصولات منتخب</p></div>
        <div class="off-badge">🔥 تا ۵۰٪</div>
      </div>
      <div class="category-bar" id="categoryBar">
        <button class="category-btn active" onclick="filterCategory('all')" data-key="allCat">همه</button>
        <button class="category-btn" onclick="filterCategory('لبنیات')">🥛 لبنیات</button>
        <button class="category-btn" onclick="filterCategory('نوشیدنی')">🥤 نوشیدنی</button>
        <button class="category-btn" onclick="filterCategory('خشکبار')">🥜 خشکبار</button>
        <button class="category-btn" onclick="filterCategory('کنسرو')">🥫 کنسرو</button>
        <button class="category-btn" onclick="filterCategory('شیرینی')">🍪 شیرینی</button>
        <button class="category-btn" onclick="filterCategory('صبحانه')">🍞 صبحانه</button>
        <button class="category-btn" onclick="filterCategory('نظافت')">🧹 نظافت</button>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>
    <div class="tab-content" id="tab-products"><div class="product-grid" id="allProductsGrid"></div></div>
    <div class="tab-content" id="tab-offers"><div class="product-grid" id="offersGrid"></div></div>
  </div>

  <div class="cart-sidebar" id="cartSidebar">
    <div class="header"><h3 data-key="cartTitle">🛒 سبد خرید</h3><span class="close-btn" onclick="closeCart()">&times;</span></div>
    <div id="cartItems"><div class="cart-empty"><i class="fas fa-shopping-cart"></i><p data-key="emptyCart">سبد خرید خالی است</p></div></div>
    <div class="cart-total" id="cartTotal" style="display:none">
      <div class="row"><span data-key="subtotal">جمع کل</span><span id="subtotalPrice">۰ تومان</span></div>
      <div class="row total"><span data-key="total">قابل پرداخت</span><span id="totalPrice">۰ تومان</span></div>
      <button class="checkout-btn" onclick="checkout()" data-key="checkoutBtn">پرداخت</button>
    </div>
  </div>

  <script>
    const dict={fa:{brandName:'سوپرمارکت',navHome:'خانه',navProducts:'محصولات',navOffers:'تخفیف‌ها',heroTitle:'🎉 تخفیف ویژه',heroDesc:'تا ۵۰٪ تخفیف برای محصولات منتخب',allCat:'همه',cartTitle:'سبد خرید',emptyCart:'سبد خرید خالی است',subtotal:'جمع کل',total:'قابل پرداخت',checkoutBtn:'پرداخت'},en:{brandName:'SuperMart',navHome:'Home',navProducts:'Products',navOffers:'Offers',heroTitle:'🎉 Special Offer',heroDesc:'Up to 50% off selected products',allCat:'All',cartTitle:'Shopping Cart',emptyCart:'Cart is empty',subtotal:'Subtotal',total:'Total',checkoutBtn:'Checkout'}};
    let currentLang='fa';const body=document.body,langBtn=document.getElementById('langToggleBtn'),langLabel=document.getElementById('langLabel');
    function setLanguage(lang){currentLang=lang;if(lang==='en'){body.classList.add('ltr');body.setAttribute('dir','ltr');document.documentElement.lang='en';langLabel.textContent='فارسی'}else{body.classList.remove('ltr');body.setAttribute('dir','rtl');document.documentElement.lang='fa';langLabel.textContent='English'}const d=dict[lang];document.querySelectorAll('[data-key]').forEach(el=>{const key=el.getAttribute('data-key');if(d[key]!==undefined)el.textContent=d[key]})}
    langBtn.addEventListener('click',function(){setLanguage(currentLang==='fa'?'en':'fa')});
    const themeToggleBtn=document.getElementById('themeToggleBtn'),themeLabel=document.getElementById('themeLabel');
    function toggleDarkMode(){body.classList.toggle('dark-mode');const isDark=body.classList.contains('dark-mode');themeLabel.textContent=isDark?'روشن':'دارک';themeToggleBtn.innerHTML=`<i class="fas ${isDark?'fa-sun':'fa-moon'}"></i> ${isDark?'روشن':'دارک'}`}
    themeToggleBtn.addEventListener('click',toggleDarkMode);
    const products=[
      {id:1,name:'شیر پاستوریزه کاله',category:'لبنیات',price:35000,weight:'۱ لیتر',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🥛+شیر',rating:4.5,discount:0},
      {id:2,name:'ماست میهن',category:'لبنیات',price:28000,weight:'۹۰۰ گرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🍶+ماست',rating:4.3,discount:10},
      {id:3,name:'پنیر سفید کاله',category:'لبنیات',price:45000,weight:'۴۰۰ گرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🧀+پنیر',rating:4.7,discount:0},
      {id:4,name:'کره پاستوریزه',category:'لبنیات',price:62000,weight:'۲۰۰ گرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🧈+کره',rating:4.6,discount:15},
      {id:5,name:'نوشابه کوکا کولا',category:'نوشیدنی',price:18000,weight:'۱.۵ لیتر',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🥤+کوکا',rating:4.4,discount:0},
      {id:6,name:'آب معدنی دماوند',category:'نوشیدنی',price:8000,weight:'۱.۵ لیتر',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=💧+آب',rating:4.2,discount:5},
      {id:7,name:'آب پرتقال سان استار',category:'نوشیدنی',price:25000,weight:'۱ لیتر',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🍊+آب+پرتقال',rating:4.6,discount:0},
      {id:8,name:'پسته مرغوب',category:'خشکبار',price:380000,weight:'۱ کیلوگرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🥜+پسته',rating:4.9,discount:10},

      {id:10,name:'بادام درختی',category:'خشکبار',price:350000,weight:'۱ کیلوگرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🥜+بادام',rating:4.7,discount:15},
      {id:11,name:'کنسرو لوبیا',category:'کنسرو',price:22000,weight:'۴۰۰ گرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🥫+لوبیا',rating:4.1,discount:0},

      {id:15,name:'نان تست بربری',category:'صبحانه',price:12000,weight:'۴۰۰ گرم',image:'https://via.placeholder.com/200x200/ffffff/e74c3c?text=🍞+نان',rating:4.2,discount:0},

    ];
    let cart=[],currentCategory='all',currentSearch='';
    function renderProducts(filtered){const grid=document.getElementById('productGrid');const data=filtered||products;grid.innerHTML=data.map(p=>{const inCart=cart.some(c=>c.id===p.id);const discountPrice=p.discount>0?Math.round(p.price*(1-p.discount/100)):p.price;return`<div class="product-card"><div class="image"><img src="${p.image}" alt="${p.name}">${p.discount>0?`<span class="discount-badge">-${p.discount}%</span>`:''}</div><div class="content"><div class="name">${p.name}</div><div class="weight">${p.weight}</div><div class="price">${discountPrice.toLocaleString()} تومان${p.discount>0?`<span class="old">${p.price.toLocaleString()}</span>`:''}</div><div class="rating">${'⭐'.repeat(Math.floor(p.rating))} ${p.rating}</div><div class="actions"><button class="add-btn ${inCart?'in-cart':''}" onclick="toggleCartItem(${p.id})">${inCart?'✓ در سبد':'افزودن به سبد'}</button><button class="fav-btn" onclick="showNotification('❤️ اضافه شد')"><i class="fas fa-heart"></i></button></div></div></div>`}).join('')}
    function renderAllProducts(){const grid=document.getElementById('allProductsGrid');grid.innerHTML=products.map(p=>{const discountPrice=p.discount>0?Math.round(p.price*(1-p.discount/100)):p.price;return`<div class="product-card"><div class="image"><img src="${p.image}" alt="${p.name}">${p.discount>0?`<span class="discount-badge">-${p.discount}%</span>`:''}</div><div class="content"><div class="name">${p.name}</div><div class="weight">${p.weight}</div><div class="price">${discountPrice.toLocaleString()} تومان</div><div class="rating">${'⭐'.repeat(Math.floor(p.rating))} ${p.rating}</div><div class="actions"><button class="add-btn" onclick="toggleCartItem(${p.id})">افزودن به سبد</button><button class="fav-btn" onclick="showNotification('❤️ اضافه شد')"><i class="fas fa-heart"></i></button></div></div></div>`}).join('')}
    function renderOffers(){const grid=document.getElementById('offersGrid');const offers=products.filter(p=>p.discount>0);grid.innerHTML=offers.map(p=>{const discountPrice=Math.round(p.price*(1-p.discount/100));return`<div class="product-card"><div class="image"><img src="${p.image}" alt="${p.name}"><span class="discount-badge">-${p.discount}%</span></div><div class="content"><div class="name">${p.name}</div><div class="weight">${p.weight}</div><div class="price">${discountPrice.toLocaleString()} تومان<span class="old">${p.price.toLocaleString()}</span></div><div class="rating">${'⭐'.repeat(Math.floor(p.rating))} ${p.rating}</div><div class="actions"><button class="add-btn" onclick="toggleCartItem(${p.id})">افزودن به سبد</button><button class="fav-btn" onclick="showNotification('❤️ اضافه شد')"><i class="fas fa-heart"></i></button></div></div></div>`}).join('')}
    function filterCategory(category){currentCategory=category;document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.category-btn').forEach(b=>{if(b.textContent.trim()===category||(category==='all'&&b.textContent.trim()==='همه'))b.classList.add('active')});applyFilters()}
    function searchProducts(){currentSearch=document.getElementById('searchInput').value.trim().toLowerCase();applyFilters()}
    function applyFilters(){let filtered=products;if(currentCategory!=='all')filtered=filtered.filter(p=>p.category===currentCategory);if(currentSearch)filtered=filtered.filter(p=>p.name.toLowerCase().includes(currentSearch)||p.category.includes(currentSearch));renderProducts(filtered)}
    function toggleCartItem(id){const idx=cart.findIndex(c=>c.id===id);if(idx>-1){cart.splice(idx,1);showNotification('❌ از سبد خرید حذف شد')}else{const p=products.find(pro=>pro.id===id);if(p){const discountPrice=p.discount>0?Math.round(p.price*(1-p.discount/100)):p.price;cart.push({...p,price:discountPrice});showNotification(`✅ ${p.name} به سبد خرید اضافه شد`)}}updateCart();renderProducts(products.filter(p=>{let f=true;if(currentCategory!=='all')f=f&&p.category===currentCategory;if(currentSearch)f=f&&(p.name.toLowerCase().includes(currentSearch)||p.category.includes(currentSearch));return f}))}
    function updateCart(){const badge=document.querySelector('.cart-badge');badge.setAttribute('data-count',cart.length);const container=document.getElementById('cartItems');const totalDiv=document.getElementById('cartTotal');if(cart.length===0){container.innerHTML=`<div class="cart-empty"><i class="fas fa-shopping-cart"></i><p data-key="emptyCart">سبد خرید خالی است</p></div>`;totalDiv.style.display='none';return}container.innerHTML=cart.map(item=>`<div class="cart-item"><div class="image"><img src="${item.image}" alt="${item.name}"></div><div class="info"><div class="name">${item.name}</div><div class="price">${item.price.toLocaleString()} تومان</div></div><div class="qty"><button onclick="changeQty(${item.id},-1)">-</button><span>${item.qty||1}</span><button onclick="changeQty(${item.id},1)">+</button></div><span class="remove-btn" onclick="removeFromCart(${item.id})"><i class="fas fa-times"></i></span></div>`).join('');totalDiv.style.display='block';const total=cart.reduce((sum,i)=>sum+i.price*(i.qty||1),0);document.getElementById('subtotalPrice').textContent=total.toLocaleString()+' تومان';document.getElementById('totalPrice').textContent=total.toLocaleString()+' تومان'}
    function changeQty(id,delta){const item=cart.find(c=>c.id===id);if(item){item.qty=(item.qty||1)+delta;if(item.qty<1)item.qty=1;updateCart()}}
    function removeFromCart(id){cart=cart.filter(c=>c.id!==id);updateCart();showNotification('❌ حذف شد')}
    function toggleCart(){document.getElementById('cartSidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
    function closeCart(){document.getElementById('cartSidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
    function checkout(){if(cart.length===0){showNotification('❌ سبد خرید خالی است!');return}showNotification('✅ سفارش شما با موفقیت ثبت شد!');cart=[];updateCart();closeCart()}
    function showTab(tabName){document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));const target=document.getElementById('tab-'+tabName);if(target)target.classList.add('active');document.querySelectorAll('.nav-links a').forEach(el=>el.classList.remove('active'));const map={home:0,products:1,offers:2};const links=document.querySelectorAll('.nav-links a');if(map[tabName]!==undefined)links[map[tabName]]?.classList.add('active');if(tabName==='home')applyFilters();if(tabName==='products')renderAllProducts();if(tabName==='offers')renderOffers();window.scrollTo({top:0,behavior:'smooth'})}
    let notifTimeout;function showNotification(message){const notif=document.getElementById('notification');notif.textContent=message;notif.classList.add('show');clearTimeout(notifTimeout);notifTimeout=setTimeout(()=>notif.classList.remove('show'),2500)}
    document.getElementById('searchInput').addEventListener('keyup',function(e){if(e.key==='Enter')searchProducts()});
    setLanguage('fa');renderProducts();renderAllProducts();renderOffers();updateCart();
    console.log('✅ سوپرمارکت آنلاین با محصولات واقعی بارگذاری شد!');
  </script>
</body>
</html>
