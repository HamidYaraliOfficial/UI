<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سرویس اشتراک ویدیو | یوتیوب کلون</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-card: #272727;
      --bg-hover: #3a3a3a;
      --text-primary: #ffffff;
      --text-secondary: #aaaaaa;
      --text-muted: #606060;
      --accent: #ff0000;
      --accent-hover: #cc0000;
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.light-mode {
      --bg-primary: #f9f9f9;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #f0f0f0;
      --text-primary: #0f0f0f;
      --text-secondary: #606060;
      --text-muted: #909090;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--text-muted);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); padding:8px 20px;
      display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; height:56px;
      border-bottom:1px solid var(--text-muted);
    }
    .header .logo {
      display:flex; align-items:center; gap:8px; font-size:1.3rem; font-weight:700;
      color:var(--accent); cursor:pointer;
    }
    .header .logo i { font-size:1.8rem; }
    .header-search {
      display:flex; align-items:center; background:var(--bg-primary);
      border-radius:40px; overflow:hidden; border:1px solid var(--text-muted);
      transition:var(--transition); max-width:500px; flex:1; margin:0 16px;
    }
    .header-search:focus-within { border-color:var(--accent); }
    .header-search input {
      flex:1; padding:8px 16px; border:none; background:transparent;
      color:var(--text-primary); font-size:0.9rem; outline:none;
    }
    .header-search input::placeholder { color:var(--text-muted); }
    .header-search button {
      padding:8px 20px; background:var(--bg-hover); border:none;
      color:var(--text-secondary); cursor:pointer; transition:var(--transition);
    }
    .header-search button:hover { background:var(--accent); color:#fff; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--text-primary); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      display:grid; grid-template-columns:200px 1fr 300px;
      gap:0; max-width:1400px; margin:0 auto;
    }

    /* ===== سایدبار ===== */
    .sidebar {
      padding:12px 8px; border-left:1px solid var(--text-muted);
      height:fit-content; position:sticky; top:70px;
    }
    body.ltr .sidebar { border-left:none; border-right:1px solid var(--text-muted); }
    .sidebar-item {
      display:flex; align-items:center; gap:12px; padding:8px 12px;
      border-radius:8px; cursor:pointer; transition:var(--transition);
      color:var(--text-secondary); font-size:0.85rem;
    }
    .sidebar-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .sidebar-item.active { background:var(--bg-hover); color:var(--text-primary); font-weight:600; }
    .sidebar-item i { width:20px; font-size:1rem; }
    .sidebar-divider { height:1px; background:var(--text-muted); margin:8px 8px; }
    .sidebar-label { font-size:0.6rem; color:var(--text-muted); padding:8px 12px 4px; font-weight:700; text-transform:uppercase; }

    /* ===== بخش اصلی ===== */
    .feed-section { border-left:1px solid var(--text-muted); border-right:1px solid var(--text-muted); }
    body.ltr .feed-section { border-left:1px solid var(--text-muted); border-right:1px solid var(--text-muted); }

    .tab-content { display:none; animation:fadeIn 0.3s ease; padding:16px; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های ویدیو ===== */
    .video-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:16px;
    }
    .video-card {
      cursor:pointer; transition:var(--transition);
    }
    .video-card:hover { transform:scale(1.02); }
    .video-card .thumbnail {
      width:100%; aspect-ratio:16/9; border-radius:var(--radius);
      background:linear-gradient(135deg, var(--accent), var(--text-muted));
      display:flex; align-items:center; justify-content:center;
      font-size:2rem; color:var(--text-primary); position:relative;
    }
    .video-card .thumbnail .duration {
      position:absolute; bottom:8px; right:8px;
      background:rgba(0,0,0,0.8); padding:2px 8px; border-radius:4px;
      font-size:0.7rem; color:#fff;
    }
    body.ltr .video-card .thumbnail .duration { right:auto; left:8px; }
    .video-card .info { padding:8px 4px; display:flex; gap:10px; }
    .video-card .info .avatar {
      width:36px; height:36px; border-radius:50%; flex-shrink:0;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.7rem;
    }
    .video-card .info .details { flex:1; }
    .video-card .info .details .title {
      font-weight:600; font-size:0.95rem; display:-webkit-box;
      -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .video-card .info .details .channel { font-size:0.8rem; color:var(--text-secondary); }
    .video-card .info .details .meta { font-size:0.75rem; color:var(--text-muted); }

    /* ===== پخش‌کننده ===== */
    .player-container {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; margin-bottom:16px;
    }
    .player-container .video-player {
      width:100%; aspect-ratio:16/9; background:#000;
      display:flex; align-items:center; justify-content:center;
      font-size:4rem; color:var(--text-muted); position:relative;
    }
    .player-container .video-player .play-overlay {
      position:absolute; font-size:5rem; color:#fff; opacity:0.5;
      cursor:pointer; transition:var(--transition);
    }
    .player-container .video-player .play-overlay:hover { opacity:1; transform:scale(1.1); }

    /* ===== کنترل‌های پلیر ===== */
    .player-controls {
      padding:12px 16px; background:var(--bg-secondary);
      border-top:1px solid var(--text-muted);
    }
    .player-controls .top-controls {
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:8px;
    }
    .player-controls .top-controls .title { font-weight:600; font-size:1.1rem; }
    .player-controls .top-controls .actions { display:flex; gap:12px; }
    .player-controls .top-controls .actions i {
      cursor:pointer; font-size:1.1rem; color:var(--text-secondary);
      transition:var(--transition);
    }
    .player-controls .top-controls .actions i:hover { color:var(--text-primary); transform:scale(1.1); }
    .player-controls .top-controls .actions .liked { color:var(--accent); }
    .player-controls .progress-bar {
      display:flex; align-items:center; gap:12px; margin-top:8px;
    }
    .player-controls .progress-bar .bar {
      flex:1; height:4px; background:var(--text-muted); border-radius:4px;
      position:relative; cursor:pointer;
    }
    .player-controls .progress-bar .bar .fill {
      width:30%; height:100%; background:var(--accent); border-radius:4px;
      position:relative;
    }
    .player-controls .progress-bar .bar .fill::after {
      content:''; position:absolute; right:-4px; top:-4px;
      width:12px; height:12px; border-radius:50%; background:var(--text-primary);
      opacity:0; transition:var(--transition);
    }
    .player-controls .progress-bar .bar:hover .fill::after { opacity:1; }
    .player-controls .progress-bar .time { font-size:0.75rem; color:var(--text-secondary); min-width:80px; }

    /* ===== کامنت‌ها ===== */
    .comments-section { margin-top:16px; }
    .comments-section .comment-input {
      display:flex; gap:10px; margin-bottom:12px;
    }
    .comments-section .comment-input input {
      flex:1; padding:8px 14px; border-radius:40px;
      border:1px solid var(--text-muted); background:var(--bg-primary);
      color:var(--text-primary); font-size:0.9rem; outline:none;
    }
    .comments-section .comment-input input:focus { border-color:var(--accent); }
    .comments-section .comment-input button {
      padding:8px 20px; background:var(--accent); color:#fff;
      border:none; border-radius:40px; font-weight:600; cursor:pointer;
      transition:var(--transition);
    }
    .comments-section .comment-input button:hover { background:var(--accent-hover); }
    .comment-item {
      padding:10px 0; border-bottom:1px solid var(--text-muted);
      display:flex; gap:10px;
    }
    .comment-item:last-child { border-bottom:none; }
    .comment-item .avatar {
      width:36px; height:36px; border-radius:50%; flex-shrink:0;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.7rem;
    }
    .comment-item .body { flex:1; }
    .comment-item .body .user { font-weight:600; font-size:0.85rem; }
    .comment-item .body .text { font-size:0.9rem; margin:2px 0; }
    .comment-item .body .time { font-size:0.7rem; color:var(--text-muted); }
    .comment-item .body .reply-btn {
      font-size:0.75rem; color:var(--text-secondary); cursor:pointer;
      transition:var(--transition);
    }
    .comment-item .body .reply-btn:hover { color:var(--accent); }
    .comment-item .replies { padding-right:20px; margin-top:8px; }
    body.ltr .comment-item .replies { padding-right:0; padding-left:20px; }

    /* ===== کانال ===== */
    .channel-header {
      display:flex; gap:20px; align-items:center; flex-wrap:wrap;
      padding:16px; background:var(--bg-card); border-radius:var(--radius);
      margin-bottom:16px;
    }
    .channel-header .avatar {
      width:80px; height:80px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2rem; font-weight:700;
    }
    .channel-header .info { flex:1; }
    .channel-header .info .name { font-size:1.4rem; font-weight:700; }
    .channel-header .info .subs { font-size:0.85rem; color:var(--text-secondary); }
    .channel-header .info .desc { font-size:0.9rem; margin:4px 0; }
    .channel-header .subscribe-btn {
      padding:8px 24px; background:var(--accent); color:#fff;
      border:none; border-radius:40px; font-weight:600; cursor:pointer;
      transition:var(--transition);
    }
    .channel-header .subscribe-btn:hover { background:var(--accent-hover); }
    .channel-header .subscribe-btn.subscribed { background:var(--text-muted); }

    /* ===== لیست پخش ===== */
    .playlist-item {
      display:flex; align-items:center; gap:12px; padding:8px 12px;
      border-radius:8px; cursor:pointer; transition:var(--transition);
    }
    .playlist-item:hover { background:var(--bg-hover); }
    .playlist-item .thumb {
      width:80px; height:45px; border-radius:6px;
      background:linear-gradient(135deg, var(--accent), var(--text-muted));
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
      flex-shrink:0;
    }
    .playlist-item .info { flex:1; }
    .playlist-item .info .title { font-weight:600; font-size:0.9rem; }
    .playlist-item .info .count { font-size:0.75rem; color:var(--text-muted); }

    /* ===== پنل راست ===== */
    .right-panel { padding:12px; }
    .right-panel .section-title { font-size:0.9rem; font-weight:600; margin-bottom:8px; }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--bg-card); color:var(--text-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:var(--shadow);
      border:1px solid var(--text-muted);
    }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:1200px) {
      .right-panel { display:none; }
      .main-content { grid-template-columns:200px 1fr; }
    }
    @media (max-width:992px) {
      .main-content { grid-template-columns:1fr; }
      .sidebar { display:none; }
      .header { flex-wrap:wrap; gap:8px; padding:6px 12px; height:auto; }
      .header-search { max-width:100%; margin:0; order:3; flex-basis:100%; }
      .header .logo { font-size:1.1rem; }
      .header-actions { gap:8px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .video-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header-actions i { font-size:0.9rem; }
      .video-grid { grid-template-columns:1fr; }
      .player-controls .top-controls { flex-direction:column; align-items:flex-start; }
      .channel-header { flex-direction:column; text-align:center; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-sun"></i> <span id="themeLabel">روشن</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fab fa-youtube"></i> <span id="brandName">ویدیو</span></div>
    <div class="header-search">
      <input type="text" id="searchInput" placeholder="جستجو ...">
      <button onclick="searchVideos()"><i class="fas fa-search"></i></button>
    </div>
    <div class="header-actions">
      <i class="fas fa-upload" onclick="showUploadModal()"></i>
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <i class="fas fa-user" onclick="showTab('channel')"></i>
      <div class="header-avatar" onclick="showTab('channel')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== سایدبار ===== -->
    <nav class="sidebar">
      <div class="sidebar-item active" onclick="showTab('home')"><i class="fas fa-home"></i> <span data-key="menuHome">خانه</span></div>
      <div class="sidebar-item" onclick="showTab('trending')"><i class="fas fa-fire"></i> <span data-key="menuTrending">داغ‌ها</span></div>
      <div class="sidebar-item" onclick="showTab('subscriptions')"><i class="fas fa-bell"></i> <span data-key="menuSubs">اشتراک‌ها</span></div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-label" data-key="labelLibrary">کتابخانه</div>
      <div class="sidebar-item" onclick="showTab('library')"><i class="fas fa-clock"></i> <span data-key="menuHistory">تاریخچه</span></div>
      <div class="sidebar-item" onclick="showTab('playlists')"><i class="fas fa-list"></i> <span data-key="menuPlaylists">لیست پخش</span></div>
      <div class="sidebar-item" onclick="showTab('channel')"><i class="fas fa-user"></i> <span data-key="menuChannel">کانال من</span></div>
    </nav>

    <!-- ===== بخش اصلی ===== -->
    <div class="feed-section">

      <!-- ===== تب خانه ===== -->
      <div class="tab-content active" id="tab-home">
        <div class="video-grid" id="videoGrid">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

      <!-- ===== تب داغ‌ها ===== -->
      <div class="tab-content" id="tab-trending">
        <h2 style="margin-bottom:12px;"><i class="fas fa-fire" style="color:var(--accent);"></i> <span data-key="trendingTitle">ویدیوهای داغ</span></h2>
        <div class="video-grid" id="trendingGrid">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

      <!-- ===== تب اشتراک‌ها ===== -->
      <div class="tab-content" id="tab-subscriptions">
        <h2 style="margin-bottom:12px;"><i class="fas fa-bell" style="color:var(--accent);"></i> <span data-key="subsTitle">اشتراک‌ها</span></h2>
        <div class="video-grid" id="subscriptionsGrid">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

      <!-- ===== تب کتابخانه ===== -->
      <div class="tab-content" id="tab-library">
        <h2 style="margin-bottom:12px;"><i class="fas fa-clock" style="color:var(--accent);"></i> <span data-key="historyTitle">تاریخچه تماشا</span></h2>
        <div id="historyContainer">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

      <!-- ===== تب لیست پخش ===== -->
      <div class="tab-content" id="tab-playlists">
        <h2 style="margin-bottom:12px;"><i class="fas fa-list" style="color:var(--accent);"></i> <span data-key="playlistsTitle">لیست‌های پخش من</span></h2>
        <div id="playlistsContainer">
          <!-- توسط JS ساخته می‌شود -->
        </div>
        <button onclick="createPlaylist()" style="margin-top:12px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:40px;font-weight:600;cursor:pointer;">+ لیست جدید</button>
      </div>

      <!-- ===== تب کانال ===== -->
      <div class="tab-content" id="tab-channel">
        <div class="channel-header">
          <div class="avatar">ع</div>
          <div class="info">
            <div class="name">کانال علی رضایی</div>
            <div class="subs">۱۲۴K دنبال‌کننده · ۴۵ ویدیو</div>
            <div class="desc">عاشق تکنولوژی و برنامه‌نویسی 🚀</div>
          </div>
          <button class="subscribe-btn subscribed" onclick="toggleSubscribe(this)">اشتراک</button>
        </div>
        <div class="video-grid" id="channelVideos">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

      <!-- ===== تب ویدیو (پخش) ===== -->
      <div class="tab-content" id="tab-video">
        <div id="videoPlayerContainer">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>

    </div>

    <!-- ===== پنل راست ===== -->
    <div class="right-panel">
      <div class="section-title" data-key="recommended">پیشنهاد برای شما</div>
      <div id="recommendedVideos">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

  </div>

  <!-- ===== مودال آپلود ===== -->
  <div class="modal-overlay" id="uploadModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9998;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;">
      <h3 style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;">
        <span data-key="uploadTitle">آپلود ویدیو</span>
        <span onclick="closeUploadModal()" style="cursor:pointer;font-size:1.2rem;color:var(--text-muted);">&times;</span>
      </h3>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="display:block;font-size:0.85rem;font-weight:500;margin-bottom:4px;" data-key="lblTitle">عنوان ویدیو</label>
        <input type="text" id="uploadTitle" placeholder="عنوان ..." style="width:100%;padding:8px 12px;border:1px solid var(--text-muted);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="display:block;font-size:0.85rem;font-weight:500;margin-bottom:4px;" data-key="lblPrivacy">حریم خصوصی</label>
        <select id="uploadPrivacy" style="width:100%;padding:8px 12px;border:1px solid var(--text-muted);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
          <option value="عمومی">عمومی</option>
          <option value="خصوصی">خصوصی</option>
          <option value="لینک">لینک خصوصی</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:12px;">
        <label style="display:block;font-size:0.85rem;font-weight:500;margin-bottom:4px;" data-key="lblCategory">دسته‌بندی</label>
        <select id="uploadCategory" style="width:100%;padding:8px 12px;border:1px solid var(--text-muted);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
          <option value="آموزشی">آموزشی</option>
          <option value="سرگرمی">سرگرمی</option>
          <option value="تکنولوژی">تکنولوژی</option>
          <option value="ورزش">ورزش</option>
          <option value="موسیقی">موسیقی</option>
        </select>
      </div>
      <button onclick="uploadVideo()" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="uploadBtn">آپلود</button>
    </div>
  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'ویدیو',
        menuHome: 'خانه',
        menuTrending: 'داغ‌ها',
        menuSubs: 'اشتراک‌ها',
        menuHistory: 'تاریخچه',
        menuPlaylists: 'لیست پخش',
        menuChannel: 'کانال من',
        labelLibrary: 'کتابخانه',
        trendingTitle: 'ویدیوهای داغ',
        subsTitle: 'اشتراک‌ها',
        historyTitle: 'تاریخچه تماشا',
        playlistsTitle: 'لیست‌های پخش من',
        recommended: 'پیشنهاد برای شما',
        uploadTitle: 'آپلود ویدیو',
        lblTitle: 'عنوان ویدیو',
        lblPrivacy: 'حریم خصوصی',
        lblCategory: 'دسته‌بندی',
        uploadBtn: 'آپلود',
        views: 'بازدید',
        likes: 'لایک',
        comments: 'کامنت',
        subscribe: 'اشتراک',
        subscribed: 'اشتراک شده'
      },
      en: {
        brandName: 'Video',
        menuHome: 'Home',
        menuTrending: 'Trending',
        menuSubs: 'Subscriptions',
        menuHistory: 'History',
        menuPlaylists: 'Playlists',
        menuChannel: 'My Channel',
        labelLibrary: 'Library',
        trendingTitle: 'Trending Videos',
        subsTitle: 'Subscriptions',
        historyTitle: 'Watch History',
        playlistsTitle: 'My Playlists',
        recommended: 'Recommended for You',
        uploadTitle: 'Upload Video',
        lblTitle: 'Video Title',
        lblPrivacy: 'Privacy',
        lblCategory: 'Category',
        uploadBtn: 'Upload',
        views: 'views',
        likes: 'likes',
        comments: 'comments',
        subscribe: 'Subscribe',
        subscribed: 'Subscribed'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک/روشن =====
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleTheme() {
      body.classList.toggle('light-mode');
      const isLight = body.classList.contains('light-mode');
      themeLabel.textContent = isLight ? 'دارک' : 'روشن';
      themeToggleBtn.innerHTML = `<i class="fas ${isLight ? 'fa-moon' : 'fa-sun'}"></i> ${isLight ? 'دارک' : 'روشن'}`;
    }
    themeToggleBtn.addEventListener('click', toggleTheme);

    // ===== داده‌ها =====
    let videos = [
      { id: 1, title: 'آموزش React.js - قسمت ۱', channel: 'کانال علی', channelAvatar: 'ع', views: '۱۲۴K', likes: 1240, comments: 45, duration: '۱۲:۳۴', category: 'آموزشی', date: '۲ روز پیش', liked: false, disliked: false },
      { id: 2, title: 'بررسی گوشی جدید سامسونگ', channel: 'تکنولوژی روز', channelAvatar: 'ت', views: '۸۹K', likes: 890, comments: 32, duration: '۸:۲۰', category: 'تکنولوژی', date: '۴ روز پیش', liked: false, disliked: false },
      { id: 3, title: 'آموزش طراحی UI/UX', channel: 'طراحی دیجیتال', channelAvatar: 'ط', views: '۵۶K', likes: 560, comments: 28, duration: '۱۵:۴۵', category: 'آموزشی', date: '۱ هفته پیش', liked: false, disliked: false },
      { id: 4, title: 'مسابقه فوتبال دوستانه', channel: 'ورزشی', channelAvatar: 'و', views: '۲۱۰K', likes: 2100, comments: 78, duration: '۴۵:۰۰', category: 'ورزش', date: '۳ روز پیش', liked: false, disliked: false }
    ];

    let comments = [
      { id: 1, user: 'سارا محمدی', text: 'ویدیو عالی بود! ممنون از زحماتتون 🙏', time: '۲ ساعت پیش', replies: [
        { user: 'علی رضایی', text: 'خوشحالم که خوشتون اومده 😊', time: '۱ ساعت پیش' }
      ]},
      { id: 2, user: 'مهدی کریمی', text: 'خیلی مفید بود، منتظر قسمت‌های بعدی هستم', time: '۵ ساعت پیش', replies: [] }
    ];

    let playlists = [
      { id: 1, name: 'آموزش React', count: 3, videos: [1, 3] },
      { id: 2, name: 'تکنولوژی', count: 2, videos: [2] }
    ];

    let history = [2, 1, 4];
    let subscriptions = [1, 3];
    let currentVideo = null;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      const map = { home: 0, trending: 1, subscriptions: 2, library: 3, playlists: 4, channel: 5 };
      const items = document.querySelectorAll('.sidebar-item');
      if (map[tabName] !== undefined) items[map[tabName]]?.classList.add('active');

      if (tabName === 'home') renderVideos('videoGrid', videos);
      if (tabName === 'trending') renderVideos('trendingGrid', videos.slice().sort((a, b) => parseInt(b.likes) - parseInt(a.likes)));
      if (tabName === 'subscriptions') renderVideos('subscriptionsGrid', videos.filter(v => subscriptions.includes(v.id)));
      if (tabName === 'library') renderHistory();
      if (tabName === 'playlists') renderPlaylists();
      if (tabName === 'channel') renderVideos('channelVideos', videos.filter(v => v.channel === 'کانال علی'));

      if (window.innerWidth <= 992) {
        document.querySelector('.sidebar').style.display = 'none';
      }
    }

    // ===== رندر ویدیوها =====
    function renderVideos(containerId, videoList) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = videoList.map(v => `
        <div class="video-card" onclick="playVideo(${v.id})">
          <div class="thumbnail">
            <i class="fas fa-play"></i>
            <span class="duration">${v.duration}</span>
          </div>
          <div class="info">
            <div class="avatar">${v.channelAvatar}</div>
            <div class="details">
              <div class="title">${v.title}</div>
              <div class="channel">${v.channel}</div>
              <div class="meta">${v.views} بازدید · ${v.date}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== پخش ویدیو =====
    function playVideo(videoId) {
      const video = videos.find(v => v.id === videoId);
      if (!video) return;
      currentVideo = video;

      // افزودن به تاریخچه
      if (!history.includes(videoId)) history.push(videoId);
      else history = history.filter(id => id !== videoId);
      history.unshift(videoId);

      showTab('video');
      const container = document.getElementById('videoPlayerContainer');

      const isLiked = video.liked ? 'liked' : '';
      const isDisliked = video.disliked ? 'disliked' : '';

      container.innerHTML = `
        <div class="player-container">
          <div class="video-player">
            <i class="fas fa-play-circle play-overlay" onclick="togglePlay(this)"></i>
            <div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:0.9rem;">▶️ کلیک برای پخش</div>
          </div>
          <div class="player-controls">
            <div class="top-controls">
              <div class="title">${video.title}</div>
              <div class="actions">
                <i class="fas fa-thumbs-up ${isLiked}" onclick="likeVideo(${video.id})" title="لایک"></i>
                <span style="font-size:0.8rem;color:var(--text-secondary);">${video.likes}</span>
                <i class="fas fa-thumbs-down ${isDisliked}" onclick="dislikeVideo(${video.id})" title="دیسلایک"></i>
                <i class="fas fa-share-alt" onclick="shareVideo('${video.title}')" title="اشتراک‌گذاری"></i>
                <i class="fas fa-plus" onclick="addToPlaylist(${video.id})" title="افزودن به لیست پخش"></i>
                <i class="fas fa-download" onclick="showNotification('دانلود 📥')" title="دانلود"></i>
              </div>
            </div>
            <div class="progress-bar">
              <span class="time">0:00</span>
              <div class="bar" onclick="seekProgress(event)">
                <div class="fill" style="width:0%;"></div>
              </div>
              <span class="time">${video.duration}</span>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:12px;color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px;">
          <span><i class="fas fa-eye"></i> ${video.views} بازدید</span>
          <span><i class="fas fa-thumbs-up"></i> ${video.likes} لایک</span>
          <span><i class="fas fa-comment"></i> ${video.comments} کامنت</span>
        </div>

        <div class="comments-section">
          <h4 style="margin-bottom:8px;">💬 کامنت‌ها (${comments.length})</h4>
          <div class="comment-input">
            <input type="text" id="commentInput" placeholder="نظر خود را بنویسید ...">
            <button onclick="addComment()">ارسال</button>
          </div>
          <div id="commentsContainer">
            ${comments.map(c => `
              <div class="comment-item">
                <div class="avatar">${c.user[0]}</div>
                <div class="body">
                  <div class="user">${c.user}</div>
                  <div class="text">${c.text}</div>
                  <div class="time">${c.time}</div>
                  <div class="reply-btn" onclick="replyToComment(${c.id})">پاسخ</div>
                  ${c.replies.length > 0 ? `
                    <div class="replies">
                      ${c.replies.map(r => `
                        <div class="comment-item" style="border:none;padding:4px 0;">
                          <div class="avatar" style="width:28px;height:28px;font-size:0.6rem;">${r.user[0]}</div>
                          <div class="body">
                            <div class="user">${r.user}</div>
                            <div class="text">${r.text}</div>
                            <div class="time">${r.time}</div>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // نمایش پیشنهادات در پنل راست
      renderRecommended();
      showNotification('در حال پخش: ' + video.title);
    }

    // ===== کنترل‌های پلیر =====
    let isPlaying = false;
    let progressInterval = null;

    function togglePlay(el) {
      isPlaying = !isPlaying;
      el.style.color = isPlaying ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.3)';
      el.className = isPlaying ? 'fas fa-pause-circle play-overlay' : 'fas fa-play-circle play-overlay';
      if (isPlaying) {
        const fill = document.querySelector('.player-controls .fill');
        let progress = 0;
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
          progress += 0.5;
          if (progress > 100) {
            progress = 0;
            clearInterval(progressInterval);
            isPlaying = false;
            if (el) {
              el.className = 'fas fa-play-circle play-overlay';
              el.style.color = 'rgba(255,255,255,0.3)';
            }
            return;
          }
          if (fill) fill.style.width = progress + '%';
          const timeEl = document.querySelector('.player-controls .progress-bar .time:first-child');
          if (timeEl) {
            const total = document.querySelector('.player-controls .progress-bar .time:last-child')?.textContent || '0:00';
            const parts = total.split(':');
            const totalSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
            const current = Math.floor((progress / 100) * totalSec);
            const mins = Math.floor(current / 60);
            const secs = current % 60;
            timeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
          }
        }, 100);
      } else {
        if (progressInterval) clearInterval(progressInterval);
      }
      showNotification(isPlaying ? 'پخش ▶️' : 'مکث ⏸️');
    }

    function seekProgress(e) {
      const bar = e.currentTarget;
      const rect = bar.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const progress = Math.max(0, Math.min(1, x));
      document.querySelector('.player-controls .fill').style.width = (progress * 100) + '%';
      const total = document.querySelector('.player-controls .progress-bar .time:last-child')?.textContent || '0:00';
      const parts = total.split(':');
      const totalSec = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      const current = Math.floor(progress * totalSec);
      const mins = Math.floor(current / 60);
      const secs = current % 60;
      const timeEl = document.querySelector('.player-controls .progress-bar .time:first-child');
      if (timeEl) timeEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // ===== لایک/دیسلایک =====
    function likeVideo(videoId) {
      const video = videos.find(v => v.id === videoId);
      if (!video) return;
      if (video.liked) {
        video.liked = false;
        video.likes--;
      } else {
        if (video.disliked) {
          video.disliked = false;
          video.likes++;
        } else {
          video.likes++;
        }
        video.liked = true;
      }
      playVideo(videoId);
      showNotification(video.liked ? 'لایک شد ❤️' : 'لایک برداشته شد');
    }

    function dislikeVideo(videoId) {
      const video = videos.find(v => v.id === videoId);
      if (!video) return;
      if (video.disliked) {
        video.disliked = false;
      } else {
        if (video.liked) {
          video.liked = false;
          video.likes--;
        }
        video.disliked = true;
      }
      playVideo(videoId);
      showNotification(video.disliked ? 'دیسلایک شد 👎' : 'دیسلایک برداشته شد');
    }

    // ===== اشتراک‌گذاری =====
    function shareVideo(title) {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: title,
          text: `ویدیو "${title}" را ببینید!`,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url).then(() => {
          showNotification('لینک ویدیو کپی شد 📋');
        }).catch(() => {
          showNotification('اشتراک‌گذاری: ' + url);
        });
      }
    }

    // ===== کامنت‌ها =====
    function addComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text) { showNotification('لطفاً متن کامنت را وارد کنید!'); return; }
      comments.push({
        id: comments.length + 1,
        user: 'شما',
        text: text,
        time: 'همین الان',
        replies: []
      });
      input.value = '';
      if (currentVideo) playVideo(currentVideo.id);
      showNotification('کامنت ارسال شد 💬');
    }

    function replyToComment(commentId) {
      const reply = prompt('پاسخ خود را وارد کنید:');
      if (!reply || !reply.trim()) return;
      const comment = comments.find(c => c.id === commentId);
      if (comment) {
        comment.replies.push({
          user: 'شما',
          text: reply.trim(),
          time: 'همین الان'
        });
        if (currentVideo) playVideo(currentVideo.id);
        showNotification('پاسخ ارسال شد 💬');
      }
    }

    // ===== لیست پخش =====
    function renderPlaylists() {
      const container = document.getElementById('playlistsContainer');
      container.innerHTML = playlists.map(p => `
        <div class="playlist-item" onclick="showNotification('باز کردن ${p.name}')">
          <div class="thumb"><i class="fas fa-list"></i></div>
          <div class="info">
            <div class="title">${p.name}</div>
            <div class="count">${p.count} ویدیو</div>
          </div>
          <i class="fas fa-play" onclick="event.stopPropagation();showNotification('پخش ${p.name} ▶️')"></i>
        </div>
      `).join('');
    }

    function createPlaylist() {
      const name = prompt('نام لیست پخش جدید:');
      if (!name || !name.trim()) return;
      playlists.push({ id: playlists.length + 1, name: name.trim(), count: 0, videos: [] });
      renderPlaylists();
      showNotification('لیست پخش "' + name + '" ایجاد شد ✅');
    }

    function addToPlaylist(videoId) {
      const names = playlists.map((p, i) => `${i+1}. ${p.name}`);
      const choice = prompt('انتخاب لیست پخش:\n' + names.join('\n') + '\n\nشماره را وارد کنید:');
      const idx = parseInt(choice) - 1;
      if (idx >= 0 && idx < playlists.length) {
        if (!playlists[idx].videos.includes(videoId)) {
          playlists[idx].videos.push(videoId);
          playlists[idx].count = playlists[idx].videos.length;
          showNotification('ویدیو به "' + playlists[idx].name + '" اضافه شد ✅');
        } else {
          showNotification('ویدیو قبلاً در این لیست وجود دارد!');
        }
      } else {
        showNotification('شماره نامعتبر!');
      }
    }

    // ===== تاریخچه =====
    function renderHistory() {
      const container = document.getElementById('historyContainer');
      const historyVideos = history.map(id => videos.find(v => v.id === id)).filter(v => v);
      if (historyVideos.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">تاریخچه تماشا خالی است</p>';
        return;
      }
      container.innerHTML = historyVideos.map(v => `
        <div class="playlist-item" onclick="playVideo(${v.id})">
          <div class="thumb" style="width:120px;height:68px;background:linear-gradient(135deg,var(--accent),var(--text-muted));display:flex;align-items:center;justify-content:center;font-size:1.5rem;"><i class="fas fa-play"></i></div>
          <div class="info">
            <div class="title">${v.title}</div>
            <div class="count">${v.channel} · ${v.views} بازدید</div>
          </div>
          <span style="font-size:0.75rem;color:var(--text-muted);">${v.date}</span>
        </div>
      `).join('');
    }

    // ===== توصیه‌ها =====
    function renderRecommended() {
      const container = document.getElementById('recommendedVideos');
      const recommended = videos.filter(v => v.id !== currentVideo?.id).slice(0, 3);
      container.innerHTML = recommended.map(v => `
        <div class="playlist-item" onclick="playVideo(${v.id})" style="padding:6px 0;">
          <div class="thumb" style="width:60px;height:34px;font-size:0.8rem;"><i class="fas fa-play"></i></div>
          <div class="info">
            <div class="title" style="font-size:0.8rem;">${v.title}</div>
            <div class="count" style="font-size:0.65rem;">${v.channel}</div>
          </div>
        </div>
      `).join('');
    }

    // ===== جستجو =====
    function searchVideos() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) { showNotification('لطفاً عبارت جستجو را وارد کنید!'); return; }
      const results = videos.filter(v => v.title.toLowerCase().includes(query) || v.channel.toLowerCase().includes(query));
      showTab('home');
      const grid = document.getElementById('videoGrid');
      if (results.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;">نتیجه‌ای یافت نشد</p>';
      } else {
        renderVideos('videoGrid', results);
      }
      showNotification(`${results.length} نتیجه یافت شد 🔍`);
    }

    document.getElementById('searchInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') searchVideos();
    });

    // ===== آپلود =====
    function showUploadModal() {
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').style.display = 'none';
    }

    function uploadVideo() {
      const title = document.getElementById('uploadTitle').value.trim();
      const privacy = document.getElementById('uploadPrivacy').value;
      const category = document.getElementById('uploadCategory').value;
      if (!title) { showNotification('لطفاً عنوان ویدیو را وارد کنید!'); return; }
      const newVideo = {
        id: videos.length + 1,
        title: title,
        channel: 'کانال علی',
        channelAvatar: 'ع',
        views: '۰',
        likes: 0,
        comments: 0,
        duration: '۰:۰۰',
        category: category,
        date: 'همین الان',
        liked: false,
        disliked: false
      };
      videos.push(newVideo);
      document.getElementById('uploadTitle').value = '';
      closeUploadModal();
      showNotification('ویدیو با موفقیت آپلود شد ✅ (' + privacy + ')');
      renderVideos('videoGrid', videos);
      renderVideos('channelVideos', videos.filter(v => v.channel === 'کانال علی'));
    }

    // ===== اشتراک کانال =====
    function toggleSubscribe(btn) {
      btn.classList.toggle('subscribed');
      btn.textContent = btn.classList.contains('subscribed') ? 'اشتراک' : 'اشتراک شده';
      showNotification(btn.classList.contains('subscribed') ? 'اشتراک فعال شد 🔔' : 'اشتراک لغو شد');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== بستن مودال با کلیک بیرون =====
    document.getElementById('uploadModal').addEventListener('click', function(e) {
      if (e.target === this) closeUploadModal();
    });

    // ===== تنظیم اولیه =====
    setLanguage('fa');
    showTab('home');
    renderRecommended();

    console.log('✅ سرویس اشتراک ویدیو کامل بارگذاری شد!');
  </script>
</body>
</html>
