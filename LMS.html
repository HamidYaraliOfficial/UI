<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم آموزش آنلاین | LMS کامل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f2f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:2px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header-actions { display:flex; gap:16px; align-items:center; }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های دوره ===== */
    .course-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .course-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
      cursor:pointer;
    }
    .course-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .course-card .image {
      height:140px; background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2rem; position:relative;
    }
    .course-card .image .level-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.6); color:#fff; padding:2px 12px;
      border-radius:50px; font-size:0.6rem; font-weight:600;
    }
    body.ltr .course-card .image .level-badge { right:auto; left:12px; }
    .course-card .content { padding:14px; }
    .course-card .content .title {
      font-size:1rem; font-weight:700; margin-bottom:4px;
    }
    .course-card .content .instructor {
      font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;
    }
    .course-card .content .meta {
      display:flex; justify-content:space-between; font-size:0.75rem;
      color:var(--text-muted); border-top:1px solid var(--border-color);
      padding-top:8px;
    }
    .course-card .content .meta .progress { color:var(--success); font-weight:600; }
    .course-card .content .meta .students i { margin-left:4px; }

    /* ===== فیلتر ===== */
    .filter-bar {
      display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;
      padding:12px 16px; background:var(--bg-card); border-radius:var(--radius);
      border:1px solid var(--border-color);
    }
    .filter-bar select, .filter-bar input {
      padding:6px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .filter-bar select:focus, .filter-bar input:focus {
      border-color:var(--accent); outline:none;
    }

    /* ===== صفحه دوره ===== */
    .course-detail {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .course-detail .header {
      display:flex; gap:20px; flex-wrap:wrap; border-bottom:1px solid var(--border-color);
      padding-bottom:16px; margin-bottom:16px;
    }
    .course-detail .header .info { flex:1; }
    .course-detail .header .info h1 { font-size:1.6rem; }
    .course-detail .header .info .instructor { color:var(--text-muted); }
    .course-detail .header .info .progress-bar {
      height:6px; background:var(--bg-primary); border-radius:10px;
      margin:8px 0; overflow:hidden;
    }
    .course-detail .header .info .progress-bar .fill {
      height:100%; background:var(--success); border-radius:10px;
      transition:var(--transition);
    }
    .course-detail .header .actions button {
      padding:8px 20px; border:none; border-radius:8px;
      font-weight:600; cursor:pointer; transition:var(--transition);
    }
    .course-detail .header .actions .btn-primary { background:var(--accent); color:#fff; }
    .course-detail .header .actions .btn-primary:hover { background:var(--accent-hover); }
    .course-detail .header .actions .btn-success { background:var(--success); color:#fff; }
    .course-detail .header .actions .btn-success:hover { opacity:0.8; }

    .course-detail .sections {
      display:flex; flex-direction:column; gap:8px;
    }
    .course-detail .sections .section {
      border:1px solid var(--border-color); border-radius:8px;
      overflow:hidden;
    }
    .course-detail .sections .section .section-header {
      padding:10px 16px; background:var(--bg-primary);
      display:flex; justify-content:space-between; align-items:center;
      cursor:pointer; transition:var(--transition);
    }
    .course-detail .sections .section .section-header:hover { background:var(--border-color); }
    .course-detail .sections .section .section-header .title {
      font-weight:600; display:flex; align-items:center; gap:8px;
    }
    .course-detail .sections .section .section-header .title .duration {
      font-weight:400; font-size:0.75rem; color:var(--text-muted);
    }
    .course-detail .sections .section .section-content {
      padding:8px 16px; display:none;
    }
    .course-detail .sections .section .section-content.show { display:block; }
    .course-detail .sections .section .section-content .lesson {
      display:flex; align-items:center; gap:12px; padding:8px 0;
      border-bottom:1px solid var(--border-color); cursor:pointer;
      transition:var(--transition);
    }
    .course-detail .sections .section .section-content .lesson:last-child { border-bottom:none; }
    .course-detail .sections .section .section-content .lesson:hover { padding-right:8px; }
    body.ltr .course-detail .sections .section .section-content .lesson:hover { padding-right:0; padding-left:8px; }
    .course-detail .sections .section .section-content .lesson .icon {
      width:28px; color:var(--text-muted);
    }
    .course-detail .sections .section .section-content .lesson .icon.completed { color:var(--success); }
    .course-detail .sections .section .section-content .lesson .icon.locked { color:var(--text-muted); }
    .course-detail .sections .section .section-content .lesson .info { flex:1; }
    .course-detail .sections .section .section-content .lesson .info .title { font-size:0.9rem; }
    .course-detail .sections .section .section-content .lesson .info .duration { font-size:0.7rem; color:var(--text-muted); }

    /* ===== آزمون ===== */
    .quiz-container {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .quiz-container .question {
      margin-bottom:16px; padding:12px; background:var(--bg-primary);
      border-radius:8px;
    }
    .quiz-container .question .q-text { font-weight:600; margin-bottom:8px; }
    .quiz-container .question .options { display:flex; flex-direction:column; gap:6px; }
    .quiz-container .question .options label {
      display:flex; align-items:center; gap:8px; cursor:pointer;
      padding:6px 10px; border-radius:6px; transition:var(--transition);
    }
    .quiz-container .question .options label:hover { background:var(--border-color); }
    .quiz-container .question .options input[type="radio"] {
      accent-color:var(--accent); width:16px; height:16px;
    }
    .quiz-container .question .options .correct { color:var(--success); }
    .quiz-container .question .options .wrong { color:var(--danger); }

    /* ===== انجمن ===== */
    .forum-post {
      background:var(--bg-card); border-radius:var(--radius);
      padding:12px 16px; margin-bottom:10px;
      border:1px solid var(--border-color);
    }
    .forum-post .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px; border-bottom:none; padding:0;
    }
    .forum-post .header .user { font-weight:600; font-size:0.9rem; }
    .forum-post .header .time { font-size:0.7rem; color:var(--text-muted); }
    .forum-post .text { font-size:0.9rem; color:var(--text-secondary); margin:4px 0 8px; }
    .forum-post .actions i {
      cursor:pointer; margin-left:10px; font-size:0.8rem;
      color:var(--text-muted); transition:var(--transition);
    }
    body.ltr .forum-post .actions i { margin-left:0; margin-right:10px; }
    .forum-post .actions i:hover { color:var(--accent); }

    /* ===== گواهینامه ===== */
    .certificate {
      background:var(--bg-card); border-radius:var(--radius);
      padding:32px; text-align:center; border:2px solid var(--accent);
      max-width:600px; margin:0 auto;
    }
    .certificate .icon { font-size:4rem; color:var(--success); margin-bottom:12px; }
    .certificate h2 { font-size:1.8rem; color:var(--accent); }
    .certificate .name { font-size:1.4rem; font-weight:700; margin:8px 0; }
    .certificate .course { font-size:1.1rem; color:var(--text-secondary); }
    .certificate .date { font-size:0.85rem; color:var(--text-muted); margin-top:12px; }
    .certificate .download-btn {
      margin-top:16px; padding:10px 32px; background:var(--accent);
      color:#fff; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .certificate .download-btn:hover { background:var(--accent-hover); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .header .nav-links a { font-size:0.8rem; }
      .course-grid { grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); }
      .course-detail .header { flex-direction:column; }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .filter-bar { flex-direction:column; }
      .course-grid { grid-template-columns:1fr; }
      .certificate { padding:16px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .course-detail .header .info h1 { font-size:1.2rem; }
    }

    body.ltr { direction:ltr; text-align:left; }
    body.ltr .course-card .image .level-badge { right:auto; left:12px; }
    body.ltr .forum-post .actions i { margin-left:0; margin-right:10px; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span id="brandName">آکادمی آنلاین</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('courses')" data-key="navCourses">دوره‌ها</a>
      <a onclick="showTab('forum')" data-key="navForum">انجمن</a>
      <a onclick="showTab('instructor')" data-key="navInstructor">پنل مدرس</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-search" onclick="showNotification('جستجو 🔍')"></i>
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب دوره‌ها ===== -->
    <div class="tab-content active" id="tab-courses">
      <div class="filter-bar">
        <input type="text" id="searchCourse" placeholder="جستجوی دوره ..." onkeyup="filterCourses()">
        <select id="levelFilter" onchange="filterCourses()">
          <option value="all" data-key="allLevels">همه سطوح</option>
          <option value="مبتدی">مبتدی</option>
          <option value="متوسط">متوسط</option>
          <option value="پیشرفته">پیشرفته</option>
        </select>
        <select id="categoryFilter" onchange="filterCourses()">
          <option value="all" data-key="allCategories">همه دسته‌ها</option>
          <option value="برنامه‌نویسی">برنامه‌نویسی</option>
          <option value="طراحی">طراحی</option>
          <option value="بازاریابی">بازاریابی</option>
          <option value="زبان">زبان</option>
          <option value="علوم">علوم</option>
        </select>
      </div>
      <div class="course-grid" id="courseGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب دوره (جزئیات) ===== -->
    <div class="tab-content" id="tab-course-detail">
      <div id="courseDetailContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب آزمون ===== -->
    <div class="tab-content" id="tab-quiz">
      <div id="quizContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب گواهینامه ===== -->
    <div class="tab-content" id="tab-certificate">
      <div id="certificateContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب انجمن ===== -->
    <div class="tab-content" id="tab-forum">
      <h2 style="margin-bottom:16px;"><i class="fas fa-comments" style="color:var(--accent);"></i> <span data-key="forumTitle">انجمن تبادل نظر</span></h2>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <input type="text" id="forumInput" placeholder="متن پست ..." style="flex:1;padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-card);color:var(--text-primary);">
        <button onclick="addForumPost()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="postBtn">ارسال</button>
      </div>
      <div id="forumContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب پنل مدرس ===== -->
    <div class="tab-content" id="tab-instructor">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chalkboard-teacher" style="color:var(--accent);"></i> <span data-key="instructorTitle">پنل مدرس</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border-color);">
        <h3 style="margin-bottom:12px;" data-key="myCourses">دوره‌های من</h3>
        <div id="instructorCourses">
          <!-- توسط JS ساخته می‌شود -->
        </div>
        <button class="btn-primary" onclick="addInstructorCourse()" style="margin-top:12px;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="addCourseBtn">+ افزودن دوره جدید</button>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'آکادمی آنلاین',
        navCourses: 'دوره‌ها',
        navForum: 'انجمن',
        navInstructor: 'پنل مدرس',
        allLevels: 'همه سطوح',
        allCategories: 'همه دسته‌ها',
        forumTitle: 'انجمن تبادل نظر',
        postBtn: 'ارسال',
        instructorTitle: 'پنل مدرس',
        myCourses: 'دوره‌های من',
        addCourseBtn: '+ افزودن دوره جدید',
        enrollBtn: 'ثبت‌نام',
        continueBtn: 'ادامه',
        completed: 'تکمیل شده',
        certificateBtn: 'دریافت گواهینامه',
        quizTitle: 'آزمون',
        submitQuiz: 'ارسال پاسخ‌ها',
        score: 'نمره'
      },
      en: {
        brandName: 'Online Academy',
        navCourses: 'Courses',
        navForum: 'Forum',
        navInstructor: 'Instructor Panel',
        allLevels: 'All Levels',
        allCategories: 'All Categories',
        forumTitle: 'Discussion Forum',
        postBtn: 'Post',
        instructorTitle: 'Instructor Panel',
        myCourses: 'My Courses',
        addCourseBtn: '+ Add New Course',
        enrollBtn: 'Enroll',
        continueBtn: 'Continue',
        completed: 'Completed',
        certificateBtn: 'Get Certificate',
        quizTitle: 'Quiz',
        submitQuiz: 'Submit Answers',
        score: 'Score'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let courses = [
      {
        id: 1,
        title: 'برنامه‌نویسی پایتون پیشرفته',
        instructor: 'علی رضایی',
        level: 'پیشرفته',
        category: 'برنامه‌نویسی',
        students: 1240,
        progress: 45,
        image: '🐍',
        sections: [
          { title: 'مقدمه', duration: '15:30', lessons: [
            { title: 'معرفی دوره', duration: '5:20', completed: true },
            { title: 'نصب و راه‌اندازی', duration: '10:10', completed: true }
          ]},
          { title: 'مبانی پایتون', duration: '2:30:00', lessons: [
            { title: 'متغیرها و انواع داده', duration: '20:15', completed: true },
            { title: 'ساختارهای شرطی', duration: '25:30', completed: false },
            { title: 'حلقه‌ها', duration: '30:45', completed: false }
          ]},
          { title: 'پیشرفته', duration: '3:00:00', lessons: [
            { title: 'کلاس‌ها و اشیاء', duration: '35:20', completed: false },
            { title: 'مدیریت استثناها', duration: '20:10', completed: false }
          ]}
        ],
        quiz: [
          { question: 'کدام یک از موارد زیر یک نوع داده در پایتون نیست؟', options: ['int', 'float', 'char', 'bool'], correct: 2 },
          { question: 'برای تعریف یک تابع در پایتون از چه کلیدواژه‌ای استفاده می‌شود؟', options: ['function', 'def', 'define', 'func'], correct: 1 }
        ]
      },
      {
        id: 2,
        title: 'طراحی UI/UX حرفه‌ای',
        instructor: 'سارا محمدی',
        level: 'متوسط',
        category: 'طراحی',
        students: 856,
        progress: 0,
        image: '🎨',
        sections: [
          { title: 'مفاهیم اولیه', duration: '1:00:00', lessons: [
            { title: 'اصول طراحی', duration: '30:00', completed: false },
            { title: 'رنگ‌شناسی', duration: '30:00', completed: false }
          ]}
        ],
        quiz: [
          { question: 'کدام رنگ احساس اعتماد را منتقل می‌کند؟', options: ['قرمز', 'آبی', 'زرد', 'سبز'], correct: 1 }
        ]
      },
      {
        id: 3,
        title: 'بازاریابی دیجیتال',
        instructor: 'مهدی کریمی',
        level: 'مبتدی',
        category: 'بازاریابی',
        students: 2100,
        progress: 100,
        image: '📊',
        sections: [
          { title: 'مبانی بازاریابی', duration: '2:00:00', lessons: [
            { title: 'مقدمه', duration: '20:00', completed: true },
            { title: 'استراتژی محتوا', duration: '40:00', completed: true }
          ]}
        ],
        quiz: []
      }
    ];

    let forumPosts = [
      { id: 1, user: 'علی رضایی', text: 'سلام! آیا کسی می‌داند که چگونه می‌توانم در پایتون یک وب‌سرویس ایجاد کنم؟', time: '۲ ساعت پیش' },
      { id: 2, user: 'سارا محمدی', text: 'دوره طراحی UI/UX بسیار عالی بود! واقعاً لذت بردم.', time: '۵ ساعت پیش' }
    ];

    let nextPostId = 3;
    let nextCourseId = 4;
    let enrolledCourses = [1, 3];
    let completedCourses = [3];
    let currentCourseId = null;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { courses: 0, forum: 1, instructor: 2 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'courses') renderCourses();
      if (tabName === 'forum') renderForum();
      if (tabName === 'instructor') renderInstructorCourses();
    }

    // ===== رندر دوره‌ها =====
    function renderCourses(filtered = null) {
      const grid = document.getElementById('courseGrid');
      const data = filtered || courses;
      grid.innerHTML = data.map(c => `
        <div class="course-card" onclick="viewCourse(${c.id})">
          <div class="image">
            <span>${c.image}</span>
            <span class="level-badge">${c.level}</span>
          </div>
          <div class="content">
            <div class="title">${c.title}</div>
            <div class="instructor"><i class="fas fa-user"></i> ${c.instructor}</div>
            <div class="meta">
              <span><i class="fas fa-user-graduate"></i> ${c.students}</span>
              <span class="progress">${c.progress}%</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== فیلتر دوره‌ها =====
    function filterCourses() {
      const search = document.getElementById('searchCourse').value.trim().toLowerCase();
      const level = document.getElementById('levelFilter').value;
      const category = document.getElementById('categoryFilter').value;
      let filtered = courses;
      if (search) filtered = filtered.filter(c => c.title.toLowerCase().includes(search) || c.instructor.toLowerCase().includes(search));
      if (level !== 'all') filtered = filtered.filter(c => c.level === level);
      if (category !== 'all') filtered = filtered.filter(c => c.category === category);
      renderCourses(filtered);
    }

    // ===== مشاهده دوره =====
    function viewCourse(courseId) {
      currentCourseId = courseId;
      const course = courses.find(c => c.id === courseId);
      if (!course) return;
      showTab('course-detail');
      const container = document.getElementById('courseDetailContainer');
      const isEnrolled = enrolledCourses.includes(courseId);
      const isCompleted = completedCourses.includes(courseId);
      const progress = course.progress;

      container.innerHTML = `
        <div class="course-detail">
          <div class="header">
            <div class="info">
              <h1>${course.image} ${course.title}</h1>
              <div class="instructor"><i class="fas fa-user"></i> ${course.instructor} · ${course.level} · ${course.category}</div>
              <div style="display:flex;gap:16px;font-size:0.85rem;color:var(--text-muted);margin:4px 0;">
                <span><i class="fas fa-user-graduate"></i> ${course.students} دانشجو</span>
                <span><i class="fas fa-book"></i> ${course.sections.reduce((acc, s) => acc + s.lessons.length, 0)} درس</span>
              </div>
              <div class="progress-bar"><div class="fill" style="width:${progress}%;"></div></div>
              <span style="font-size:0.8rem;color:var(--text-muted);">پیشرفت: ${progress}%</span>
            </div>
            <div class="actions">
              ${isCompleted ? `<button class="btn-success" onclick="showCertificate(${courseId})" data-key="certificateBtn">🎓 دریافت گواهینامه</button>` : ''}
              ${isEnrolled ? `<button class="btn-primary" onclick="showNotification('ادامه دوره ▶️')" data-key="continueBtn">ادامه</button>` : `<button class="btn-primary" onclick="enrollCourse(${courseId})" data-key="enrollBtn">ثبت‌نام</button>`}
              ${course.quiz.length > 0 ? `<button class="btn-primary" onclick="startQuiz(${courseId})" style="background:var(--warning);" data-key="quizTitle">📝 آزمون</button>` : ''}
            </div>
          </div>
          <div class="sections">
            ${course.sections.map((s, si) => `
              <div class="section">
                <div class="section-header" onclick="toggleSection(this)">
                  <span class="title">${s.title} <span class="duration">(${s.duration})</span></span>
                  <span style="font-size:0.75rem;color:var(--text-muted);">${s.lessons.filter(l => l.completed).length}/${s.lessons.length}</span>
                </div>
                <div class="section-content">
                  ${s.lessons.map(l => `
                    <div class="lesson" onclick="playLesson(${courseId}, '${l.title}')">
                      <span class="icon ${l.completed ? 'completed' : isEnrolled ? '' : 'locked'}">
                        <i class="fas ${l.completed ? 'fa-check-circle' : isEnrolled ? 'fa-play-circle' : 'fa-lock'}"></i>
                      </span>
                      <div class="info">
                        <div class="title">${l.title}</div>
                        <div class="duration">${l.duration}</div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ===== ثبت‌نام در دوره =====
    function enrollCourse(courseId) {
      if (!enrolledCourses.includes(courseId)) {
        enrolledCourses.push(courseId);
        const course = courses.find(c => c.id === courseId);
        if (course) course.students++;
        showNotification('ثبت‌نام با موفقیت انجام شد ✅');
        viewCourse(courseId);
        renderCourses();
      }
    }

    // ===== پخش درس =====
    function playLesson(courseId, lessonTitle) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;
      if (!enrolledCourses.includes(courseId)) {
        showNotification('لطفاً ابتدا در دوره ثبت‌نام کنید!');
        return;
      }
      // علامت‌گذاری درس به‌عنوان دیده‌شده
      let found = false;
      for (const section of course.sections) {
        for (const lesson of section.lessons) {
          if (lesson.title === lessonTitle && !lesson.completed) {
            lesson.completed = true;
            found = true;
            break;
          }
        }
        if (found) break;
      }
      // محاسبه پیشرفت
      const total = course.sections.reduce((acc, s) => acc + s.lessons.length, 0);
      const completed = course.sections.reduce((acc, s) => acc + s.lessons.filter(l => l.completed).length, 0);
      course.progress = Math.round((completed / total) * 100);

      // بررسی تکمیل دوره
      if (course.progress === 100 && !completedCourses.includes(courseId)) {
        completedCourses.push(courseId);
        showNotification('🎉 دوره تکمیل شد! گواهینامه شما آماده است!');
      }

      showNotification(`در حال پخش: ${lessonTitle} ▶️`);
      viewCourse(courseId);
      renderCourses();
    }

    // ===== تاگل بخش =====
    function toggleSection(header) {
      const content = header.nextElementSibling;
      content.classList.toggle('show');
    }

    // ===== آزمون =====
    let quizAnswers = {};
    let quizCourseId = null;

    function startQuiz(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course || course.quiz.length === 0) return;
      quizCourseId = courseId;
      quizAnswers = {};
      showTab('quiz');
      const container = document.getElementById('quizContainer');
      container.innerHTML = `
        <div class="quiz-container">
          <h2 style="margin-bottom:16px;"><i class="fas fa-pencil-alt" style="color:var(--warning);"></i> ${course.title} - آزمون</h2>
          ${course.quiz.map((q, qi) => `
            <div class="question">
              <div class="q-text">${qi + 1}. ${q.question}</div>
              <div class="options">
                ${q.options.map((opt, oi) => `
                  <label>
                    <input type="radio" name="q${qi}" value="${oi}" onchange="quizAnswers['${qi}'] = ${oi}">
                    ${opt}
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('')}
          <button onclick="submitQuiz()" style="padding:10px 32px;background:var(--success);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'" data-key="submitQuiz">ارسال پاسخ‌ها</button>
          <div id="quizResult" style="margin-top:16px;"></div>
        </div>
      `;
    }

    function submitQuiz() {
      const course = courses.find(c => c.id === quizCourseId);
      if (!course) return;
      let correct = 0;
      course.quiz.forEach((q, qi) => {
        if (quizAnswers[qi] === q.correct) correct++;
      });
      const score = Math.round((correct / course.quiz.length) * 100);
      const result = document.getElementById('quizResult');
      const passed = score >= 60;
      result.innerHTML = `
        <div style="padding:16px;background:${passed ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'};border-radius:8px;">
          <h3>${passed ? '✅ قبول شدید!' : '❌ نیاز به تلاش بیشتر'}</h3>
          <p><span data-key="score">نمره</span>: ${score}% (${correct}/${course.quiz.length})</p>
          ${passed ? '<p style="color:var(--success);">تبریک! آزمون را با موفقیت گذراندید 🎉</p>' : '<p style="color:var(--danger);">لطفاً دوباره تلاش کنید.</p>'}
        </div>
      `;
      if (passed && !completedCourses.includes(quizCourseId)) {
        completedCourses.push(quizCourseId);
        const c = courses.find(c => c.id === quizCourseId);
        if (c) c.progress = 100;
        showNotification('🎉 آزمون قبول شدید! گواهینامه آماده است!');
      }
    }

    // ===== گواهینامه =====
    function showCertificate(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;
      showTab('certificate');
      const container = document.getElementById('certificateContainer');
      const now = new Date();
      const date = now.toLocaleDateString('fa-IR');
      container.innerHTML = `
        <div class="certificate">
          <div class="icon"><i class="fas fa-award"></i></div>
          <h2>🎓 گواهینامه</h2>
          <p style="color:var(--text-muted);">این گواهینامه به</p>
          <div class="name">علی رضایی</div>
          <p style="color:var(--text-muted);">برای تکمیل موفقیت‌آمیز دوره</p>
          <div class="course">"${course.title}"</div>
          <p style="color:var(--text-muted);">با نمره قبولی صادر شده است.</p>
          <div class="date">تاریخ: ${date}</div>
          <button class="download-btn" onclick="showNotification('گواهینامه دانلود شد 📄')"><i class="fas fa-download"></i> دانلود گواهینامه</button>
        </div>
      `;
    }

    // ===== انجمن =====
    function renderForum() {
      const container = document.getElementById('forumContainer');
      container.innerHTML = forumPosts.map(p => `
        <div class="forum-post">
          <div class="header">
            <span class="user"><i class="fas fa-user"></i> ${p.user}</span>
            <span class="time">${p.time}</span>
          </div>
          <div class="text">${p.text}</div>
          <div class="actions">
            <i class="fas fa-heart" onclick="showNotification('لایک شد ❤️')"></i>
            <i class="fas fa-reply" onclick="showNotification('پاسخ 💬')"></i>
          </div>
        </div>
      `).join('');
    }

    function addForumPost() {
      const input = document.getElementById('forumInput');
      const text = input.value.trim();
      if (!text) { showNotification('لطفاً متن پست را وارد کنید!'); return; }
      const now = new Date();
      const time = 'امروز ' + now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
      forumPosts.unshift({ id: nextPostId++, user: 'شما', text, time });
      input.value = '';
      renderForum();
      showNotification('پست با موفقیت ارسال شد ✅');
    }

    // ===== پنل مدرس =====
    function renderInstructorCourses() {
      const container = document.getElementById('instructorCourses');
      container.innerHTML = courses.map(c => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);flex-wrap:wrap;gap:8px;">
          <div>
            <span style="font-weight:600;">${c.image} ${c.title}</span>
            <span style="font-size:0.75rem;color:var(--text-muted);margin-right:8px;">${c.students} دانشجو</span>
          </div>
          <div>
            <button onclick="viewCourse(${c.id})" style="padding:4px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem;">مشاهده</button>
            <button onclick="editCourse(${c.id})" style="padding:4px 14px;background:var(--warning);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem;">ویرایش</button>
            <button onclick="deleteCourse(${c.id})" style="padding:4px 14px;background:var(--danger);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem;">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function addInstructorCourse() {
      const title = prompt('عنوان دوره:');
      if (!title || !title.trim()) return;
      const instructor = prompt('نام مدرس:') || 'مدرس';
      const level = prompt('سطح (مبتدی/متوسط/پیشرفته):') || 'مبتدی';
      const category = prompt('دسته‌بندی:') || 'عمومی';
      courses.push({
        id: nextCourseId++,
        title: title.trim(),
        instructor,
        level,
        category,
        students: 0,
        progress: 0,
        image: '📚',
        sections: [{ title: 'بخش اول', duration: '1:00:00', lessons: [{ title: 'درس اول', duration: '10:00', completed: false }] }],
        quiz: []
      });
      renderInstructorCourses();
      renderCourses();
      showNotification('دوره جدید اضافه شد ✅');
    }

    function editCourse(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;
      const title = prompt('عنوان جدید:', course.title);
      if (title && title.trim()) course.title = title.trim();
      const instructor = prompt('نام مدرس:', course.instructor);
      if (instructor && instructor.trim()) course.instructor = instructor.trim();
      renderInstructorCourses();
      renderCourses();
      showNotification('دوره به‌روزرسانی شد ✏️');
    }

    function deleteCourse(courseId) {
      if (confirm('آیا از حذف این دوره اطمینان دارید؟')) {
        courses = courses.filter(c => c.id !== courseId);
        renderInstructorCourses();
        renderCourses();
        showNotification('دوره حذف شد 🗑️');
      }
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    setLanguage('fa');
    renderCourses();
    renderForum();
    renderInstructorCourses();

    console.log('✅ پلتفرم آموزش آنلاین (LMS) کامل بارگذاری شد!');
  </script>
</body>
</html>
