<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت املاک | Real Estate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f4f8;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #2d7d46;
      --accent-hover: #236b3a;
      --accent-light: #34a853;
      --success: #27ae60;
      --warning: #f39c12;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:2px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; color:var(--accent-light); }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== جستجو ===== */
    .search-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
      margin-bottom:20px;
    }
    .search-grid {
      display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto;
      gap:12px; align-items:end;
    }
    .search-grid .form-group label { display:block; font-size:0.8rem; font-weight:500; margin-bottom:4px; }
    .search-grid .form-group input, .search-grid .form-group select {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .search-grid .form-group input:focus, .search-grid .form-group select:focus {
      border-color:var(--accent); outline:none;
    }
    .search-grid button {
      padding:8px 24px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition); height:42px;
    }
    .search-grid button:hover { background:var(--accent-hover); }

    /* ===== کارت‌های ملک ===== */
    .property-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .property-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
      cursor:pointer;
    }
    .property-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .property-card .image {
      height:200px; background:linear-gradient(135deg, var(--accent), var(--accent-light));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:3rem; position:relative;
    }
    .property-card .image .type-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.7); padding:4px 14px;
      border-radius:50px; font-size:0.7rem; font-weight:600;
    }
    body.ltr .property-card .image .type-badge { right:auto; left:12px; }
    .property-card .image .price-badge {
      position:absolute; bottom:12px; right:12px;
      background:rgba(0,0,0,0.7); padding:4px 14px;
      border-radius:50px; font-size:0.9rem; font-weight:700;
    }
    body.ltr .property-card .image .price-badge { right:auto; left:12px; }
    .property-card .content { padding:14px; }
    .property-card .content .title { font-size:1rem; font-weight:700; }
    .property-card .content .location { font-size:0.85rem; color:var(--text-muted); }
    .property-card .content .details {
      display:flex; gap:12px; margin:8px 0;
      font-size:0.85rem; color:var(--text-secondary);
    }
    .property-card .content .details span { display:flex; align-items:center; gap:4px; }
    .property-card .content .meta {
      display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border-color); padding-top:10px;
    }
    .property-card .content .meta .views { font-size:0.8rem; color:var(--text-muted); }
    .property-card .content .actions {
      display:flex; gap:6px;
    }
    .property-card .content .actions button {
      padding:4px 12px; border:none; border-radius:6px;
      cursor:pointer; font-size:0.75rem; font-weight:600;
      transition:var(--transition);
    }
    .property-card .content .actions .fav-btn { background:var(--bg-primary); color:var(--text-secondary); }
    .property-card .content .actions .fav-btn.active { background:var(--danger); color:#fff; }
    .property-card .content .actions .compare-btn { background:var(--accent); color:#fff; }
    .property-card .content .actions .compare-btn:hover { background:var(--accent-hover); }

    /* ===== نقشه ===== */
    .map-container {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
      min-height:300px; position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    .map-container .map-placeholder {
      width:100%; height:100%; min-height:250px;
      background:var(--bg-primary); border-radius:var(--radius);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:var(--text-muted);
    }
    .map-container .map-placeholder i { font-size:4rem; margin-bottom:8px; opacity:0.3; }
    .map-container .map-marker {
      position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
      background:var(--accent); color:#fff; padding:6px 16px;
      border-radius:50px; font-size:0.85rem; font-weight:600;
      animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform:translate(-50%, -50%) scale(1); }
      50% { transform:translate(-50%, -50%) scale(1.05); }
    }

    /* ===== مقایسه ===== */
    .compare-container {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
      gap:16px;
    }
    .compare-item {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
      text-align:center;
    }
    .compare-item .remove {
      color:var(--danger); cursor:pointer; float:left;
    }
    body.ltr .compare-item .remove { float:right; }

    /* ===== فرم ثبت ملک ===== */
    .form-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .form-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .form-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }

    /* ===== علاقه‌مندی‌ها ===== */
    .favorites-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
      gap:20px;
    }

    /* ===== تماس با مشاور ===== */
    .contact-form {
      max-width:500px; margin:0 auto;
    }
    .contact-form .form-group { margin-bottom:12px; }

    /* ===== داشبورد مشاور ===== */
    .advisor-stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .advisor-stat {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .advisor-stat .number { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .advisor-stat .label { font-size:0.85rem; color:var(--text-muted); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .search-grid { grid-template-columns:1fr 1fr; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:1; }
      .advisor-stats { grid-template-columns:repeat(2,1fr); }
      .property-grid { grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .search-grid { grid-template-columns:1fr; }
      .advisor-stats { grid-template-columns:1fr; }
      .compare-container { grid-template-columns:1fr; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .property-card .image { height:150px; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-building"></i> <span id="brandName">املاک</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('properties')" data-key="navProperties">املاک</a>
      <a onclick="showTab('addProperty')" data-key="navAdd">ثبت ملک</a>
      <a onclick="showTab('favorites')" data-key="navFavorites">علاقه‌مندی‌ها</a>
      <a onclick="showTab('compare')" data-key="navCompare">مقایسه</a>
      <a onclick="showTab('contact')" data-key="navContact">تماس با مشاور</a>
      <a onclick="showTab('advisor')" data-key="navAdvisor">داشبورد مشاور</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب املاک ===== -->
    <div class="tab-content active" id="tab-properties">
      <div class="search-section">
        <div class="search-grid">
          <div class="form-group">
            <label data-key="lblLocation">موقعیت</label>
            <input type="text" id="searchLocation" placeholder="شهر، منطقه ...">
          </div>
          <div class="form-group">
            <label data-key="lblType">نوع</label>
            <select id="searchType">
              <option value="all">همه</option>
              <option value="آپارتمان">آپارتمان</option>
              <option value="ویلا">ویلا</option>
              <option value="زمین">زمین</option>
              <option value="دفتر کار">دفتر کار</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblPrice">قیمت (تومان)</label>
            <select id="searchPrice">
              <option value="all">همه</option>
              <option value="0-500">کمتر از ۵۰۰M</option>
              <option value="500-1000">۵۰۰M - ۱B</option>
              <option value="1000-2000">۱B - ۲B</option>
              <option value="2000+">بیشتر از ۲B</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblArea">متراژ</label>
            <select id="searchArea">
              <option value="all">همه</option>
              <option value="0-50">کمتر از ۵۰</option>
              <option value="50-100">۵۰ - ۱۰۰</option>
              <option value="100-200">۱۰۰ - ۲۰۰</option>
              <option value="200+">بیشتر از ۲۰۰</option>
            </select>
          </div>
          <button onclick="searchProperties()" data-key="searchBtn">جستجو</button>
        </div>
      </div>
      <div class="property-grid" id="propertyGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب ثبت ملک ===== -->
    <div class="tab-content" id="tab-addProperty">
      <div class="form-section">
        <h2><i class="fas fa-plus-circle" style="color:var(--accent);"></i> <span data-key="addTitle">ثبت ملک جدید</span></h2>
        <div class="form-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان</label>
            <input type="text" id="propTitle" placeholder="عنوان ملک ...">
          </div>
          <div class="form-group">
            <label data-key="lblType">نوع</label>
            <select id="propType">
              <option value="آپارتمان">آپارتمان</option>
              <option value="ویلا">ویلا</option>
              <option value="زمین">زمین</option>
              <option value="دفتر کار">دفتر کار</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblPrice">قیمت (تومان)</label>
            <input type="number" id="propPrice" placeholder="قیمت ...">
          </div>
          <div class="form-group">
            <label data-key="lblArea">متراژ (متر مربع)</label>
            <input type="number" id="propArea" placeholder="متراژ ...">
          </div>
          <div class="form-group full">
            <label data-key="lblLocation">موقعیت</label>
            <input type="text" id="propLocation" placeholder="آدرس کامل ...">
          </div>
          <div class="form-group full">
            <label data-key="lblDescription">توضیحات</label>
            <textarea id="propDescription" placeholder="توضیحات کامل ملک ..."></textarea>
          </div>
          <div class="form-group full">
            <label data-key="lblImage">آدرس تصویر</label>
            <input type="text" id="propImage" placeholder="آدرس تصویر ...">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="addProperty()" data-key="saveBtn">ثبت ملک</button>
          <button class="btn-secondary" onclick="clearPropertyForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب علاقه‌مندی‌ها ===== -->
    <div class="tab-content" id="tab-favorites">
      <h2 style="margin-bottom:16px;"><i class="fas fa-heart" style="color:var(--danger);"></i> <span data-key="favoritesTitle">ملک‌های مورد علاقه</span></h2>
      <div class="favorites-grid" id="favoritesGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب مقایسه ===== -->
    <div class="tab-content" id="tab-compare">
      <h2 style="margin-bottom:16px;"><i class="fas fa-balance-scale" style="color:var(--accent);"></i> <span data-key="compareTitle">مقایسه املاک</span></h2>
      <div class="compare-container" id="compareContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <p style="text-align:center;color:var(--text-muted);margin-top:12px;" data-key="compareHint">برای مقایسه، روی دکمه مقایسه در کارت ملک کلیک کنید</p>
    </div>

    <!-- ===== تب تماس با مشاور ===== -->
    <div class="tab-content" id="tab-contact">
      <h2 style="margin-bottom:16px;"><i class="fas fa-phone" style="color:var(--accent);"></i> <span data-key="contactTitle">تماس با مشاور</span></h2>
      <div class="contact-form">
        <div class="form-group">
          <label data-key="lblName">نام و نام خانوادگی</label>
          <input type="text" id="contactName" placeholder="نام شما ...">
        </div>
        <div class="form-group">
          <label data-key="lblPhone">شماره تماس</label>
          <input type="text" id="contactPhone" placeholder="۰۹۱۲۱۲۳۴۵۶۷">
        </div>
        <div class="form-group">
          <label data-key="lblMessage">پیام</label>
          <textarea id="contactMessage" placeholder="متن پیام ..." rows="4"></textarea>
        </div>
        <button onclick="sendContact()" style="width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="sendBtn">ارسال پیام</button>
      </div>
    </div>

    <!-- ===== تب داشبورد مشاور ===== -->
    <div class="tab-content" id="tab-advisor">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="advisorTitle">داشبورد مشاور</span></h2>
      <div class="advisor-stats" id="advisorStats">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-list"></i> <span data-key="myProperties">املاک من</span></h4>
        <div id="advisorProperties">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
      <div style="margin-top:16px;background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-eye"></i> <span data-key="recentViews">آمار بازدید</span></h4>
        <div id="recentViews">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'املاک',
        navProperties: 'املاک',
        navAdd: 'ثبت ملک',
        navFavorites: 'علاقه‌مندی‌ها',
        navCompare: 'مقایسه',
        navContact: 'تماس با مشاور',
        navAdvisor: 'داشبورد مشاور',
        lblLocation: 'موقعیت',
        lblType: 'نوع',
        lblPrice: 'قیمت (تومان)',
        lblArea: 'متراژ',
        searchBtn: 'جستجو',
        addTitle: 'ثبت ملک جدید',
        lblTitle: 'عنوان',
        lblImage: 'آدرس تصویر',
        saveBtn: 'ثبت ملک',
        cancelBtn: 'انصراف',
        favoritesTitle: 'ملک‌های مورد علاقه',
        compareTitle: 'مقایسه املاک',
        compareHint: 'برای مقایسه، روی دکمه مقایسه در کارت ملک کلیک کنید',
        contactTitle: 'تماس با مشاور',
        lblName: 'نام و نام خانوادگی',
        lblPhone: 'شماره تماس',
        lblMessage: 'پیام',
        sendBtn: 'ارسال پیام',
        advisorTitle: 'داشبورد مشاور',
        myProperties: 'املاک من',
        recentViews: 'آمار بازدید'
      },
      en: {
        brandName: 'Real Estate',
        navProperties: 'Properties',
        navAdd: 'Add Property',
        navFavorites: 'Favorites',
        navCompare: 'Compare',
        navContact: 'Contact Advisor',
        navAdvisor: 'Advisor Dashboard',
        lblLocation: 'Location',
        lblType: 'Type',
        lblPrice: 'Price (USD)',
        lblArea: 'Area (sqm)',
        searchBtn: 'Search',
        addTitle: 'Add New Property',
        lblTitle: 'Title',
        lblImage: 'Image URL',
        saveBtn: 'Add Property',
        cancelBtn: 'Cancel',
        favoritesTitle: 'Favorite Properties',
        compareTitle: 'Compare Properties',
        compareHint: 'Click compare button on property card to add',
        contactTitle: 'Contact Advisor',
        lblName: 'Full Name',
        lblPhone: 'Phone',
        lblMessage: 'Message',
        sendBtn: 'Send Message',
        advisorTitle: 'Advisor Dashboard',
        myProperties: 'My Properties',
        recentViews: 'Recent Views'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let properties = [];
    let favorites = [];
    let compareList = [];
    let views = [];
    let nextPropertyId = 1;

    // داده‌های نمونه
    function initSampleData() {
      properties = [
        { id: 1, title: 'آپارتمان لوکس در مرکز شهر', type: 'آپارتمان', price: 1200000000, area: 120, location: 'تهران، خیابان ولیعصر', description: 'آپارتمان مدرن با امکانات کامل و دید عالی', image: '🏢', views: 45 },
        { id: 2, title: 'ویلا باغ ۲ طبقه', type: 'ویلا', price: 2500000000, area: 350, location: 'شمال تهران، منطقه ۱', description: 'ویلا با باغ بزرگ و استخر خصوصی', image: '🏡', views: 32 },
        { id: 3, title: 'زمین ۵۰۰ متری', type: 'زمین', price: 800000000, area: 500, location: 'کرج، بلوار امام', description: 'زمین با کاربری مسکونی-تجاری', image: '🌳', views: 18 },
        { id: 4, title: 'دفتر کار اداری', type: 'دفتر کار', price: 950000000, area: 85, location: 'تهران، خیابان مطهری', description: 'دفتر کار مجهز با پارکینگ اختصاصی', image: '🏢', views: 27 }
      ];
      nextPropertyId = 5;
      favorites = [1, 3];
    }

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { properties: 0, addProperty: 1, favorites: 2, compare: 3, contact: 4, advisor: 5 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'properties') renderProperties();
      if (tabName === 'favorites') renderFavorites();
      if (tabName === 'compare') renderCompare();
      if (tabName === 'advisor') renderAdvisor();
    }

    // ===== رندر املاک =====
    function renderProperties(filtered = null) {
      const grid = document.getElementById('propertyGrid');
      const data = filtered || properties;
      if (data.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ ملکی یافت نشد</p>';
        return;
      }
      grid.innerHTML = data.map(p => `
        <div class="property-card" onclick="viewProperty(${p.id})">
          <div class="image">
            ${p.image || '🏠'}
            <span class="type-badge">${p.type}</span>
            <span class="price-badge">${(p.price / 1000000).toFixed(1)} M</span>
          </div>
          <div class="content">
            <div class="title">${p.title}</div>
            <div class="location"><i class="fas fa-map-marker-alt"></i> ${p.location}</div>
            <div class="details">
              <span><i class="fas fa-vector-square"></i> ${p.area} متر</span>
              <span><i class="fas fa-eye"></i> ${p.views || 0}</span>
            </div>
            <div class="meta">
              <span class="views">${p.description}</span>
              <div class="actions">
                <button class="fav-btn ${favorites.includes(p.id) ? 'active' : ''}" onclick="event.stopPropagation();toggleFavorite(${p.id})">
                  <i class="fas fa-heart"></i>
                </button>
                <button class="compare-btn" onclick="event.stopPropagation();toggleCompare(${p.id})">
                  <i class="fas fa-balance-scale"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== جستجو =====
    function searchProperties() {
      const location = document.getElementById('searchLocation').value.trim().toLowerCase();
      const type = document.getElementById('searchType').value;
      const price = document.getElementById('searchPrice').value;
      const area = document.getElementById('searchArea').value;

      let filtered = properties;

      if (location) filtered = filtered.filter(p => p.location.toLowerCase().includes(location) || p.title.toLowerCase().includes(location));

      if (type !== 'all') filtered = filtered.filter(p => p.type === type);

      if (price !== 'all') {
        const [min, max] = price.split('-').map(Number);
        if (price === '2000+') filtered = filtered.filter(p => p.price > 2000000000);
        else filtered = filtered.filter(p => p.price >= min * 1000000 && p.price <= max * 1000000);
      }

      if (area !== 'all') {
        const [min, max] = area.split('-').map(Number);
        if (area === '200+') filtered = filtered.filter(p => p.area > 200);
        else filtered = filtered.filter(p => p.area >= min && p.area <= max);
      }

      renderProperties(filtered);
      showNotification(`${filtered.length} ملک یافت شد`);
    }

    // ===== مشاهده ملک =====
    function viewProperty(id) {
      const property = properties.find(p => p.id === id);
      if (!property) return;
      property.views = (property.views || 0) + 1;
      showNotification(`📋 ${property.title} - ${property.type}\n📍 ${property.location}\n💰 ${(property.price/1000000).toFixed(1)} M تومان\n📐 ${property.area} متر`);
    }

    // ===== علاقه‌مندی =====
    function toggleFavorite(id) {
      const index = favorites.indexOf(id);
      if (index > -1) {
        favorites.splice(index, 1);
        showNotification('❌ از علاقه‌مندی‌ها حذف شد');
      } else {
        favorites.push(id);
        showNotification('❤️ به علاقه‌مندی‌ها اضافه شد');
      }
      renderProperties();
      renderFavorites();
    }

    function renderFavorites() {
      const grid = document.getElementById('favoritesGrid');
      const favProperties = properties.filter(p => favorites.includes(p.id));
      if (favProperties.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ ملکی در علاقه‌مندی‌ها وجود ندارد</p>';
        return;
      }
      grid.innerHTML = favProperties.map(p => `
        <div class="property-card" onclick="viewProperty(${p.id})">
          <div class="image" style="background:linear-gradient(135deg, var(--danger), var(--accent));">
            ${p.image || '🏠'}
            <span class="type-badge">${p.type}</span>
            <span class="price-badge">${(p.price / 1000000).toFixed(1)} M</span>
          </div>
          <div class="content">
            <div class="title">${p.title}</div>
            <div class="location"><i class="fas fa-map-marker-alt"></i> ${p.location}</div>
            <div class="details"><span><i class="fas fa-vector-square"></i> ${p.area} متر</span></div>
            <div class="meta">
              <span class="views">${p.description}</span>
              <button class="fav-btn active" onclick="event.stopPropagation();toggleFavorite(${p.id})"><i class="fas fa-heart"></i></button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== مقایسه =====
    function toggleCompare(id) {
      const index = compareList.indexOf(id);
      if (index > -1) {
        compareList.splice(index, 1);
        showNotification('❌ از مقایسه حذف شد');
      } else {
        if (compareList.length >= 3) {
          showNotification('❌ حداکثر ۳ ملک قابل مقایسه است');
          return;
        }
        compareList.push(id);
        showNotification('✅ به مقایسه اضافه شد');
      }
      renderProperties();
      renderCompare();
    }

    function renderCompare() {
      const container = document.getElementById('compareContainer');
      if (compareList.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ ملکی برای مقایسه انتخاب نشده است</p>';
        return;
      }
      const compProperties = properties.filter(p => compareList.includes(p.id));
      container.innerHTML = compProperties.map(p => `
        <div class="compare-item">
          <span class="remove" onclick="toggleCompare(${p.id})"><i class="fas fa-times"></i></span>
          <div style="font-size:2rem;margin:4px 0;">${p.image || '🏠'}</div>
          <div style="font-weight:700;">${p.title}</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">${p.type}</div>
          <div style="margin:4px 0;">💰 ${(p.price/1000000).toFixed(1)} M</div>
          <div>📐 ${p.area} متر</div>
          <div style="font-size:0.8rem;color:var(--text-muted);">${p.location}</div>
          <button onclick="viewProperty(${p.id})" style="margin-top:6px;padding:4px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;">جزئیات</button>
        </div>
      `).join('');
    }

    // ===== ثبت ملک =====
    function addProperty() {
      const title = document.getElementById('propTitle').value.trim();
      const type = document.getElementById('propType').value;
      const price = parseInt(document.getElementById('propPrice').value);
      const area = parseInt(document.getElementById('propArea').value);
      const location = document.getElementById('propLocation').value.trim();
      const description = document.getElementById('propDescription').value.trim();
      const image = document.getElementById('propImage').value.trim() || '🏠';

      if (!title || !price || !area || !location || !description) {
        showNotification('❌ لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      properties.push({
        id: nextPropertyId++,
        title, type, price, area, location, description, image,
        views: 0
      });

      clearPropertyForm();
      renderProperties();
      renderAdvisor();
      showNotification('✅ ملک با موفقیت ثبت شد!');
      showTab('properties');
    }

    function clearPropertyForm() {
      document.getElementById('propTitle').value = '';
      document.getElementById('propPrice').value = '';
      document.getElementById('propArea').value = '';
      document.getElementById('propLocation').value = '';
      document.getElementById('propDescription').value = '';
      document.getElementById('propImage').value = '';
    }

    // ===== تماس با مشاور =====
    function sendContact() {
      const name = document.getElementById('contactName').value.trim();
      const phone = document.getElementById('contactPhone').value.trim();
      const message = document.getElementById('contactMessage').value.trim();

      if (!name || !phone || !message) {
        showNotification('❌ لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      showNotification('✅ پیام شما با موفقیت ارسال شد! مشاور به زودی با شما تماس می‌گیرد.');
      document.getElementById('contactName').value = '';
      document.getElementById('contactPhone').value = '';
      document.getElementById('contactMessage').value = '';
    }

    // ===== داشبورد مشاور =====
    function renderAdvisor() {
      const total = properties.length;
      const totalViews = properties.reduce((sum, p) => sum + (p.views || 0), 0);
      const avgPrice = total > 0 ? Math.round(properties.reduce((sum, p) => sum + p.price, 0) / total / 1000000) : 0;
      const favoritesCount = favorites.length;

      document.getElementById('advisorStats').innerHTML = `
        <div class="advisor-stat"><div class="number">${total}</div><div class="label">کل املاک</div></div>
        <div class="advisor-stat"><div class="number">${totalViews}</div><div class="label">بازدید کل</div></div>
        <div class="advisor-stat"><div class="number">${avgPrice} M</div><div class="label">میانگین قیمت</div></div>
        <div class="advisor-stat"><div class="number">${favoritesCount}</div><div class="label">علاقه‌مندی‌ها</div></div>
      `;

      const myProps = document.getElementById('advisorProperties');
      myProps.innerHTML = properties.map(p => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span><strong>${p.title}</strong> - ${p.type}</span>
          <span style="color:var(--text-muted);">${p.views || 0} بازدید</span>
        </div>
      `).join('');

      const viewsDiv = document.getElementById('recentViews');
      const sorted = [...properties].sort((a, b) => (b.views || 0) - (a.views || 0));
      viewsDiv.innerHTML = sorted.slice(0, 5).map((p, i) => `
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);font-size:0.85rem;">
          <span>${i+1}. ${p.title}</span>
          <span style="color:var(--accent);">${p.views || 0} بازدید</span>
        </div>
      `).join('');
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderProperties();
    renderFavorites();
    renderCompare();
    renderAdvisor();

    console.log('✅ سیستم مدیریت املاک کامل بارگذاری شد!');
  </script>
</body>
</html>
