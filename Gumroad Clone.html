<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم فروش فایل‌های دیجیتال | Gumroad Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #e74c3c;
      --accent-hover: #c0392b;
      --success: #27ae60;
      --warning: #f39c12;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:1px solid var(--border-color);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header-actions {
      display:flex; gap:16px; align-items:center;
    }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-actions .cart-badge {
      position:relative;
    }
    .header-actions .cart-badge::after {
      content:attr(data-count); position:absolute; top:-6px; right:-8px;
      background:var(--accent); color:#fff; font-size:0.5rem;
      padding:1px 5px; border-radius:50%; font-weight:700;
    }
    body.ltr .header-actions .cart-badge::after { right:auto; left:-8px; }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های محصول ===== */
    .product-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .product-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
      cursor:pointer;
    }
    .product-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .product-card .image {
      height:160px; background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2.5rem;
    }
    .product-card .image img { width:100%; height:100%; object-fit:cover; }
    .product-card .content { padding:14px; }
    .product-card .content .title { font-size:1rem; font-weight:700; }
    .product-card .content .desc {
      font-size:0.85rem; color:var(--text-secondary);
      margin:4px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .product-card .content .price { font-size:1.2rem; font-weight:700; color:var(--accent); }
    .product-card .content .price span { font-size:0.7rem; font-weight:400; color:var(--text-muted); }
    .product-card .content .meta {
      display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border-color); padding-top:10px;
      font-size:0.8rem; color:var(--text-muted);
    }
    .product-card .content .meta .sales { display:flex; align-items:center; gap:4px; }
    .product-card .content .add-btn {
      padding:4px 16px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; cursor:pointer; font-weight:600;
      transition:var(--transition);
    }
    .product-card .content .add-btn:hover { background:var(--accent-hover); }
    .product-card .content .add-btn.in-cart { background:var(--success); }

    /* ===== فرم آپلود ===== */
    .upload-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .upload-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .upload-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .upload-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }
    .form-actions .btn-secondary:hover { background:var(--border-color); }

    /* ===== سبد خرید ===== */
    .cart-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px; border-bottom:1px solid var(--border-color);
    }
    .cart-item:last-child { border-bottom:none; }
    .cart-item .info .name { font-weight:600; }
    .cart-item .info .price { color:var(--text-muted); font-size:0.85rem; }
    .cart-item .remove-btn {
      padding:4px 12px; background:var(--danger); color:#fff;
      border:none; border-radius:6px; cursor:pointer; font-size:0.75rem;
      transition:var(--transition);
    }
    .cart-item .remove-btn:hover { opacity:0.8; }
    .cart-total {
      padding:12px; font-size:1.1rem; font-weight:700;
      border-top:2px solid var(--border-color);
      display:flex; justify-content:space-between; align-items:center;
    }
    .cart-total .checkout-btn {
      padding:8px 24px; background:var(--success); color:#fff;
      border:none; border-radius:8px; font-weight:600; cursor:pointer;
      transition:var(--transition);
    }
    .cart-total .checkout-btn:hover { opacity:0.8; }
    .cart-empty {
      text-align:center; padding:40px; color:var(--text-muted);
    }
    .cart-empty i { font-size:3rem; opacity:0.3; }

    /* ===== پنل فروشنده ===== */
    .seller-stats {
      display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;
    }
    .seller-stat {
      background:var(--bg-card); border-radius:var(--radius);
      padding:16px; text-align:center; border:1px solid var(--border-color);
    }
    .seller-stat .number { font-size:1.8rem; font-weight:700; color:var(--accent); }
    .seller-stat .label { font-size:0.85rem; color:var(--text-muted); }

    .seller-product-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid var(--border-color);
    }
    .seller-product-item:last-child { border-bottom:none; }
    .seller-product-item .info .name { font-weight:600; }
    .seller-product-item .info .sales { font-size:0.8rem; color:var(--text-muted); }
    .seller-product-item .actions button {
      padding:4px 12px; border:none; border-radius:6px; cursor:pointer;
      font-size:0.75rem; transition:var(--transition); margin-right:4px;
    }
    .seller-product-item .actions .edit-btn { background:var(--warning); color:#fff; }
    .seller-product-item .actions .edit-btn:hover { opacity:0.8; }
    .seller-product-item .actions .delete-btn { background:var(--danger); color:#fff; }
    .seller-product-item .actions .delete-btn:hover { opacity:0.8; }

    /* ===== نظرات ===== */
    .review-item {
      padding:10px 12px; border-bottom:1px solid var(--border-color);
    }
    .review-item:last-child { border-bottom:none; }
    .review-item .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px;
    }
    .review-item .header .user { font-weight:600; font-size:0.9rem; }
    .review-item .header .rating { color:var(--warning); }
    .review-item .header .time { font-size:0.7rem; color:var(--text-muted); }
    .review-item .text { font-size:0.9rem; color:var(--text-secondary); }

    /* ===== مودال پرداخت ===== */
    .modal-overlay {
      display:none; position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.5); z-index:9998; align-items:center; justify-content:center;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      background:var(--bg-card); border-radius:var(--radius); padding:24px;
      max-width:400px; width:90%; max-height:80vh; overflow-y:auto;
      animation:modalIn 0.3s ease;
    }
    @keyframes modalIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    .modal h3 { margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
    .modal .close { cursor:pointer; font-size:1.2rem; color:var(--text-muted); }
    .modal .close:hover { color:var(--danger); }
    .modal .form-group { margin-bottom:12px; }
    .modal .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .modal .form-group input {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
    }
    .modal .form-group input:focus { border-color:var(--accent); outline:none; }
    .modal .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .modal .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .modal .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .modal .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .modal .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .upload-grid { grid-template-columns:1fr; }
      .upload-grid .full { grid-column:1; }
      .seller-stats { grid-template-columns:repeat(2,1fr); }
      .product-grid { grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .seller-stats { grid-template-columns:1fr; }
      .cart-item { flex-direction:column; align-items:stretch; gap:6px; text-align:center; }
      .cart-total { flex-direction:column; gap:10px; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .product-grid { grid-template-columns:1fr; }
    }

    body.ltr { direction:ltr; text-align:left; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-store"></i> <span id="brandName">فایل‌فروش</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('products')" data-key="navProducts">محصولات</a>
      <a onclick="showTab('upload')" data-key="navUpload">آپلود</a>
      <a onclick="showTab('seller')" data-key="navSeller">پنل فروشنده</a>
    </div>
    <div class="header-actions">
      <div class="cart-badge" data-count="0" onclick="showTab('cart')">
        <i class="fas fa-shopping-cart"></i>
      </div>
      <i class="fas fa-heart" onclick="showNotification('علاقه‌مندی‌ها ❤️')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب محصولات ===== -->
    <div class="tab-content active" id="tab-products">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-box" style="color:var(--accent);"></i> <span data-key="productsTitle">محصولات دیجیتال</span></h2>
        <button onclick="showTab('upload')" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="uploadBtn">+ آپلود فایل</button>
      </div>
      <div class="product-grid" id="productGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب آپلود ===== -->
    <div class="tab-content" id="tab-upload">
      <div class="upload-section">
        <h2><i class="fas fa-upload" style="color:var(--accent);"></i> <span data-key="uploadTitle">آپلود فایل جدید</span></h2>
        <div class="upload-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان فایل</label>
            <input type="text" id="fileTitle" placeholder="عنوان ...">
          </div>
          <div class="form-group">
            <label data-key="lblPrice">قیمت (تومان)</label>
            <input type="number" id="filePrice" placeholder="۰">
          </div>
          <div class="form-group">
            <label data-key="lblCategory">دسته‌بندی</label>
            <select id="fileCategory">
              <option value="کتاب">کتاب</option>
              <option value="نرم‌افزار">نرم‌افزار</option>
              <option value="قالب">قالب</option>
              <option value="آموزش">آموزش</option>
              <option value="موسیقی">موسیقی</option>
              <option value="تصویر">تصویر</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblFile">فایل</label>
            <input type="text" id="fileUrl" placeholder="لینک دانلود فایل ...">
          </div>
          <div class="form-group full">
            <label data-key="lblDesc">توضیحات</label>
            <textarea id="fileDescription" placeholder="توضیحات کامل فایل ..."></textarea>
          </div>
          <div class="form-group full">
            <label data-key="lblImage">آدرس تصویر</label>
            <input type="text" id="fileImage" placeholder="آدرس تصویر محصول ...">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="uploadFile()" data-key="saveBtn">آپلود فایل</button>
          <button class="btn-secondary" onclick="clearUploadForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب سبد خرید ===== -->
    <div class="tab-content" id="tab-cart">
      <h2 style="margin-bottom:16px;"><i class="fas fa-shopping-cart" style="color:var(--accent);"></i> <span data-key="cartTitle">سبد خرید</span></h2>
      <div id="cartContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب پنل فروشنده ===== -->
    <div class="tab-content" id="tab-seller">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="sellerTitle">پنل فروشنده</span></h2>
      <div class="seller-stats" id="sellerStats">
        <!-- توسط JS ساخته می‌شود -->
      </div>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-box"></i> <span data-key="myProducts">محصولات من</span></h4>
        <div id="sellerProducts">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
      <div style="margin-top:16px;background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-comment"></i> <span data-key="reviewsTitle">نظرات</span></h4>
        <div id="reviewsContainer">
          <!-- توسط JS ساخته می‌شود -->
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
          <input type="text" id="reviewName" placeholder="نام شما ..." style="flex:1;min-width:100px;padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
          <select id="reviewRating" style="padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
            <option value="5">⭐</option>
            <option value="4">⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐⭐⭐</option>
            <option value="1">⭐⭐⭐⭐⭐</option>
          </select>
          <input type="text" id="reviewText" placeholder="متن نظر ..." style="flex:2;min-width:150px;padding:6px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
          <button onclick="addReview()" style="padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">ثبت نظر</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ===== مودال پرداخت ===== -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal">
      <h3><span data-key="checkoutTitle">تأیید خرید</span> <span class="close" onclick="closeModal('checkoutModal')">&times;</span></h3>
      <div id="checkoutSummary"></div>
      <div class="form-group">
        <label data-key="lblName">نام کامل</label>
        <input type="text" id="checkoutName" placeholder="نام و نام خانوادگی ...">
      </div>
      <div class="form-group">
        <label data-key="lblEmail">ایمیل</label>
        <input type="email" id="checkoutEmail" placeholder="ایمیل ...">
      </div>
      <div class="form-group">
        <label data-key="lblCard">شماره کارت</label>
        <input type="text" id="checkoutCard" placeholder="****-****-****-****">
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeModal('checkoutModal')" data-key="cancelBtn">انصراف</button>
        <button class="btn-primary" onclick="processPayment()" data-key="payBtn">پرداخت</button>
      </div>
    </div>
  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'فایل‌فروش',
        navProducts: 'محصولات',
        navUpload: 'آپلود',
        navSeller: 'پنل فروشنده',
        productsTitle: 'محصولات دیجیتال',
        uploadBtn: '+ آپلود فایل',
        uploadTitle: 'آپلود فایل جدید',
        lblTitle: 'عنوان فایل',
        lblPrice: 'قیمت (تومان)',
        lblCategory: 'دسته‌بندی',
        lblFile: 'فایل',
        lblDesc: 'توضیحات',
        lblImage: 'آدرس تصویر',
        saveBtn: 'آپلود فایل',
        cancelBtn: 'انصراف',
        cartTitle: 'سبد خرید',
        sellerTitle: 'پنل فروشنده',
        myProducts: 'محصولات من',
        reviewsTitle: 'نظرات',
        checkoutTitle: 'تأیید خرید',
        lblName: 'نام کامل',
        lblEmail: 'ایمیل',
        lblCard: 'شماره کارت',
        payBtn: 'پرداخت',
        emptyCart: 'سبد خرید خالی است',
        total: 'مجموع'
      },
      en: {
        brandName: 'FileShop',
        navProducts: 'Products',
        navUpload: 'Upload',
        navSeller: 'Seller Panel',
        productsTitle: 'Digital Products',
        uploadBtn: '+ Upload File',
        uploadTitle: 'Upload New File',
        lblTitle: 'File Title',
        lblPrice: 'Price (USD)',
        lblCategory: 'Category',
        lblFile: 'File',
        lblDesc: 'Description',
        lblImage: 'Image URL',
        saveBtn: 'Upload File',
        cancelBtn: 'Cancel',
        cartTitle: 'Shopping Cart',
        sellerTitle: 'Seller Panel',
        myProducts: 'My Products',
        reviewsTitle: 'Reviews',
        checkoutTitle: 'Confirm Purchase',
        lblName: 'Full Name',
        lblEmail: 'Email',
        lblCard: 'Card Number',
        payBtn: 'Pay',
        emptyCart: 'Cart is empty',
        total: 'Total'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let products = [];
    let cart = [];
    let sales = [];
    let reviews = [];
    let nextProductId = 1;
    let nextReviewId = 1;

    // داده‌های نمونه
    function initSampleData() {
      products = [
        { id: 1, title: 'قالب وردپرس حرفه‌ای', price: 250000, category: 'قالب', description: 'قالب کامل و ریسپانسیو وردپرس مناسب برای سایت‌های شرکتی', fileUrl: 'https://example.com/wp-theme.zip', image: '🎨', sales: 24 },
        { id: 2, title: 'کتاب آموزش پایتون', price: 150000, category: 'کتاب', description: 'کامل‌ترین کتاب آموزش پایتون از مبتدی تا پیشرفته', fileUrl: 'https://example.com/python-book.pdf', image: '📚', sales: 56 },
        { id: 3, title: 'نرم‌افزار ویرایش عکس', price: 350000, category: 'نرم‌افزار', description: 'نرم‌افزار حرفه‌ای ویرایش عکس با قابلیت‌های پیشرفته', fileUrl: 'https://example.com/photo-editor.exe', image: '🖼️', sales: 12 }
      ];

      reviews = [
        { id: 1, productId: 1, user: 'علی رضایی', rating: 5, text: 'قالب بسیار عالی و پشتیبانی خوب', time: '۲ هفته پیش' },
        { id: 2, productId: 2, user: 'سارا محمدی', rating: 4, text: 'کتاب خوبی بود، اما می‌توانست کامل‌تر باشد', time: '۱ ماه پیش' }
      ];

      nextProductId = 4;
      nextReviewId = 3;
    }

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { products: 0, upload: 1, seller: 2 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'products') renderProducts();
      if (tabName === 'cart') renderCart();
      if (tabName === 'seller') renderSellerPanel();
    }

    // ===== رندر محصولات =====
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      if (products.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هیچ محصولی موجود نیست.</p>';
        return;
      }
      grid.innerHTML = products.map(p => {
        const inCart = cart.some(c => c.id === p.id);
        return `
          <div class="product-card">
            <div class="image">${p.image || '📁'}</div>
            <div class="content">
              <div class="title">${p.title}</div>
              <div class="desc">${p.description}</div>
              <div class="price">${p.price.toLocaleString()} <span>تومان</span></div>
              <div class="meta">
                <span class="sales"><i class="fas fa-download"></i> ${p.sales || 0} فروش</span>
                <button class="add-btn ${inCart ? 'in-cart' : ''}" onclick="toggleCart(${p.id})">
                  ${inCart ? '✓ در سبد' : 'افزودن به سبد'}
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== سبد خرید =====
    function toggleCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      const index = cart.findIndex(c => c.id === productId);
      if (index > -1) {
        cart.splice(index, 1);
        showNotification(`${product.title} از سبد خرید حذف شد`);
      } else {
        cart.push({ ...product });
        showNotification(`${product.title} به سبد خرید اضافه شد ✅`);
      }
      updateCartBadge();
      renderProducts();
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cartContainer');
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <i class="fas fa-shopping-cart"></i>
            <p data-key="emptyCart">سبد خرید خالی است</p>
          </div>
        `;
        return;
      }
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      container.innerHTML = `
        ${cart.map(item => `
          <div class="cart-item">
            <div class="info">
              <div class="name">${item.title}</div>
              <div class="price">${item.price.toLocaleString()} تومان</div>
            </div>
            <button class="remove-btn" onclick="toggleCart(${item.id})">حذف</button>
          </div>
        `).join('')}
        <div class="cart-total">
          <span><span data-key="total">مجموع</span>: ${total.toLocaleString()} تومان</span>
          <button class="checkout-btn" onclick="openCheckout()">پرداخت</button>
        </div>
      `;
    }

    function updateCartBadge() {
      const badge = document.querySelector('.cart-badge');
      if (badge) badge.setAttribute('data-count', cart.length);
    }

    // ===== آپلود فایل =====
    function uploadFile() {
      const title = document.getElementById('fileTitle').value.trim();
      const price = parseInt(document.getElementById('filePrice').value);
      const category = document.getElementById('fileCategory').value;
      const fileUrl = document.getElementById('fileUrl').value.trim();
      const description = document.getElementById('fileDescription').value.trim();
      const image = document.getElementById('fileImage').value.trim() || '📁';

      if (!title || !price || !fileUrl || !description) {
        showNotification('❌ لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      products.push({
        id: nextProductId++,
        title,
        price,
        category,
        description,
        fileUrl,
        image,
        sales: 0
      });

      clearUploadForm();
      renderProducts();
      renderSellerPanel();
      showNotification('✅ فایل با موفقیت آپلود شد!');
      showTab('products');
    }

    function clearUploadForm() {
      document.getElementById('fileTitle').value = '';
      document.getElementById('filePrice').value = '';
      document.getElementById('fileUrl').value = '';
      document.getElementById('fileDescription').value = '';
      document.getElementById('fileImage').value = '';
    }

    // ===== پرداخت =====
    function openCheckout() {
      if (cart.length === 0) {
        showNotification('❌ سبد خرید خالی است!');
        return;
      }
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('checkoutSummary').innerHTML = `
        <div style="margin-bottom:12px;">
          ${cart.map(item => `
            <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-color);">
              <span>${item.title}</span>
              <span>${item.price.toLocaleString()} تومان</span>
            </div>
          `).join('')}
          <div style="display:flex;justify-content:space-between;padding:8px 0;font-weight:700;font-size:1.1rem;border-top:2px solid var(--border-color);">
            <span data-key="total">مجموع</span>
            <span>${total.toLocaleString()} تومان</span>
          </div>
        </div>
      `;
      document.getElementById('checkoutModal').classList.add('show');
    }

    function processPayment() {
      const name = document.getElementById('checkoutName').value.trim();
      const email = document.getElementById('checkoutEmail').value.trim();
      const card = document.getElementById('checkoutCard').value.trim();

      if (!name || !email || !card) {
        showNotification('❌ لطفاً تمام اطلاعات را وارد کنید!');
        return;
      }

      // ثبت فروش
      cart.forEach(item => {
        const product = products.find(p => p.id === item.id);
        if (product) {
          product.sales = (product.sales || 0) + 1;
          sales.push({
            id: sales.length + 1,
            productId: item.id,
            title: item.title,
            price: item.price,
            buyer: name,
            email: email,
            date: new Date().toLocaleDateString('fa-IR')
          });
        }
      });

      // دانلود فایل‌ها
      cart.forEach(item => {
        const product = products.find(p => p.id === item.id);
        if (product) {
          showNotification(`📥 دانلود ${product.title} شروع شد`);
          // شبیه‌سازی دانلود
          setTimeout(() => {
            showNotification(`✅ دانلود ${product.title} کامل شد!`);
          }, 1500);
        }
      });

      cart = [];
      updateCartBadge();
      closeModal('checkoutModal');
      renderProducts();
      renderCart();
      renderSellerPanel();
      showNotification('🎉 پرداخت با موفقیت انجام شد! فایل‌ها در حال دانلود هستند.');
    }

    // ===== پنل فروشنده =====
    function renderSellerPanel() {
      const totalProducts = products.length;
      const totalSales = products.reduce((sum, p) => sum + (p.sales || 0), 0);
      const totalRevenue = products.reduce((sum, p) => sum + (p.sales || 0) * p.price, 0);

      document.getElementById('sellerStats').innerHTML = `
        <div class="seller-stat"><div class="number">${totalProducts}</div><div class="label">کل محصولات</div></div>
        <div class="seller-stat"><div class="number">${totalSales}</div><div class="label">کل فروش</div></div>
        <div class="seller-stat"><div class="number">${totalRevenue.toLocaleString()}</div><div class="label">درآمد کل (تومان)</div></div>
        <div class="seller-stat"><div class="number">${reviews.length}</div><div class="label">نظرات</div></div>
      `;

      const container = document.getElementById('sellerProducts');
      if (products.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">هیچ محصولی آپلود نشده است.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="seller-product-item">
          <div class="info">
            <div class="name">${p.title}</div>
            <div class="sales">${p.sales || 0} فروش · ${p.price.toLocaleString()} تومان</div>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
            <button class="delete-btn" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `).join('');

      // نظرات
      const reviewContainer = document.getElementById('reviewsContainer');
      if (reviews.length === 0) {
        reviewContainer.innerHTML = '<p style="color:var(--text-muted);">هنوز نظری ثبت نشده است.</p>';
        return;
      }
      reviewContainer.innerHTML = reviews.map(r => {
        const product = products.find(p => p.id === r.productId);
        return `
          <div class="review-item">
            <div class="header">
              <span class="user">${r.user}</span>
              <span class="rating">${'⭐'.repeat(r.rating)}</span>
              <span class="time">${r.time}</span>
            </div>
            <div class="text">${r.text} ${product ? `(${product.title})` : ''}</div>
          </div>
        `;
      }).join('');
    }

    // ===== ویرایش محصول =====
    function editProduct(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;
      const newTitle = prompt('عنوان جدید:', product.title);
      if (newTitle && newTitle.trim()) product.title = newTitle.trim();
      const newPrice = prompt('قیمت جدید:', product.price);
      if (newPrice && !isNaN(newPrice)) product.price = parseInt(newPrice);
      renderProducts();
      renderSellerPanel();
      showNotification('✅ محصول به‌روزرسانی شد!');
    }

    // ===== حذف محصول =====
    function deleteProduct(productId) {
      if (confirm('آیا از حذف این محصول اطمینان دارید؟')) {
        products = products.filter(p => p.id !== productId);
        cart = cart.filter(c => c.id !== productId);
        updateCartBadge();
        renderProducts();
        renderCart();
        renderSellerPanel();
        showNotification('🗑️ محصول حذف شد');
      }
    }

    // ===== افزودن نظر =====
    function addReview() {
      const name = document.getElementById('reviewName').value.trim() || 'کاربر مهمان';
      const rating = parseInt(document.getElementById('reviewRating').value);
      const text = document.getElementById('reviewText').value.trim();
      if (!text) { showNotification('لطفاً متن نظر را وارد کنید!'); return; }

      // انتخاب محصول تصادفی برای نظر
      const randomProduct = products.length > 0 ? products[Math.floor(Math.random() * products.length)] : null;

      reviews.push({
        id: nextReviewId++,
        productId: randomProduct ? randomProduct.id : null,
        user: name,
        rating: rating,
        text: text,
        time: 'همین الان'
      });

      document.getElementById('reviewText').value = '';
      renderSellerPanel();
      showNotification('✅ نظر شما با موفقیت ثبت شد!');
    }

    // ===== مودال =====
    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', function(e) {
        if (e.target === this) this.classList.remove('show');
      });
    });

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderProducts();
    renderCart();
    renderSellerPanel();
    updateCartBadge();

    console.log('✅ پلتفرم فروش فایل‌های دیجیتال کامل بارگذاری شد!');
  </script>
</body>
</html>
