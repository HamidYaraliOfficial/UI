<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت رویدادها | کامل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f2f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:2px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header-actions { display:flex; gap:16px; align-items:center; }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== کارت‌های رویداد ===== */
    .event-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .event-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
      cursor:pointer;
    }
    .event-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .event-card .image {
      height:160px; background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2.5rem; position:relative;
    }
    .event-card .image .date-badge {
      position:absolute; top:12px; right:12px;
      background:rgba(0,0,0,0.7); color:#fff; padding:4px 12px;
      border-radius:50px; font-size:0.7rem; font-weight:600;
    }
    body.ltr .event-card .image .date-badge { right:auto; left:12px; }
    .event-card .image .capacity-badge {
      position:absolute; bottom:12px; right:12px;
      background:rgba(0,0,0,0.7); color:#fff; padding:4px 12px;
      border-radius:50px; font-size:0.65rem;
    }
    body.ltr .event-card .image .capacity-badge { right:auto; left:12px; }
    .event-card .content { padding:14px; }
    .event-card .content .title { font-size:1rem; font-weight:700; }
    .event-card .content .location { font-size:0.85rem; color:var(--text-muted); }
    .event-card .content .desc {
      font-size:0.85rem; color:var(--text-secondary);
      margin:6px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .event-card .content .meta {
      display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border-color); padding-top:10px;
      font-size:0.8rem; color:var(--text-muted);
    }
    .event-card .content .meta .status {
      padding:2px 12px; border-radius:50px; font-size:0.65rem; font-weight:600;
    }
    .event-card .content .meta .status.upcoming { background:rgba(99,102,241,0.15); color:var(--accent); }
    .event-card .content .meta .status.ongoing { background:rgba(16,185,129,0.15); color:var(--success); }
    .event-card .content .meta .status.past { background:rgba(239,68,68,0.15); color:var(--danger); }

    /* ===== فرم ===== */
    .form-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .form-section h2 { margin-bottom:16px; display:flex; align-items:center; gap:10px; }
    .form-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    .form-grid .full { grid-column:1/-1; }
    .form-group { margin-bottom:4px; }
    .form-group label { display:block; font-size:0.85rem; font-weight:500; margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--accent); outline:none;
    }
    .form-group textarea { resize:vertical; min-height:80px; }
    .form-actions { display:flex; gap:10px; margin-top:16px; }
    .form-actions button {
      padding:8px 24px; border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .form-actions .btn-primary { background:var(--accent); color:#fff; }
    .form-actions .btn-primary:hover { background:var(--accent-hover); }
    .form-actions .btn-secondary { background:var(--bg-primary); color:var(--text-secondary); }
    .form-actions .btn-secondary:hover { background:var(--border-color); }

    /* ===== تقویم ===== */
    .calendar-container {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
    }
    .calendar-header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:16px;
    }
    .calendar-header h3 { font-size:1.2rem; }
    .calendar-header .nav-btn {
      padding:6px 14px; background:var(--bg-primary); border:none;
      border-radius:8px; cursor:pointer; font-size:0.85rem;
      transition:var(--transition); color:var(--text-primary);
    }
    .calendar-header .nav-btn:hover { background:var(--border-color); }
    .calendar-grid {
      display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    }
    .calendar-grid .day-name {
      text-align:center; font-weight:600; font-size:0.8rem;
      color:var(--text-muted); padding:6px 0;
    }
    .calendar-grid .day {
      text-align:center; padding:8px 0; border-radius:8px;
      font-size:0.85rem; transition:var(--transition);
      cursor:pointer; min-height:50px; position:relative;
    }
    .calendar-grid .day:hover { background:var(--bg-primary); }
    .calendar-grid .day.other-month { color:var(--text-muted); opacity:0.5; }
    .calendar-grid .day.today { border:2px solid var(--accent); }
    .calendar-grid .day.has-event::after {
      content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
      width:6px; height:6px; border-radius:50%; background:var(--accent);
    }
    .calendar-grid .day .event-indicator {
      font-size:0.5rem; color:var(--accent); display:block; margin-top:2px;
    }
    .calendar-grid .day .event-count {
      position:absolute; top:2px; right:2px;
      background:var(--accent); color:#fff; border-radius:50%;
      width:18px; height:18px; font-size:0.55rem;
      display:flex; align-items:center; justify-content:center;
    }
    body.ltr .calendar-grid .day .event-count { right:auto; left:2px; }

    /* ===== گالری ===== */
    .gallery-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
      gap:12px;
    }
    .gallery-item {
      aspect-ratio:1; border-radius:var(--radius);
      background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:2rem; cursor:pointer;
      transition:var(--transition); position:relative;
    }
    .gallery-item:hover { transform:scale(1.03); box-shadow:var(--shadow-hover); }
    .gallery-item .remove {
      position:absolute; top:4px; right:4px;
      background:rgba(0,0,0,0.6); color:#fff; border:none;
      border-radius:50%; width:24px; height:24px;
      cursor:pointer; font-size:0.7rem;
    }
    body.ltr .gallery-item .remove { right:auto; left:4px; }
    .gallery-item .remove:hover { background:var(--danger); }

    /* ===== لیست ثبت‌نام‌ها ===== */
    .registrant-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 12px; border-bottom:1px solid var(--border-color);
    }
    .registrant-item:last-child { border-bottom:none; }
    .registrant-item .info .name { font-weight:600; }
    .registrant-item .info .contact { font-size:0.8rem; color:var(--text-muted); }
    .registrant-item .status-badge {
      padding:2px 12px; border-radius:50px; font-size:0.65rem; font-weight:600;
    }
    .registrant-item .status-badge.confirmed { background:rgba(16,185,129,0.15); color:var(--success); }
    .registrant-item .status-badge.pending { background:rgba(245,158,11,0.15); color:var(--warning); }
    .registrant-item .status-badge.cancelled { background:rgba(239,68,68,0.15); color:var(--danger); }

    /* ===== یادآوری ===== */
    .reminder-item {
      display:flex; align-items:center; gap:12px;
      padding:8px 12px; background:var(--bg-primary);
      border-radius:8px; margin-bottom:6px;
    }
    .reminder-item .icon { color:var(--warning); font-size:1.2rem; }
    .reminder-item .text { flex:1; font-size:0.85rem; }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .form-grid { grid-template-columns:1fr; }
      .form-grid .full { grid-column:1; }
      .event-grid { grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
      .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .calendar-grid .day { font-size:0.75rem; padding:4px 0; min-height:36px; }
      .calendar-header h3 { font-size:1rem; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
      .event-grid { grid-template-columns:1fr; }
      .gallery-grid { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); }
    }

    body.ltr { direction:ltr; text-align:left; }
    body.ltr .calendar-grid .day .event-count { right:auto; left:2px; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-calendar-alt"></i> <span id="brandName">رویدادساز</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('events')" data-key="navEvents">رویدادها</a>
      <a onclick="showTab('calendar')" data-key="navCalendar">تقویم</a>
      <a onclick="showTab('gallery')" data-key="navGallery">گالری</a>
      <a onclick="showTab('admin')" data-key="navAdmin">داشبورد مدیریت</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showReminders()"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب رویدادها ===== -->
    <div class="tab-content active" id="tab-events">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-calendar-plus" style="color:var(--accent);"></i> <span data-key="eventsTitle">رویدادها</span></h2>
        <button onclick="showTab('create')" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="createEvent">+ ایجاد رویداد</button>
      </div>
      <div class="event-grid" id="eventGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب ایجاد رویداد ===== -->
    <div class="tab-content" id="tab-create">
      <div class="form-section">
        <h2><i class="fas fa-plus-circle" style="color:var(--accent);"></i> <span data-key="createEventTitle">ایجاد رویداد جدید</span></h2>
        <div class="form-grid">
          <div class="form-group">
            <label data-key="lblTitle">عنوان رویداد</label>
            <input type="text" id="eventTitle" placeholder="عنوان ...">
          </div>
          <div class="form-group">
            <label data-key="lblCategory">دسته‌بندی</label>
            <select id="eventCategory">
              <option value="کنفرانس">کنفرانس</option>
              <option value="کارگاه">کارگاه</option>
              <option value="سمینار">سمینار</option>
              <option value="جشنواره">جشنواره</option>
              <option value="ورزشی">ورزشی</option>
              <option value="فرهنگی">فرهنگی</option>
            </select>
          </div>
          <div class="form-group">
            <label data-key="lblDate">تاریخ</label>
            <input type="date" id="eventDate">
          </div>
          <div class="form-group">
            <label data-key="lblTime">زمان</label>
            <input type="time" id="eventTime">
          </div>
          <div class="form-group">
            <label data-key="lblLocation">مکان</label>
            <input type="text" id="eventLocation" placeholder="آدرس ...">
          </div>
          <div class="form-group">
            <label data-key="lblCapacity">ظرفیت</label>
            <input type="number" id="eventCapacity" placeholder="تعداد نفرات ...">
          </div>
          <div class="form-group full">
            <label data-key="lblDescription">توضیحات</label>
            <textarea id="eventDescription" placeholder="توضیحات کامل رویداد ..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="createEvent()" data-key="saveBtn">ذخیره رویداد</button>
          <button class="btn-secondary" onclick="clearForm()" data-key="cancelBtn">انصراف</button>
        </div>
      </div>
    </div>

    <!-- ===== تب تقویم ===== -->
    <div class="tab-content" id="tab-calendar">
      <div class="calendar-container">
        <div class="calendar-header">
          <button class="nav-btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-right"></i></button>
          <h3 id="calendarMonth">مهر ۱۴۰۵</h3>
          <button class="nav-btn" onclick="changeMonth(1)"><i class="fas fa-chevron-left"></i></button>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
      <div style="margin-top:16px;background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:8px;">📌 رویدادهای این ماه</h4>
        <div id="monthEvents"></div>
      </div>
    </div>

    <!-- ===== تب گالری ===== -->
    <div class="tab-content" id="tab-gallery">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <h2><i class="fas fa-images" style="color:var(--accent);"></i> <span data-key="galleryTitle">گالری تصاویر</span></h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" id="galleryImageUrl" placeholder="آدرس تصویر ..." style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);min-width:200px;">
          <button onclick="addGalleryImage()" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:var(--transition);" onmouseover="this.style.background='var(--accent-hover)'" onmouseout="this.style.background='var(--accent)'" data-key="addImage">+ افزودن</button>
        </div>
      </div>
      <div class="gallery-grid" id="galleryGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب داشبورد مدیریت ===== -->
    <div class="tab-content" id="tab-admin">
      <h2 style="margin-bottom:16px;"><i class="fas fa-chart-bar" style="color:var(--accent);"></i> <span data-key="adminTitle">داشبورد مدیریت</span></h2>

      <!-- آمار -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;">
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:2rem;font-weight:700;color:var(--accent);" id="statTotal">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="statTotalEvents">کل رویدادها</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:2rem;font-weight:700;color:var(--success);" id="statRegistrants">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="statRegistrants">کل ثبت‌نام‌ها</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:2rem;font-weight:700;color:var(--warning);" id="statUpcoming">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="statUpcoming">رویدادهای آینده</div>
        </div>
        <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--border-color);">
          <div style="font-size:2rem;font-weight:700;color:var(--danger);" id="statPast">۰</div>
          <div style="font-size:0.85rem;color:var(--text-muted);" data-key="statPast">رویدادهای گذشته</div>
        </div>
      </div>

      <!-- لیست ثبت‌نام‌ها -->
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:16px;border:1px solid var(--border-color);">
        <h4 style="margin-bottom:12px;"><i class="fas fa-users" style="color:var(--accent);"></i> <span data-key="registrantsTitle">لیست ثبت‌نام‌ها</span></h4>
        <div id="registrantsList">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'رویدادساز',
        navEvents: 'رویدادها',
        navCalendar: 'تقویم',
        navGallery: 'گالری',
        navAdmin: 'داشبورد مدیریت',
        eventsTitle: 'رویدادها',
        createEvent: '+ ایجاد رویداد',
        createEventTitle: 'ایجاد رویداد جدید',
        lblTitle: 'عنوان رویداد',
        lblCategory: 'دسته‌بندی',
        lblDate: 'تاریخ',
        lblTime: 'زمان',
        lblLocation: 'مکان',
        lblCapacity: 'ظرفیت',
        lblDescription: 'توضیحات',
        saveBtn: 'ذخیره رویداد',
        cancelBtn: 'انصراف',
        galleryTitle: 'گالری تصاویر',
        addImage: '+ افزودن',
        adminTitle: 'داشبورد مدیریت',
        statTotalEvents: 'کل رویدادها',
        statRegistrants: 'کل ثبت‌نام‌ها',
        statUpcoming: 'رویدادهای آینده',
        statPast: 'رویدادهای گذشته',
        registrantsTitle: 'لیست ثبت‌نام‌ها',
        register: 'ثبت‌نام',
        registered: 'ثبت‌نام شده',
        full: 'تکمیل',
        viewEvent: 'مشاهده رویداد',
        sendReminder: 'ارسال یادآوری'
      },
      en: {
        brandName: 'EventMaker',
        navEvents: 'Events',
        navCalendar: 'Calendar',
        navGallery: 'Gallery',
        navAdmin: 'Admin Dashboard',
        eventsTitle: 'Events',
        createEvent: '+ Create Event',
        createEventTitle: 'Create New Event',
        lblTitle: 'Event Title',
        lblCategory: 'Category',
        lblDate: 'Date',
        lblTime: 'Time',
        lblLocation: 'Location',
        lblCapacity: 'Capacity',
        lblDescription: 'Description',
        saveBtn: 'Save Event',
        cancelBtn: 'Cancel',
        galleryTitle: 'Image Gallery',
        addImage: '+ Add',
        adminTitle: 'Admin Dashboard',
        statTotalEvents: 'Total Events',
        statRegistrants: 'Total Registrants',
        statUpcoming: 'Upcoming Events',
        statPast: 'Past Events',
        registrantsTitle: 'Registrants List',
        register: 'Register',
        registered: 'Registered',
        full: 'Full',
        viewEvent: 'View Event',
        sendReminder: 'Send Reminder'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let events = [];
    let registrants = [];
    let galleryImages = [];
    let nextEventId = 1;
    let nextRegistrantId = 1;
    let nextImageId = 1;
    let reminders = [];
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    // داده‌های نمونه
    function initSampleData() {
      const today = new Date();
      const dateStr = today.toISOString().split('T')[0];
      const nextMonth = new Date(today);
      nextMonth.setMonth(nextMonth.getMonth() + 1);
      const nextMonthStr = nextMonth.toISOString().split('T')[0];

      events = [
        { id: 1, title: 'کنفرانس بین‌المللی فناوری', category: 'کنفرانس', date: nextMonthStr, time: '۱۰:۰۰', location: 'تهران، سالن همایش‌های بین‌المللی', capacity: 200, description: 'بزرگترین رویداد فناوری با حضور برترین شرکت‌ها و متخصصان', registrants: [] },
        { id: 2, title: 'کارگاه برنامه‌نویسی React', category: 'کارگاه', date: dateStr, time: '۱۴:۰۰', location: 'اصفهان، مرکز آموزش فناوری', capacity: 50, description: 'کارگاه دو روزه آموزش React.js از مبتدی تا پیشرفته', registrants: [] },
        { id: 3, title: 'جشنواره فیلم کوتاه', category: 'جشنواره', date: nextMonthStr, time: '۱۸:۰۰', location: 'شیراز، سینما هنر', capacity: 300, description: 'نمایش بهترین فیلم‌های کوتاه سال با حضور کارگردانان', registrants: [] }
      ];

      registrants = [
        { id: 1, eventId: 1, name: 'علی رضایی', email: 'ali@email.com', phone: '۰۹۱۲۱۲۳۴۵۶۷', status: 'confirmed', date: '۱۴۰۵/۰۲/۱۰' },
        { id: 2, eventId: 1, name: 'سارا محمدی', email: 'sara@email.com', phone: '۰۹۱۲۲۳۴۵۶۷۸', status: 'confirmed', date: '۱۴۰۵/۰۲/۱۱' },
        { id: 3, eventId: 2, name: 'مهدی کریمی', email: 'mehdi@email.com', phone: '۰۹۱۲۳۴۵۶۷۸۹', status: 'pending', date: '۱۴۰۵/۰۲/۱۲' }
      ];

      galleryImages = [
        { id: 1, url: 'https://via.placeholder.com/300x300/6366f1/ffffff?text=Event+1' },
        { id: 2, url: 'https://via.placeholder.com/300x300/10b981/ffffff?text=Event+2' },
        { id: 3, url: 'https://via.placeholder.com/300x300/f59e0b/ffffff?text=Event+3' }
      ];

      reminders = [
        { id: 1, eventId: 1, message: 'کنفرانس بین‌المللی فناوری در ۳ روز آینده برگزار می‌شود!', date: '۱۴۰۵/۰۲/۰۵' },
        { id: 2, eventId: 2, message: 'کارگاه React فردا برگزار می‌شود، فراموش نکنید!', date: '۱۴۰۵/۰۲/۰۶' }
      ];

      nextEventId = 4;
      nextRegistrantId = 4;
      nextImageId = 4;
    }

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { events: 0, calendar: 1, gallery: 2, admin: 3 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'events') renderEvents();
      if (tabName === 'calendar') renderCalendar();
      if (tabName === 'gallery') renderGallery();
      if (tabName === 'admin') renderAdmin();
    }

    // ===== رندر رویدادها =====
    function renderEvents() {
      const grid = document.getElementById('eventGrid');
      if (events.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">هنوز رویدادی ایجاد نشده است.</p>';
        return;
      }
      grid.innerHTML = events.map(e => {
        const today = new Date().toISOString().split('T')[0];
        let status = 'upcoming';
        if (e.date < today) status = 'past';
        else if (e.date === today) status = 'ongoing';
        const statusText = { upcoming: 'آینده', ongoing: 'در حال برگزاری', past: 'گذشته' };
        const regCount = registrants.filter(r => r.eventId === e.id && r.status !== 'cancelled').length;
        const isFull = regCount >= e.capacity;

        return `
          <div class="event-card" onclick="viewEvent(${e.id})">
            <div class="image">
              <i class="fas fa-calendar-alt"></i>
              <span class="date-badge">${e.date}</span>
              <span class="capacity-badge"><i class="fas fa-users"></i> ${regCount}/${e.capacity}</span>
            </div>
            <div class="content">
              <div class="title">${e.title}</div>
              <div class="location"><i class="fas fa-map-marker-alt"></i> ${e.location}</div>
              <div class="desc">${e.description}</div>
              <div class="meta">
                <span class="status ${status}">${statusText[status]}</span>
                <span>${e.category}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== مشاهده رویداد =====
    function viewEvent(eventId) {
      const event = events.find(e => e.id === eventId);
      if (!event) return;
      const regCount = registrants.filter(r => r.eventId === eventId && r.status !== 'cancelled').length;
      const isFull = regCount >= event.capacity;
      const isRegistered = registrants.some(r => r.eventId === eventId && r.status === 'confirmed');

      if (confirm(
        `📌 ${event.title}\n` +
        `📅 تاریخ: ${event.date} | 🕐 ${event.time}\n` +
        `📍 ${event.location}\n` +
        `👥 ${regCount}/${event.capacity} نفر\n` +
        `📝 ${event.description}\n\n` +
        (isRegistered ? '✅ شما قبلاً ثبت‌نام کرده‌اید!' :
         isFull ? '❌ ظرفیت رویداد تکمیل شده است!' :
         'آیا می‌خواهید در این رویداد ثبت‌نام کنید؟')
      )) {
        if (!isRegistered && !isFull) {
          registerForEvent(eventId);
        }
      }
    }

    // ===== ثبت‌نام =====
    function registerForEvent(eventId) {
      const name = prompt('نام کامل:');
      if (!name || !name.trim()) return;
      const email = prompt('ایمیل:');
      if (!email || !email.trim()) return;
      const phone = prompt('شماره تماس:');
      if (!phone || !phone.trim()) return;

      registrants.push({
        id: nextRegistrantId++,
        eventId: eventId,
        name: name.trim(),
        email: email.trim(),
        phone: phone.trim(),
        status: 'confirmed',
        date: new Date().toLocaleDateString('fa-IR')
      });

      const event = events.find(e => e.id === eventId);
      showNotification(`✅ ثبت‌نام شما در "${event.title}" با موفقیت انجام شد!`);
      renderEvents();
      renderAdmin();
    }

    // ===== ایجاد رویداد =====
    function createEvent() {
      const title = document.getElementById('eventTitle').value.trim();
      const category = document.getElementById('eventCategory').value;
      const date = document.getElementById('eventDate').value;
      const time = document.getElementById('eventTime').value;
      const location = document.getElementById('eventLocation').value.trim();
      const capacity = parseInt(document.getElementById('eventCapacity').value);
      const description = document.getElementById('eventDescription').value.trim();

      if (!title || !date || !location || !capacity || !description) {
        showNotification('❌ لطفاً تمام فیلدها را پر کنید!');
        return;
      }

      events.push({
        id: nextEventId++,
        title, category, date, time, location, capacity, description,
        registrants: []
      });

      clearForm();
      renderEvents();
      renderAdmin();
      showNotification('✅ رویداد با موفقیت ایجاد شد!');
      showTab('events');
    }

    // ===== پاک کردن فرم =====
    function clearForm() {
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDate').value = '';
      document.getElementById('eventTime').value = '';
      document.getElementById('eventLocation').value = '';
      document.getElementById('eventCapacity').value = '';
      document.getElementById('eventDescription').value = '';
    }

    // ===== تقویم =====
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthNames = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
      const dayNames = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

      document.getElementById('calendarMonth').textContent = `${monthNames[currentMonth]} ${currentYear}`;

      let html = dayNames.map(d => `<div class="day-name">${d}</div>`).join('');

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      // روزهای خالی
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="day other-month"></div>`;
      }

      // روزهای ماه
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = dateStr === todayStr;
        const hasEvent = events.some(e => e.date === dateStr);
        const eventCount = events.filter(e => e.date === dateStr).length;

        let classes = 'day';
        if (isToday) classes += ' today';
        if (hasEvent) classes += ' has-event';

        html += `
          <div class="${classes}" onclick="showEventsOnDate('${dateStr}')">
            ${d}
            ${eventCount > 0 ? `<span class="event-count">${eventCount}</span>` : ''}
          </div>
        `;
      }

      grid.innerHTML = html;
      renderMonthEvents();
    }

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar();
    }

    function showEventsOnDate(dateStr) {
      const dayEvents = events.filter(e => e.date === dateStr);
      if (dayEvents.length === 0) {
        showNotification('در این روز رویدادی وجود ندارد');
        return;
      }
      const list = dayEvents.map(e => `• ${e.title} (${e.location})`).join('\n');
      alert(`📅 رویدادهای ${dateStr}:\n\n${list}`);
    }

    function renderMonthEvents() {
      const container = document.getElementById('monthEvents');
      const monthEvents = events.filter(e => {
        const [y, m] = e.date.split('-').map(Number);
        return y === currentYear && m === currentMonth + 1;
      });
      if (monthEvents.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">هیچ رویدادی در این ماه وجود ندارد.</p>';
      } else {
        container.innerHTML = monthEvents.map(e => `
          <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-color);">
            <span><strong>${e.title}</strong> - ${e.date} ${e.time}</span>
            <span style="color:var(--text-muted);">${e.location}</span>
          </div>
        `).join('');
      }
    }

    // ===== گالری =====
    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      if (galleryImages.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);">تصویری در گالری وجود ندارد.</p>';
        return;
      }
      grid.innerHTML = galleryImages.map(img => `
        <div class="gallery-item" style="background-image:url(${img.url});background-size:cover;background-position:center;">
          <button class="remove" onclick="removeGalleryImage(${img.id})">✕</button>
          ${!img.url.startsWith('http') ? '📸' : ''}
        </div>
      `).join('');
    }

    function addGalleryImage() {
      const url = document.getElementById('galleryImageUrl').value.trim();
      if (!url) { showNotification('لطفاً آدرس تصویر را وارد کنید!'); return; }
      galleryImages.push({ id: nextImageId++, url });
      document.getElementById('galleryImageUrl').value = '';
      renderGallery();
      showNotification('✅ تصویر به گالری اضافه شد!');
    }

    function removeGalleryImage(id) {
      if (confirm('آیا از حذف این تصویر اطمینان دارید؟')) {
        galleryImages = galleryImages.filter(img => img.id !== id);
        renderGallery();
        showNotification('تصویر حذف شد 🗑️');
      }
    }

    // ===== یادآوری =====
    function showReminders() {
      if (reminders.length === 0) {
        showNotification('🔔 هیچ یادآوری وجود ندارد');
        return;
      }
      const list = reminders.map(r => {
        const event = events.find(e => e.id === r.eventId);
        return `📌 ${event ? event.title : 'رویداد'}:\n${r.message}`;
      }).join('\n\n');
      alert(`🔔 یادآوری‌ها:\n\n${list}`);
    }

    function sendReminder(eventId) {
      const event = events.find(e => e.id === eventId);
      if (!event) return;
      const message = prompt(`پیام یادآوری برای "${event.title}":`, `یادآوری: رویداد "${event.title}" در تاریخ ${event.date} برگزار می‌شود.`);
      if (message && message.trim()) {
        reminders.push({
          id: reminders.length + 1,
          eventId: eventId,
          message: message.trim(),
          date: new Date().toLocaleDateString('fa-IR')
        });
        showNotification('✅ یادآوری با موفقیت ارسال شد!');
      }
    }

    // ===== داشبورد مدیریت =====
    function renderAdmin() {
      const total = events.length;
      const totalReg = registrants.filter(r => r.status !== 'cancelled').length;
      const today = new Date().toISOString().split('T')[0];
      const upcoming = events.filter(e => e.date >= today).length;
      const past = events.filter(e => e.date < today).length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statRegistrants').textContent = totalReg;
      document.getElementById('statUpcoming').textContent = upcoming;
      document.getElementById('statPast').textContent = past;

      const list = document.getElementById('registrantsList');
      if (registrants.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);">هیچ ثبت‌نامی وجود ندارد.</p>';
        return;
      }
      list.innerHTML = registrants.map(r => {
        const event = events.find(e => e.id === r.eventId);
        const statusText = { confirmed: 'تأیید شده', pending: 'در انتظار', cancelled: 'لغو شده' };
        return `
          <div class="registrant-item">
            <div class="info">
              <div class="name">${r.name}</div>
              <div class="contact">${r.email} | ${r.phone} | ${event ? event.title : 'رویداد حذف شده'}</div>
            </div>
            <div>
              <span class="status-badge ${r.status}">${statusText[r.status] || r.status}</span>
              ${r.status !== 'cancelled' ? `<button onclick="cancelRegistration(${r.id})" style="padding:2px 10px;background:var(--danger);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.65rem;margin-right:6px;">لغو</button>` : ''}
              ${r.status === 'confirmed' ? `<button onclick="sendReminder(${r.eventId})" style="padding:2px 10px;background:var(--warning);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.65rem;margin-right:6px;">🔔</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function cancelRegistration(registrantId) {
      if (confirm('آیا از لغو این ثبت‌نام اطمینان دارید؟')) {
        const reg = registrants.find(r => r.id === registrantId);
        if (reg) reg.status = 'cancelled';
        renderAdmin();
        renderEvents();
        showNotification('❌ ثبت‌نام لغو شد');
      }
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    initSampleData();
    setLanguage('fa');
    renderEvents();
    renderCalendar();
    renderGallery();
    renderAdmin();

    console.log('✅ سیستم مدیریت رویدادها کامل بارگذاری شد!');
  </script>
</body>
</html>
