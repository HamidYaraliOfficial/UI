<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم رزرواسیون هتل | کامل</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
    :root {
      --bg-primary: #f0f2f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8a8aa8;
      --border-color: #e8ecf1;
      --accent: #e74c3c;
      --accent-hover: #c0392b;
      --success: #27ae60;
      --warning: #f39c12;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.08);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.dark-mode {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3a;
      --text-primary: #e8edf5;
      --text-secondary: #b0b8d0;
      --text-muted: #6a7a9a;
      --border-color: #2a2a4a;
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.5);
    }
    body {
      background: var(--bg-primary);
      min-height:100vh;
      transition: var(--transition);
      color: var(--text-primary);
    }

    /* ===== اسکرول ===== */
    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--text-muted); border-radius:10px; }

    /* ===== دکمه‌های کنترل ===== */
    .control-buttons {
      position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:9999;
    }
    .theme-toggle, .lang-toggle {
      background:var(--bg-card); border:1px solid var(--border-color);
      padding:6px 12px; border-radius:50px; cursor:pointer; font-size:0.65rem;
      display:flex; align-items:center; gap:4px; transition:var(--transition);
      box-shadow:var(--shadow); color:var(--text-primary);
    }
    .theme-toggle:hover, .lang-toggle:hover { transform:scale(1.05); box-shadow:var(--shadow-hover); }
    body.ltr .control-buttons { right:auto; left:12px; }

    /* ===== هدر ===== */
    .header {
      background:var(--bg-secondary); border-bottom:2px solid var(--accent);
      padding:10px 24px; display:flex; justify-content:space-between; align-items:center;
      position:sticky; top:0; z-index:100; box-shadow:var(--shadow);
    }
    .header .logo {
      font-size:1.4rem; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .header .logo i { font-size:1.6rem; }
    .header-actions { display:flex; gap:16px; align-items:center; }
    .header-actions i {
      font-size:1.2rem; cursor:pointer; color:var(--text-secondary);
      transition:var(--transition);
    }
    .header-actions i:hover { color:var(--accent); transform:scale(1.1); }
    .header-avatar {
      width:32px; height:32px; border-radius:50%;
      background:var(--accent); display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:600; font-size:0.8rem; cursor:pointer;
    }
    .header .nav-links {
      display:flex; gap:16px; align-items:center;
    }
    .header .nav-links a {
      color:var(--text-secondary); text-decoration:none; font-weight:500;
      cursor:pointer; transition:var(--transition); font-size:0.85rem;
    }
    .header .nav-links a:hover { color:var(--accent); }
    .header .nav-links a.active { color:var(--accent); font-weight:700; }

    /* ===== محتوای اصلی ===== */
    .main-content {
      max-width:1200px; margin:0 auto; padding:20px 24px;
    }

    /* ===== تب‌ها ===== */
    .tab-content { display:none; animation:fadeIn 0.3s ease; }
    .tab-content.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* ===== جستجو ===== */
    .search-section {
      background:var(--bg-card); border-radius:var(--radius);
      padding:20px; border:1px solid var(--border-color);
      margin-bottom:20px;
    }
    .search-section h2 { margin-bottom:12px; }
    .search-grid {
      display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto;
      gap:12px; align-items:end;
    }
    .search-grid .form-group label { display:block; font-size:0.8rem; font-weight:500; margin-bottom:4px; }
    .search-grid .form-group input, .search-grid .form-group select {
      width:100%; padding:8px 12px; border:1px solid var(--border-color);
      border-radius:8px; background:var(--bg-primary);
      color:var(--text-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .search-grid .form-group input:focus, .search-grid .form-group select:focus {
      border-color:var(--accent); outline:none;
    }
    .search-grid button {
      padding:8px 24px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition); height:42px;
    }
    .search-grid button:hover { background:var(--accent-hover); }

    /* ===== کارت‌های هتل ===== */
    .hotel-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      gap:20px; margin-bottom:24px;
    }
    .hotel-card {
      background:var(--bg-card); border-radius:var(--radius);
      overflow:hidden; box-shadow:var(--shadow);
      transition:var(--transition); border:1px solid var(--border-color);
      cursor:pointer;
    }
    .hotel-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .hotel-card .image {
      height:180px; background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:3rem; position:relative;
    }
    .hotel-card .image .rating {
      position:absolute; bottom:12px; right:12px;
      background:rgba(0,0,0,0.7); color:#fff; padding:4px 12px;
      border-radius:50px; font-size:0.8rem; font-weight:600;
    }
    body.ltr .hotel-card .image .rating { right:auto; left:12px; }
    .hotel-card .content { padding:14px; }
    .hotel-card .content .title { font-size:1.1rem; font-weight:700; }
    .hotel-card .content .location { font-size:0.85rem; color:var(--text-muted); }
    .hotel-card .content .amenities {
      display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;
    }
    .hotel-card .content .amenities span {
      padding:2px 10px; background:var(--bg-primary); border-radius:50px;
      font-size:0.7rem; color:var(--text-secondary);
    }
    .hotel-card .content .meta {
      display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border-color); padding-top:10px;
    }
    .hotel-card .content .meta .price { font-size:1.1rem; font-weight:700; color:var(--accent); }
    .hotel-card .content .meta .price span { font-size:0.7rem; font-weight:400; color:var(--text-muted); }

    /* ===== صفحه هتل ===== */
    .hotel-detail {
      background:var(--bg-card); border-radius:var(--radius);
      padding:24px; border:1px solid var(--border-color);
    }
    .hotel-detail .header {
      display:flex; gap:20px; flex-wrap:wrap; border-bottom:1px solid var(--border-color);
      padding-bottom:16px; margin-bottom:16px;
    }
    .hotel-detail .header .image {
      width:200px; height:150px; border-radius:var(--radius);
      background:linear-gradient(135deg, var(--accent), var(--accent-hover));
      display:flex; align-items:center; justify-content:center; color:#fff; font-size:3rem;
    }
    .hotel-detail .header .info { flex:1; }
    .hotel-detail .header .info h1 { font-size:1.6rem; }
    .hotel-detail .header .info .location { color:var(--text-muted); }
    .hotel-detail .header .info .rating { color:var(--warning); }
    .hotel-detail .header .info .amenities { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
    .hotel-detail .header .info .amenities span {
      padding:4px 14px; background:var(--bg-primary); border-radius:50px;
      font-size:0.8rem;
    }

    /* ===== اتاق‌ها ===== */
    .room-card {
      background:var(--bg-primary); border-radius:var(--radius);
      padding:16px; margin-bottom:12px;
      border:1px solid var(--border-color);
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:12px;
    }
    .room-card .info { flex:1; }
    .room-card .info .name { font-weight:600; font-size:1rem; }
    .room-card .info .features { font-size:0.8rem; color:var(--text-muted); }
    .room-card .info .capacity { font-size:0.8rem; color:var(--text-muted); }
    .room-card .price { font-size:1.2rem; font-weight:700; color:var(--accent); }
    .room-card .price span { font-size:0.7rem; font-weight:400; color:var(--text-muted); }
    .room-card button {
      padding:6px 20px; background:var(--accent); color:#fff;
      border:none; border-radius:8px; font-weight:600;
      cursor:pointer; transition:var(--transition);
    }
    .room-card button:hover { background:var(--accent-hover); }
    .room-card button:disabled { opacity:0.5; cursor:not-allowed; }

    /* ===== نظرات ===== */
    .review-item {
      background:var(--bg-primary); border-radius:var(--radius);
      padding:12px 16px; margin-bottom:10px;
      border:1px solid var(--border-color);
    }
    .review-item .header {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:4px; border-bottom:none; padding:0;
    }
    .review-item .header .user { font-weight:600; font-size:0.9rem; }
    .review-item .header .rating { color:var(--warning); }
    .review-item .header .time { font-size:0.7rem; color:var(--text-muted); }
    .review-item .text { font-size:0.9rem; color:var(--text-secondary); }

    /* ===== رزرو ===== */
    .booking-summary {
      background:var(--bg-primary); border-radius:var(--radius);
      padding:16px; border:1px solid var(--border-color);
    }
    .booking-summary .row {
      display:flex; justify-content:space-between; padding:6px 0;
      border-bottom:1px solid var(--border-color);
    }
    .booking-summary .row:last-child { border-bottom:none; }
    .booking-summary .total { font-weight:700; font-size:1.1rem; color:var(--accent); }
    .booking-summary .payment-btn {
      width:100%; padding:10px; background:var(--success); color:#fff;
      border:none; border-radius:8px; font-weight:700; font-size:1rem;
      cursor:pointer; transition:var(--transition); margin-top:12px;
    }
    .booking-summary .payment-btn:hover { opacity:0.8; }

    /* ===== تقویم ===== */
    .calendar-grid {
      display:grid; grid-template-columns:repeat(7,1fr);
      gap:4px; max-width:600px; margin:0 auto;
    }
    .calendar-grid .day {
      padding:8px; text-align:center; border-radius:6px;
      background:var(--bg-primary); font-size:0.85rem;
      transition:var(--transition);
    }
    .calendar-grid .day:hover { background:var(--border-color); }
    .calendar-grid .day.available { background:var(--success); color:#fff; }
    .calendar-grid .day.booked { background:var(--danger); color:#fff; }
    .calendar-grid .day.partial { background:var(--warning); color:#fff; }
    .calendar-grid .day.today { border:2px solid var(--accent); }

    /* ===== مدیریت رزرو ===== */
    .booking-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; background:var(--bg-card);
      border-radius:var(--radius); border:1px solid var(--border-color);
      margin-bottom:8px;
    }
    .booking-item .info .hotel { font-weight:600; }
    .booking-item .info .details { font-size:0.8rem; color:var(--text-muted); }
    .booking-item .status {
      padding:4px 14px; border-radius:50px; font-size:0.7rem; font-weight:600;
    }
    .booking-item .status.confirmed { background:rgba(39,174,96,0.15); color:var(--success); }
    .booking-item .status.pending { background:rgba(243,156,18,0.15); color:var(--warning); }
    .booking-item .status.cancelled { background:rgba(231,76,60,0.15); color:var(--danger); }
    .booking-item .cancel-btn {
      padding:4px 14px; background:var(--danger); color:#fff;
      border:none; border-radius:6px; cursor:pointer; font-size:0.75rem;
      transition:var(--transition);
    }
    .booking-item .cancel-btn:hover { opacity:0.8; }

    /* ===== نوتیفیکیشن ===== */
    .notification {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--text-primary); color:var(--bg-primary); padding:8px 18px;
      border-radius:10px; font-size:0.8rem; z-index:9999; opacity:0;
      transition:0.5s; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,0.2);
    }
    body.dark-mode .notification { background:#2a2a2a; color:#e8e8e8; }
    .notification.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== واکنش‌گرایی ===== */
    @media (max-width:992px) {
      .header { flex-wrap:wrap; gap:8px; padding:8px 12px; }
      .header .nav-links { flex-wrap:wrap; gap:8px; }
      .search-grid { grid-template-columns:1fr 1fr; }
      .hotel-detail .header .image { width:100%; height:120px; }
      .room-card { flex-direction:column; text-align:center; }
    }
    @media (max-width:768px) {
      .main-content { padding:12px; }
      .search-grid { grid-template-columns:1fr; }
      .hotel-grid { grid-template-columns:1fr; }
      .calendar-grid { max-width:100%; font-size:0.75rem; }
      .control-buttons { top:6px; right:6px; gap:4px; }
      .theme-toggle, .lang-toggle { padding:4px 8px; font-size:0.55rem; }
      .booking-item { flex-direction:column; text-align:center; gap:8px; }
    }
    @media (max-width:480px) {
      .header .logo span { display:none; }
      .header .logo { font-size:1.1rem; }
      .header-actions i { font-size:0.9rem; }
    }

    body.ltr { direction:ltr; text-align:left; }
    body.ltr .hotel-card .image .rating { right:auto; left:12px; }
  </style>
</head>
<body>

  <!-- ===== دکمه‌های کنترل ===== -->
  <div class="control-buttons">
    <button class="theme-toggle" id="themeToggleBtn"><i class="fas fa-moon"></i> <span id="themeLabel">دارک</span></button>
    <button class="lang-toggle" id="langToggleBtn"><i class="fas fa-globe"></i> <span id="langLabel">English</span></button>
  </div>

  <!-- ===== نوتیفیکیشن ===== -->
  <div class="notification" id="notification"></div>

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="logo"><i class="fas fa-hotel"></i> <span id="brandName">رزرو هتل</span></div>
    <div class="nav-links">
      <a class="active" onclick="showTab('search')" data-key="navSearch">جستجو</a>
      <a onclick="showTab('bookings')" data-key="navBookings">رزروهای من</a>
      <a onclick="showTab('calendar')" data-key="navCalendar">تقویم</a>
    </div>
    <div class="header-actions">
      <i class="fas fa-bell" onclick="showNotification('اعلان‌ها 🔔')"></i>
      <div class="header-avatar" onclick="showNotification('پروفایل')">ع</div>
    </div>
  </header>

  <!-- ===== محتوای اصلی ===== -->
  <div class="main-content">

    <!-- ===== تب جستجو ===== -->
    <div class="tab-content active" id="tab-search">
      <div class="search-section">
        <h2><i class="fas fa-search" style="color:var(--accent);"></i> <span data-key="searchTitle">جستجوی هتل</span></h2>
        <div class="search-grid">
          <div class="form-group">
            <label data-key="lblLocation">مکان</label>
            <input type="text" id="searchLocation" placeholder="شهر یا منطقه ..." onkeyup="searchHotels()">
          </div>
          <div class="form-group">
            <label data-key="lblCheckin">تاریخ ورود</label>
            <input type="date" id="searchCheckin" onchange="searchHotels()">
          </div>
          <div class="form-group">
            <label data-key="lblCheckout">تاریخ خروج</label>
            <input type="date" id="searchCheckout" onchange="searchHotels()">
          </div>
          <div class="form-group">
            <label data-key="lblGuests">تعداد مهمان</label>
            <select id="searchGuests" onchange="searchHotels()">
              <option value="1">۱</option>
              <option value="2">۲</option>
              <option value="3">۳</option>
              <option value="4">۴</option>
            </select>
          </div>
          <button onclick="searchHotels()" data-key="searchBtn">جستجو</button>
        </div>
      </div>
      <div class="hotel-grid" id="hotelGrid">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب هتل (جزئیات) ===== -->
    <div class="tab-content" id="tab-hotel-detail">
      <div id="hotelDetailContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب رزرو ===== -->
    <div class="tab-content" id="tab-booking">
      <div id="bookingContainer">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب رزروهای من ===== -->
    <div class="tab-content" id="tab-bookings">
      <h2 style="margin-bottom:16px;"><i class="fas fa-calendar-check" style="color:var(--accent);"></i> <span data-key="myBookings">رزروهای من</span></h2>
      <div id="bookingsList">
        <!-- توسط JS ساخته می‌شود -->
      </div>
    </div>

    <!-- ===== تب تقویم ===== -->
    <div class="tab-content" id="tab-calendar">
      <h2 style="margin-bottom:16px;"><i class="fas fa-calendar-alt" style="color:var(--accent);"></i> <span data-key="calendarTitle">تقویم وضعیت اتاق‌ها</span></h2>
      <div style="background:var(--bg-card);border-radius:var(--radius);padding:20px;border:1px solid var(--border-color);">
        <div style="display:flex;gap:16px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;">
          <span><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--success);"></span> <span data-key="calAvailable">موجود</span></span>
          <span><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--danger);"></span> <span data-key="calBooked">رزرو شده</span></span>
          <span><span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:var(--warning);"></span> <span data-key="calPartial">تأمیم</span></span>
          <span><span style="display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid var(--accent);"></span> <span data-key="calToday">امروز</span></span>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- توسط JS ساخته می‌شود -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // ===== دیکشنری =====
    const dict = {
      fa: {
        brandName: 'رزرو هتل',
        navSearch: 'جستجو',
        navBookings: 'رزروهای من',
        navCalendar: 'تقویم',
        searchTitle: 'جستجوی هتل',
        lblLocation: 'مکان',
        lblCheckin: 'تاریخ ورود',
        lblCheckout: 'تاریخ خروج',
        lblGuests: 'تعداد مهمان',
        searchBtn: 'جستجو',
        myBookings: 'رزروهای من',
        calendarTitle: 'تقویم وضعیت اتاق‌ها',
        calAvailable: 'موجود',
        calBooked: 'رزرو شده',
        calPartial: 'تأمیم',
        calToday: 'امروز',
        bookNow: 'رزرو',
        confirmBooking: 'تأیید رزرو',
        cancelBooking: 'لغو رزرو',
        totalPrice: 'قیمت کل',
        payment: 'پرداخت'
      },
      en: {
        brandName: 'Hotel Booking',
        navSearch: 'Search',
        navBookings: 'My Bookings',
        navCalendar: 'Calendar',
        searchTitle: 'Search Hotels',
        lblLocation: 'Location',
        lblCheckin: 'Check-in',
        lblCheckout: 'Check-out',
        lblGuests: 'Guests',
        searchBtn: 'Search',
        myBookings: 'My Bookings',
        calendarTitle: 'Room Availability Calendar',
        calAvailable: 'Available',
        calBooked: 'Booked',
        calPartial: 'Partial',
        calToday: 'Today',
        bookNow: 'Book Now',
        confirmBooking: 'Confirm Booking',
        cancelBooking: 'Cancel Booking',
        totalPrice: 'Total Price',
        payment: 'Payment'
      }
    };

    let currentLang = 'fa';
    const body = document.body;
    const langBtn = document.getElementById('langToggleBtn');
    const langLabel = document.getElementById('langLabel');

    function setLanguage(lang) {
      currentLang = lang;
      if (lang === 'en') {
        body.classList.add('ltr');
        body.setAttribute('dir', 'ltr');
        document.documentElement.lang = 'en';
        langLabel.textContent = 'فارسی';
      } else {
        body.classList.remove('ltr');
        body.setAttribute('dir', 'rtl');
        document.documentElement.lang = 'fa';
        langLabel.textContent = 'English';
      }
      const d = dict[lang];
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (d[key] !== undefined) el.textContent = d[key];
      });
      document.getElementById('brandName').textContent = d.brandName;
    }

    langBtn.addEventListener('click', function() {
      setLanguage(currentLang === 'fa' ? 'en' : 'fa');
    });

    // ===== دارک مود =====
    const darkToggleBtn = document.getElementById('themeToggleBtn');
    const themeLabel = document.getElementById('themeLabel');

    function toggleDarkMode() {
      body.classList.toggle('dark-mode');
      const isDark = body.classList.contains('dark-mode');
      themeLabel.textContent = isDark ? 'روشن' : 'دارک';
      darkToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i> ${isDark ? 'روشن' : 'دارک'}`;
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);

    // ===== داده‌ها =====
    let hotels = [
      {
        id: 1,
        name: 'هتل پارس',
        location: 'تهران، خیابان ولیعصر',
        rating: 4.8,
        price: 850000,
        amenities: ['وای‌فای', 'استخر', 'سالن ورزشی', 'پارکینگ'],
        rooms: [
          { id: 101, type: 'سوئیت', capacity: 2, price: 1500000, features: 'تخت کینگ، چشم‌انداز شهر' },
          { id: 102, type: 'دلکس', capacity: 2, price: 1200000, features: 'تخت کویین، چشم‌انداز باغ' },
          { id: 103, type: 'استاندارد', capacity: 1, price: 850000, features: 'تخت یک نفره' }
        ],
        reviews: [
          { user: 'علی رضایی', rating: 5, text: 'هتل بسیار عالی و خدمات فوق‌العاده بود.', time: '۲ هفته پیش' },
          { user: 'سارا محمدی', rating: 4, text: 'محل خوب، قیمت مناسب.', time: '۱ ماه پیش' }
        ],
        bookings: []
      },
      {
        id: 2,
        name: 'هتل اسپیناس',
        location: 'اصفهان، میدان نقش جهان',
        rating: 4.6,
        price: 650000,
        amenities: ['وای‌فای', 'رستوران', 'پارکینگ'],
        rooms: [
          { id: 201, type: 'سوئیت', capacity: 2, price: 1100000, features: 'تخت کینگ، چشم‌انداز میدان' },
          { id: 202, type: 'دلکس', capacity: 2, price: 900000, features: 'تخت کویین' }
        ],
        reviews: [
          { user: 'مهدی کریمی', rating: 5, text: 'موقعیت عالی در مرکز شهر.', time: '۳ هفته پیش' }
        ],
        bookings: []
      },
      {
        id: 3,
        name: 'هتل بزرگ شیراز',
        location: 'شیراز، خیابان زند',
        rating: 4.9,
        price: 750000,
        amenities: ['وای‌فای', 'استخر', 'رستوران', 'پارکینگ', 'سالن ورزشی'],
        rooms: [
          { id: 301, type: 'سوئیت', capacity: 3, price: 1800000, features: 'تخت کینگ + تخت اضافی' },
          { id: 302, type: 'دلکس', capacity: 2, price: 1300000, features: 'تخت کویین' },
          { id: 303, type: 'استاندارد', capacity: 1, price: 750000, features: 'تخت یک نفره' }
        ],
        reviews: [],
        bookings: []
      }
    ];

    let userBookings = [
      { id: 1, hotelId: 1, roomId: 101, checkin: '2026-09-15', checkout: '2026-09-17', guests: 2, total: 3000000, status: 'confirmed' },
      { id: 2, hotelId: 2, roomId: 201, checkin: '2026-09-20', checkout: '2026-09-22', guests: 2, total: 2200000, status: 'pending' }
    ];

    let nextBookingId = 3;
    let currentHotelId = null;
    let selectedRoom = null;
    let bookingData = null;

    // ===== تب‌ها =====
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      const target = document.getElementById('tab-' + tabName);
      if (target) target.classList.add('active');

      document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
      const map = { search: 0, bookings: 1, calendar: 2 };
      const links = document.querySelectorAll('.nav-links a');
      if (map[tabName] !== undefined) links[map[tabName]]?.classList.add('active');

      if (tabName === 'search') renderHotels();
      if (tabName === 'bookings') renderBookings();
      if (tabName === 'calendar') renderCalendar();
    }

    // ===== رندر هتل‌ها =====
    function renderHotels(filtered = null) {
      const grid = document.getElementById('hotelGrid');
      const data = filtered || hotels;
      grid.innerHTML = data.map(h => `
        <div class="hotel-card" onclick="viewHotel(${h.id})">
          <div class="image">
            <i class="fas fa-hotel"></i>
            <span class="rating"><i class="fas fa-star" style="color:#fbbf24;"></i> ${h.rating}</span>
          </div>
          <div class="content">
            <div class="title">${h.name}</div>
            <div class="location"><i class="fas fa-map-marker-alt"></i> ${h.location}</div>
            <div class="amenities">
              ${h.amenities.slice(0, 3).map(a => `<span>${a}</span>`).join('')}
              ${h.amenities.length > 3 ? `<span>+${h.amenities.length - 3}</span>` : ''}
            </div>
            <div class="meta">
              <span class="price">${h.price.toLocaleString()} <span>تومان</span></span>
              <span style="font-size:0.8rem;color:var(--text-muted);">${h.rooms.length} اتاق</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== جستجو =====
    function searchHotels() {
      const location = document.getElementById('searchLocation').value.trim().toLowerCase();
      const checkin = document.getElementById('searchCheckin').value;
      const checkout = document.getElementById('searchCheckout').value;
      const guests = parseInt(document.getElementById('searchGuests').value);

      let filtered = hotels;

      if (location) {
        filtered = filtered.filter(h => h.location.toLowerCase().includes(location) || h.name.toLowerCase().includes(location));
      }

      if (checkin && checkout) {
        // بررسی موجودی اتاق‌ها در تاریخ‌های انتخاب‌شده
        filtered = filtered.filter(h => {
          const availableRooms = h.rooms.filter(r => {
            const isBooked = userBookings.some(b =>
              b.hotelId === h.id &&
              b.roomId === r.id &&
              b.status !== 'cancelled' &&
              ((b.checkin <= checkin && b.checkout > checkin) ||
               (b.checkin < checkout && b.checkout >= checkout) ||
               (b.checkin >= checkin && b.checkout <= checkout))
            );
            return !isBooked && r.capacity >= guests;
          });
          return availableRooms.length > 0;
        });
      }

      renderHotels(filtered);
      if (filtered.length === 0) {
        document.getElementById('hotelGrid').innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);" data-key="noResults">هتلی یافت نشد</p>`;
      }
      showNotification(`${filtered.length} هتل یافت شد`);
    }

    // ===== مشاهده هتل =====
    function viewHotel(hotelId) {
      currentHotelId = hotelId;
      const hotel = hotels.find(h => h.id === hotelId);
      if (!hotel) return;
      showTab('hotel-detail');
      const container = document.getElementById('hotelDetailContainer');

      container.innerHTML = `
        <div class="hotel-detail">
          <div class="header">
            <div class="image"><i class="fas fa-hotel"></i></div>
            <div class="info">
              <h1>${hotel.name}</h1>
              <div class="location"><i class="fas fa-map-marker-alt"></i> ${hotel.location}</div>
              <div class="rating"><i class="fas fa-star" style="color:#fbbf24;"></i> ${hotel.rating} (${hotel.reviews.length} نظر)</div>
              <div class="amenities">
                ${hotel.amenities.map(a => `<span><i class="fas fa-check" style="color:var(--success);"></i> ${a}</span>`).join('')}
              </div>
            </div>
          </div>

          <h3 style="margin-bottom:12px;"><i class="fas fa-bed"></i> اتاق‌های موجود</h3>
          ${hotel.rooms.map(r => {
            const isBooked = userBookings.some(b =>
              b.hotelId === hotelId &&
              b.roomId === r.id &&
              b.status !== 'cancelled'
            );
            return `
              <div class="room-card">
                <div class="info">
                  <div class="name">${r.type}</div>
                  <div class="features">${r.features}</div>
                  <div class="capacity"><i class="fas fa-user"></i> ظرفیت: ${r.capacity} نفر</div>
                </div>
                <div class="price">${r.price.toLocaleString()} <span>تومان / شب</span></div>
                <button onclick="startBooking(${hotelId}, ${r.id})" ${isBooked ? 'disabled' : ''}>
                  ${isBooked ? 'ناموجود' : 'رزرو'}
                </button>
              </div>
            `;
          }).join('')}

          <h3 style="margin:16px 0 12px;"><i class="fas fa-comment"></i> نظرات کاربران</h3>
          ${hotel.reviews.length === 0 ? '<p style="color:var(--text-muted);">هنوز نظری ثبت نشده است.</p>' :
            hotel.reviews.map(r => `
              <div class="review-item">
                <div class="header">
                  <span class="user"><i class="fas fa-user"></i> ${r.user}</span>
                  <span class="rating">${'⭐'.repeat(r.rating)}</span>
                  <span class="time">${r.time}</span>
                </div>
                <div class="text">${r.text}</div>
              </div>
            `).join('')
          }

          <div style="margin-top:12px;">
            <h4 style="margin-bottom:8px;">ثبت نظر</h4>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
              <input type="text" id="reviewName" placeholder="نام شما ..." style="flex:1;padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
              <select id="reviewRating" style="padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);">
                <option value="5">⭐</option>
                <option value="4">⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="2">⭐⭐⭐⭐</option>
                <option value="1">⭐⭐⭐⭐⭐</option>
              </select>
              <textarea id="reviewText" placeholder="متن نظر ..." style="flex:2;padding:8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-primary);color:var(--text-primary);resize:vertical;min-height:50px;"></textarea>
              <button onclick="addReview(${hotelId})" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;">ارسال نظر</button>
            </div>
          </div>
        </div>
      `;
    }

    // ===== افزودن نظر =====
    function addReview(hotelId) {
      const name = document.getElementById('reviewName').value.trim() || 'کاربر مهمان';
      const rating = parseInt(document.getElementById('reviewRating').value);
      const text = document.getElementById('reviewText').value.trim();
      if (!text) { showNotification('لطفاً متن نظر را وارد کنید!'); return; }

      const hotel = hotels.find(h => h.id === hotelId);
      if (!hotel) return;

      hotel.reviews.push({
        user: name,
        rating: rating,
        text: text,
        time: 'همین الان'
      });

      // محاسبه میانگین امتیاز
      const total = hotel.reviews.reduce((acc, r) => acc + r.rating, 0);
      hotel.rating = Math.round((total / hotel.reviews.length) * 10) / 10;

      document.getElementById('reviewText').value = '';
      viewHotel(hotelId);
      showNotification('نظر شما با موفقیت ثبت شد ✅');
    }

    // ===== شروع رزرو =====
    function startBooking(hotelId, roomId) {
      const hotel = hotels.find(h => h.id === hotelId);
      const room = hotel.rooms.find(r => r.id === roomId);
      if (!hotel || !room) return;

      selectedRoom = room;
      bookingData = { hotelId, roomId };

      const checkin = document.getElementById('searchCheckin').value || '2026-09-15';
      const checkout = document.getElementById('searchCheckout').value || '2026-09-17';
      const guests = parseInt(document.getElementById('searchGuests').value) || 1;

      const nights = Math.ceil((new Date(checkout) - new Date(checkin)) / (1000 * 60 * 60 * 24));
      const total = room.price * nights;

      showTab('booking');
      const container = document.getElementById('bookingContainer');
      container.innerHTML = `
        <div class="booking-summary">
          <h3 style="margin-bottom:12px;"><i class="fas fa-check-circle" style="color:var(--success);"></i> تأیید رزرو</h3>
          <div class="row"><span>هتل</span><span style="font-weight:600;">${hotel.name}</span></div>
          <div class="row"><span>اتاق</span><span style="font-weight:600;">${room.type}</span></div>
          <div class="row"><span>تاریخ ورود</span><span>${checkin}</span></div>
          <div class="row"><span>تاریخ خروج</span><span>${checkout}</span></div>
          <div class="row"><span>تعداد شب‌ها</span><span>${nights} شب</span></div>
          <div class="row"><span>تعداد مهمان</span><span>${guests} نفر</span></div>
          <div class="row"><span>قیمت هر شب</span><span>${room.price.toLocaleString()} تومان</span></div>
          <div class="row total"><span>قیمت کل</span><span>${total.toLocaleString()} تومان</span></div>
          <button class="payment-btn" onclick="confirmBooking()"><i class="fas fa-credit-card"></i> پرداخت و تأیید رزرو</button>
          <input type="hidden" id="bookingCheckin" value="${checkin}">
          <input type="hidden" id="bookingCheckout" value="${checkout}">
          <input type="hidden" id="bookingGuests" value="${guests}">
          <input type="hidden" id="bookingNights" value="${nights}">
          <input type="hidden" id="bookingTotal" value="${total}">
        </div>
      `;
    }

    // ===== تأیید رزرو =====
    function confirmBooking() {
      if (!bookingData) return;
      const hotel = hotels.find(h => h.id === bookingData.hotelId);
      const room = hotel.rooms.find(r => r.id === bookingData.roomId);
      if (!hotel || !room) return;

      const checkin = document.getElementById('bookingCheckin').value;
      const checkout = document.getElementById('bookingCheckout').value;
      const guests = parseInt(document.getElementById('bookingGuests').value);
      const nights = parseInt(document.getElementById('bookingNights').value);
      const total = parseInt(document.getElementById('bookingTotal').value);

      userBookings.push({
        id: nextBookingId++,
        hotelId: bookingData.hotelId,
        roomId: bookingData.roomId,
        checkin,
        checkout,
        guests,
        total,
        status: 'confirmed'
      });

      showNotification('🎉 رزرو شما با موفقیت تأیید شد!');
      showTab('bookings');
      renderBookings();
    }

    // ===== رندر رزروها =====
    function renderBookings() {
      const container = document.getElementById('bookingsList');
      if (userBookings.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted);">هنوز رزروی ثبت نشده است.</p>';
        return;
      }
      container.innerHTML = userBookings.map(b => {
        const hotel = hotels.find(h => h.id === b.hotelId);
        const room = hotel?.rooms.find(r => r.id === b.roomId);
        const statusMap = {
          confirmed: 'تأیید شده',
          pending: 'در انتظار',
          cancelled: 'لغو شده'
        };
        return `
          <div class="booking-item">
            <div class="info">
              <div class="hotel">${hotel?.name || 'نامشخص'}</div>
              <div class="details">اتاق: ${room?.type || 'نامشخص'} · ${b.checkin} تا ${b.checkout} · ${b.guests} نفر</div>
              <div class="details" style="font-weight:700;">${b.total.toLocaleString()} تومان</div>
            </div>
            <span class="status ${b.status}">${statusMap[b.status] || b.status}</span>
            ${b.status !== 'cancelled' ? `<button class="cancel-btn" onclick="cancelBooking(${b.id})">لغو</button>` : ''}
          </div>
        `;
      }).join('');
    }

    // ===== لغو رزرو =====
    function cancelBooking(bookingId) {
      if (confirm('آیا از لغو این رزرو اطمینان دارید؟')) {
        const booking = userBookings.find(b => b.id === bookingId);
        if (booking) booking.status = 'cancelled';
        renderBookings();
        showNotification('رزرو لغو شد ❌');
      }
    }

    // ===== تقویم =====
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const today = new Date();
      const month = today.getMonth();
      const year = today.getFullYear();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const dayNames = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
      const dayNamesEn = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

      let html = (currentLang === 'fa' ? dayNames : dayNamesEn).map(d => `<div style="font-weight:700;text-align:center;">${d}</div>`).join('');

      // روزهای خالی
      for (let i = 0; i < firstDay; i++) {
        html += `<div class="day" style="background:transparent;"></div>`;
      }

      // روزهای ماه
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();

        // بررسی وضعیت اتاق‌ها در این تاریخ
        let status = 'available';
        let bookedCount = 0;
        let totalRooms = 0;

        hotels.forEach(h => {
          totalRooms += h.rooms.length;
          h.rooms.forEach(r => {
            const isBooked = userBookings.some(b =>
              b.hotelId === h.id &&
              b.roomId === r.id &&
              b.status !== 'cancelled' &&
              b.checkin <= dateStr && b.checkout > dateStr
            );
            if (isBooked) bookedCount++;
          });
        });

        if (bookedCount === 0) status = 'available';
        else if (bookedCount === totalRooms) status = 'booked';
        else status = 'partial';

        const statusClass = status === 'available' ? 'available' : status === 'booked' ? 'booked' : 'partial';
        const todayClass = isToday ? 'today' : '';

        html += `<div class="day ${statusClass} ${todayClass}" onclick="showNotification('${dateStr}: ${status === 'available' ? 'موجود' : status === 'booked' ? 'تکمیل' : 'تأمیم'}')">${d}</div>`;
      }

      grid.innerHTML = html;
    }

    // ===== نوتیفیکیشن =====
    let notifTimeout;

    function showNotification(message) {
      const notif = document.getElementById('notification');
      notif.textContent = message;
      notif.classList.add('show');
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => notif.classList.remove('show'), 2500);
    }

    // ===== تنظیم اولیه =====
    setLanguage('fa');
    renderHotels();
    renderBookings();
    renderCalendar();

    // تنظیم تاریخ‌های پیش‌فرض
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const dayAfter = new Date(today);
    dayAfter.setDate(dayAfter.getDate() + 3);

    document.getElementById('searchCheckin').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('searchCheckout').value = dayAfter.toISOString().split('T')[0];

    console.log('✅ سیستم رزرواسیون هتل کامل بارگذاری شد!');
  </script>
</body>
</html>
